<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>企業網首頁設計稿</title>
<style>
/* ══════════════════════════════════════════════════════════════
   首頁設計稿預覽：左右各一半，桌面版與手機版並排看，框內各自上下捲動。
   版式沿用 0821 手機版確認會議簡報的設計稿頁（圖框可捲、點圖另開原尺寸）。
   ══════════════════════════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#fff;color:#111;overflow:hidden;
  font-family:"Noto Sans TC","PingFang TC","微軟正黑體",-apple-system,"Segoe UI",Roboto,sans-serif}

/* 原型導覽（獨立於內容樣式，七顆等高、寬度隨字數） */
#protoNav{background:#0f1211;display:flex;align-items:center;gap:6px;padding:10px 16px;flex-wrap:wrap;
  box-shadow:rgba(0,0,0,.35) 0 3px 10px -3px;
  font-family:"Red Hat Display","微軟正黑體",Helvetica,Arial,sans-serif}
#protoNav .lab{color:#fff;font-size:12px;opacity:.55;letter-spacing:.12em;margin-right:6px}
#protoNav .navItem{box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;
  /* 寬度隨字數自適應（不再等寬）：七顆＋切換器才排得進較窄的筆電，且一定不折行 */
  height:34px;padding:0 9px;margin:0;white-space:nowrap;
  font-family:inherit;font-size:13px;line-height:1;font-weight:400;
  background:transparent;color:#cfd8d8;border:1px solid #3a4443;border-radius:4px;
  text-decoration:none;cursor:pointer;transition:.15s}
#protoNav .navItem:hover{border-color:#7d979e;color:#fff}
#protoNav .navItem.on{background:#fff;color:#0f1211;border-color:#fff;font-weight:700}
#protoNav .sep{flex:1 1 auto}

/* 視窗較窄的筆電：導覽自動縮一號，七顆＋切換器仍排在同一排 */
@media screen and (max-width:1200px){
  #protoNav{gap:5px;padding:10px 12px}
  #protoNav .lab{margin-right:4px;letter-spacing:.06em}
  #protoNav .navItem{font-size:12px;padding:0 7px}
  #protoNav .sw a{padding:0 8px;font-size:12px}
}

/* 內容區：扣掉導覽列，剩下的高度全給兩張設計稿 */
.wrap{height:calc(100vh - 54px);display:flex;flex-direction:column;padding:14px 20px 16px}
.head{display:flex;gap:24px;margin-bottom:8px}
.head h2{flex:1;min-width:0;font-size:17px;font-weight:700;text-align:center;line-height:1.3}
.head h2 em{font-style:normal;font-weight:400;color:#777;font-size:14px;margin-left:8px}

.figrow{flex:1;display:flex;gap:24px;min-height:0}
.figcell{flex:1;min-width:0;display:flex;flex-direction:column}
/* 圖框：框內上下捲動，圖片寬度貼齊框寬 */
.figbox{flex:1;min-height:0;overflow-y:auto;border:1px solid #e5e5e5;background:#f5f5f5}
.figbox a{display:block;line-height:0}
.figbox img{width:100%;display:block}
/* 手機版原圖只有 682 寬，貼齊整欄會放大失真，固定成手機的實際觀感寬度並置中 */
.figbox.phone{max-width:380px;margin:0 auto;width:100%}
.cap{font-size:13px;color:#777;margin-top:6px;text-align:center}
.cap b{color:#111;font-weight:700}

@media screen and (max-width:900px){
  body{overflow:auto}
  .wrap{height:auto}
  .figrow{flex-direction:column}
  .figbox{max-height:70vh}
  .head{display:none}
  .figcell::before{content:attr(data-title);display:block;font-size:16px;font-weight:700;
    text-align:center;margin-bottom:8px}
}
</style>
</head>
<body>

<div id="protoNav">
  <span class="lab">原型導覽</span>
  <a class="navItem" href="index.html#s1">①型錄內容設定</a>
  <a class="navItem" href="index.html#s3">②產品型錄列表</a>
  <a class="navItem" href="cp-online-p1.html">③ＥＰ僅線上</a>
  <a class="navItem" href="cp-offline-p1.html">④ＥＰ僅線下</a>
  <a class="navItem" href="cp-both-p1.html">⑤ＥＰ全開</a>
  <a class="navItem" href="guide.html">⑥建站引導</a>
  <a class="navItem on" href="design.html">⑦首頁設計稿</a>
  <span class="sep"></span>
</div>

<div class="wrap">
  <div class="head">
    <h2>桌面版<em>1440 × 6983</em></h2>
    <h2>手機版<em>682 × 13913</em></h2>
  </div>

  <div class="figrow">
    <div class="figcell" data-title="桌面版">
      <div class="figbox">
        <a href="assets/home-desktop.jpg" target="_blank" rel="noopener">
          <img src="assets/home-desktop.jpg" alt="企業網首頁桌面版設計稿">
        </a>
      </div>
      <p class="cap">框內可上下捲動　｜　<b>點圖另開原尺寸</b></p>
    </div>

    <div class="figcell" data-title="手機版">
      <div class="figbox phone">
        <a href="assets/home-mobile.jpg" target="_blank" rel="noopener">
          <img src="assets/home-mobile.jpg" alt="企業網首頁手機版設計稿">
        </a>
      </div>
      <p class="cap">框內可上下捲動　｜　<b>點圖另開原尺寸</b></p>
    </div>
  </div>
</div>

</body>
</html>
