<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>管理後台雛形 - 志工服務管理平臺</title>
<style>

:root{
  --brick:#a33a22;      
  --salmon:#f0838b;     
  --salmon-d:#e4737c;
  --green:#1f6b55;      
  --amber:#b7791f;      
  --red:#b3261e;        
  --side:#4f3d37;       
  --side-2:#5d4a43;
  --bg:#f6f4f1;         
  --line:#e6e1dc;
  --ink:#3a2f2b;
  --muted:#7b6b64;
  --white:#fff;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Segoe UI",system-ui,sans-serif;
  font-size:16px; line-height:1.6; color:var(--ink); background:var(--bg);
  -webkit-font-smoothing:antialiased;
}
a{color:var(--brick);}
button{font-family:inherit;font-size:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink);}
h1,h2,h3,h4{margin:0;font-weight:700;}


.layout{display:flex;min-height:100vh;}
.side{
  width:248px;flex:0 0 248px;background:var(--side);color:#fff;
  position:fixed;left:0;top:0;bottom:0;overflow-y:auto;z-index:60;
}
.main{flex:1;margin-left:248px;min-width:0;display:flex;flex-direction:column;}
.top{
  background:#fff;border-bottom:1px solid var(--line);min-height:66px;
  display:flex;align-items:center;gap:16px;padding:10px 24px;position:sticky;top:0;z-index:30;flex-wrap:wrap;
}
.content{padding:24px;flex:1;}


.side__brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.14);}
.side__org{font-size:13px;color:#e4d6d0;letter-spacing:.04em;}
.side__name{font-size:18px;font-weight:700;margin-top:4px;line-height:1.35;}
.side__name small{display:block;font-size:13px;font-weight:400;color:#e9d9d3;margin-top:2px;letter-spacing:.08em;}
.side__sec{font-size:12.5px;color:#cbb6ae;letter-spacing:.1em;padding:16px 18px 6px;}
.navi{display:block;width:100%;text-align:left;background:none;border:0;border-left:4px solid transparent;
  color:#f3e9e5;padding:10px 16px 10px 14px;display:flex;align-items:center;gap:10px;font-size:15.5px;text-decoration:none;}
.navi:hover{background:var(--side-2);color:#fff;}
.navi[data-on]{background:rgba(240,131,139,.16);border-left-color:var(--salmon);color:#fff;font-weight:700;}
.navi .ic{flex:0 0 18px;opacity:.9;}
.navi .cnt{margin-left:auto;background:var(--salmon);color:#5b2b2b;border-radius:999px;font-size:12.5px;
  font-weight:700;padding:1px 8px;line-height:1.6;}
.side__foot{padding:16px 18px 26px;color:#c9b4ac;font-size:12.5px;line-height:1.7;}


.crumb{color:var(--muted);font-size:14px;}
.crumb b{color:var(--ink);font-size:18px;font-weight:700;display:block;line-height:1.35;}
.top__right{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.who{text-align:right;line-height:1.35;}
.who b{font-size:15.5px;}
.who span{display:block;font-size:12.5px;color:var(--muted);}
.rolepill{display:inline-block;background:#f3ece9;color:#6b4c40;border-radius:999px;padding:2px 10px;font-size:12.5px;}
.burger{display:none;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;}


.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:18px;}
.card__h{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.card__h h2{font-size:17px;color:var(--brick);}
.card__h .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;}
.hint{color:var(--muted);font-size:14px;line-height:1.7;}
.hint--box{background:#fbf7f4;border:1px solid var(--line);border-radius:10px;padding:10px 14px;}

.grid{display:grid;gap:16px;}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:820px){.g2,.g3,.g4{grid-template-columns:1fr;}}

.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;text-align:left;width:100%;display:block;}
.stat:hover{border-color:var(--salmon);}
.stat .t{font-size:14px;color:var(--muted);}
.stat .n{font-size:30px;font-weight:700;color:var(--brick);line-height:1.25;margin-top:4px;}
.stat .n small{font-size:16px;color:var(--muted);font-weight:400;}
.stat .s{font-size:13px;color:var(--muted);margin-top:2px;}

.btn{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 14px;font-size:14.5px;color:var(--ink);}
.btn:hover{border-color:#cdc3bc;background:#fbf9f8;}
.btn--pri{background:var(--salmon);border-color:var(--salmon);color:#4a1f22;font-weight:700;}
.btn--pri:hover{background:var(--salmon-d);border-color:var(--salmon-d);}
.btn--danger{color:var(--red);border-color:#e7c9c6;}
.btn--danger:hover{background:#fdf3f2;}
.btn--ok{color:var(--green);border-color:#c6ded6;}
.btn--ok:hover{background:#f1f8f5;}
.btn--sm{padding:4px 10px;font-size:13.5px;border-radius:8px;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;}

.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;line-height:1.7;white-space:nowrap;}
.pill--ok{background:#e8f3ef;color:var(--green);}
.pill--wait{background:#fbf1de;color:#8a5a12;}
.pill--bad{background:#fbeceb;color:var(--red);}
.pill--info{background:#f0eceb;color:#6b5850;}
.pill--tag{background:#fdeef0;color:#8f3b46;}

table.tb{width:100%;border-collapse:collapse;font-size:14.5px;}
table.tb th{background:#faf7f5;color:#6b5850;font-weight:700;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
table.tb td{padding:9px 10px;border-bottom:1px solid #f0ebe7;vertical-align:middle;}
table.tb tr:hover td{background:#fdfbfa;}
table.tb .num{text-align:right;font-variant-numeric:tabular-nums;}
table.tb .sortable{cursor:pointer;}
table.tb .sortable .ar{color:var(--salmon);font-size:12px;}
.tbwrap{overflow-x:auto;}
.empty{padding:26px 10px;text-align:center;color:var(--muted);}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px;}
.fld{display:flex;flex-direction:column;gap:4px;}
.fld>label{font-size:13px;color:var(--muted);}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff;min-width:130px;}
.fld input[type=checkbox]{min-width:0;}
.fld textarea{min-height:84px;resize:vertical;width:100%;}
.fld--wide{flex:1;min-width:220px;}
.fld--wide input,.fld--wide textarea{width:100%;}

.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px;}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;color:var(--muted);font-size:15px;}
.tab[data-on]{color:var(--brick);border-bottom-color:var(--salmon);font-weight:700;}

.mask{position:fixed;inset:0;background:rgba(58,47,43,.38);z-index:70;display:none;}
.mask[data-on]{display:block;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,94vw);background:#fff;z-index:80;
  box-shadow:-8px 0 26px rgba(58,47,43,.18);transform:translateX(102%);transition:transform .22s;overflow-y:auto;}
.drawer[data-on]{transform:none;}
.drawer__h{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:16px 20px;display:flex;align-items:center;gap:12px;}
.drawer__h h2{font-size:17px;color:var(--brick);}
.drawer__b{padding:18px 20px 28px;}
.drawer__f{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:8px;flex-wrap:wrap;}
.x{margin-left:auto;background:none;border:0;font-size:20px;color:var(--muted);line-height:1;padding:2px 6px;}

.modalwrap{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:18px;}
.modalwrap[data-on]{display:flex;}
.modal{background:#fff;border-radius:14px;width:min(560px,100%);max-height:88vh;overflow:auto;border:1px solid var(--line);}
.modal__h{padding:16px 20px 0;}
.modal__h h2{font-size:17px;color:var(--brick);}
.modal__b{padding:12px 20px 4px;}
.modal__f{padding:14px 20px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#3a2f2b;color:#fff;
  border-radius:999px;padding:10px 20px;font-size:14.5px;z-index:120;opacity:0;pointer-events:none;transition:.2s;}
.toast[data-on]{opacity:1;transform:translate(-50%,0);}

.dl{display:grid;grid-template-columns:104px 1fr;gap:6px 14px;font-size:14.5px;margin:0;}
.dl dt{color:var(--muted);}
.dl dd{margin:0;}
.sect{margin:18px 0 8px;font-size:14px;color:var(--brick);font-weight:700;border-bottom:1px solid var(--line);padding-bottom:5px;}

.bar{height:14px;background:#f0ebe7;border-radius:999px;overflow:hidden;}
.bar>i{display:block;height:100%;background:var(--salmon);}
.bar>i[data-ok]{background:var(--green);}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;}
.cal .hd{text-align:center;font-size:13px;color:var(--muted);padding:4px 0;}
.cal .dy{border:1px solid var(--line);border-radius:10px;min-height:96px;padding:6px;background:#fff;font-size:13px;}
.cal .dy[data-off]{background:#f4f0ed;color:var(--muted);}
.cal .dy[data-blank]{border:0;background:none;}
.cal .dy .d{font-weight:700;color:#6b5850;}
.cal .dy .sl{display:block;width:100%;text-align:left;background:#fdeef0;border:0;border-radius:7px;
  padding:3px 6px;margin-top:4px;font-size:12.5px;color:#7d3540;line-height:1.45;}
.cal .dy .sl:hover{background:#fbdfe3;}
.cal .dy .sl[data-full]{background:#eef2f0;color:#3c5c51;}

.qr{width:188px;height:188px;background:#fff;border:8px solid #fff;outline:1px solid var(--line);
  display:grid;grid-template-columns:repeat(11,1fr);grid-template-rows:repeat(11,1fr);gap:2px;}
.qr i{background:#3a2f2b;border-radius:1px;}
.qr[data-dead]{filter:grayscale(1);opacity:.4;}

.tool{position:fixed;right:18px;bottom:18px;z-index:110;background:#fff;border:1px solid var(--line);
  border-radius:999px;padding:7px 15px;font-size:13.5px;color:var(--muted);box-shadow:0 3px 12px rgba(58,47,43,.14);}
.toolbox{position:fixed;right:18px;bottom:62px;z-index:110;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:12px;width:250px;display:none;box-shadow:0 6px 20px rgba(58,47,43,.18);}
.toolbox[data-on]{display:block;}
.toolbox .btn{width:100%;margin-bottom:8px;text-align:left;}
.toolbox p{margin:4px 0 0;font-size:12.5px;color:var(--muted);line-height:1.6;}

.ic{width:18px;height:18px;display:inline-block;vertical-align:-3px;}
.note{font-size:13.5px;color:var(--muted);}
.warn{background:#fbeceb;border:1px solid #f0d5d2;color:#8d2a24;border-radius:10px;padding:10px 14px;font-size:14px;}
.okbox{background:#eef6f2;border:1px solid #cfe4db;color:#1f6b55;border-radius:10px;padding:10px 14px;font-size:14px;}


.chart .row{display:grid;grid-template-columns:minmax(90px,150px) 1fr 100px;gap:10px;align-items:center;margin-bottom:8px;font-size:14px;}
.chart .row .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);}
.mini{display:block;min-width:76px;}

.pickbox{border:1px solid var(--line);border-radius:10px;padding:10px;max-height:240px;overflow:auto;background:#fff;}
.pickbox label{display:block;padding:3px 2px;font-size:14.5px;}

select.need{border-color:#dba9a3;background:#fdf5f4;}

@media(max-width:1024px){
  .side{transform:translateX(-102%);transition:transform .22s;}
  .side[data-on]{transform:none;}
  .main{margin-left:0;}
  .burger{display:inline-flex;}
  .content{padding:16px;}
}
</style>
</head>
<body>
<div class="layout">
  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="top" id="top"></header>
    <main class="content" id="content"></main>
  </div>
</div>
<div class="mask" id="mask"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="modalwrap" id="modalwrap"></div>
<div class="toast" id="toast"></div>
<button class="tool" id="toolbtn" data-act="toolToggle">雛形工具</button>
<div class="toolbox" id="toolbox">
  <button class="btn" data-act="toolReset">重設示範資料</button>
  <a class="btn" href="index.html" style="display:block;text-decoration:none;">切換到志工端</a>
  <p>這是操作雛形，資料皆為虛構。</p>
</div>

<script src="data.js"></script>
<script>
'use strict';
var S = null;
var ME = null;
var F = {};
var PENDING = null;
function boot() {
  S = HCV.load();
  derive();
  ME = HCV.byId(S.admins, S.currentAdminId) || S.admins[0];
}
function derive() {
  if (!S.currentAdminId) {
    S.currentAdminId = 'AD1';
  }
  if (!S.editRequests) {
    S.editRequests = [{
      id: 'ER01',
      attendanceId: 'A003',
      by: '林雅雯',
      at: '2026-10-13 16:40',
      status: '待總管理者確認',
      reason: '志工反映當日館內電腦時間與實際時間不同步，實際到班時間為 09:05，請協助確認。'
    }];
  }
  if (!S.attendanceEdits) {
    S.attendanceEdits = [];
  }
  if (!S.activityCheckins) {
    S.activityCheckins = {};
  }
  if (!S.reportGrants) {
    S.reportGrants = [];
  }
  if (!S.actLog) {
    S.actLog = [{
      id: 'OP03',
      time: '2026-10-13 16:42',
      by: '林雅雯',
      action: '申請編修簽到退時間',
      detail: '王淑芬 10/03 上午場'
    }, {
      id: 'OP02',
      time: '2026-10-12 09:20',
      by: '吳佩珊',
      action: '撤銷違規記點',
      detail: '吳麗華 10/11 早退（事後補請假核准）'
    }, {
      id: 'OP01',
      time: '2026-09-01 11:05',
      by: '陳怡安',
      action: '設定停權',
      detail: '徐文雄（連續缺勤經聯繫未改善）'
    }];
  }
  if (!S.notifyTemplates) {
    S.notifyTemplates = [{
      id: 'TP1',
      event: '排班完成',
      subject: '您的 {月份} 班表已確認',
      body: '{姓名} 志工您好，您的 {月份} 班表已確認，請至志工服務管理平臺查看。'
    }, {
      id: 'TP2',
      event: '班表異動',
      subject: '班表異動通知：{日期} {時段}',
      body: '{姓名} 志工您好，您 {日期} {時段} 於 {地點} 的班別有異動，請至平臺確認。'
    }, {
      id: 'TP3',
      event: '請假申請',
      subject: '{申請人} 請您擔任 {日期} {時段} 的代理人',
      body: '請至平臺回覆是否同意擔任代理人。'
    }, {
      id: 'TP4',
      event: '請假結果',
      subject: '您的請假申請結果：{結果}',
      body: '{姓名} 志工您好，您 {日期} 的請假申請已{結果}。'
    }, {
      id: 'TP5',
      event: '代班邀請',
      subject: '{申請人} 邀請您代班：{日期} {時段} {地點}',
      body: '請至平臺回覆是否接受代班。'
    }, {
      id: 'TP6',
      event: '代班結果',
      subject: '代班結果通知：{日期} {時段}',
      body: '{姓名} 志工您好，{日期} {時段} 的代班已{結果}。'
    }, {
      id: 'TP7',
      event: '空缺班徵求',
      subject: '{日期} {時段} {地點} 徵求代班',
      body: '本班次目前尚缺人手，若您可支援請至平臺回覆。'
    }, {
      id: 'TP8',
      event: '活動報名',
      subject: '活動報名成功：{活動名稱}',
      body: '{姓名} 志工您好，您已成功報名 {活動名稱}（{日期} {時段}）。'
    }, {
      id: 'TP9',
      event: '活動行前提醒',
      subject: '活動提醒：{活動名稱} 將於 {日期} 舉行',
      body: '請準時出席，現場以活動專屬 QR Code 簽到。'
    }, {
      id: 'TP10',
      event: '補登結果',
      subject: '出勤補登結果通知：{日期}',
      body: '{姓名} 志工您好，您 {日期} 的出勤已完成補登，服務時數 {時數} 小時。'
    }];
  }
}
function save() {
  HCV.save(S);
}
function log(action, detail) {
  S.actLog.unshift({
    id: 'OP' + (S.actLog.length + 1),
    time: stamp(),
    by: ME.name,
    action: action,
    detail: detail
  });
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[c];
  });
}
function pad(n) {
  return (n < 10 ? '0' : '') + n;
}
function nowHM() {
  var d = new Date();
  return pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function stamp() {
  return HCV.TODAY + ' ' + nowHM();
}
function mins(hm) {
  if (!hm) {
    return 0;
  }
  var p = hm.split(':');
  return Number(p[0]) * 60 + Number(p[1]);
}
function hm(m) {
  m = Math.max(0, Math.round(m));
  return pad(Math.floor(m / 60)) + ':' + pad(m % 60);
}
function addMin(t, n) {
  return hm(mins(t) + n);
}
function h2(n) {
  return HCV.hoursText(n);
}
function half(n) {
  return Math.floor(Number(n || 0) * 2) / 2;
}
function halfText(n) {
  var v = half(n);
  return v > 0 ? (Math.round(v * 10) / 10).toString() : '-';
}
function ym(d) {
  return d ? d.slice(0, 7) : '';
}
function rocYm(y, m) {
  return Number(y) - 1911 + ' 年 ' + Number(m) + ' 月';
}
function uid(p, list) {
  return p + (list.length + 101);
}
function val(sel) {
  var e = document.querySelector(sel);
  return e ? e.value.trim() : '';
}
function checked(sel) {
  var e = document.querySelector(sel);
  return !!(e && e.checked);
}
function multi(sel) {
  var out = [];
  document.querySelectorAll(sel).forEach(function (e) {
    if (e.checked) {
      out.push(e.value);
    }
  });
  return out;
}
function vol(id) {
  return HCV.byId(S.volunteers, id);
}
function loc(id) {
  return HCV.byId(S.locations, id);
}
function tpl(id) {
  return HCV.byId(S.slotTemplates, id);
}
function grp(id) {
  return HCV.byId(S.groups, id);
}
function unit(id) {
  return HCV.byId(S.units, id);
}
function vname(id) {
  var v = vol(id);
  return v ? v.name : id || '—';
}
function lname(id) {
  var l = loc(id);
  return l ? l.name : '—';
}
function tname(id) {
  var t = tpl(id);
  return t ? t.name + ' ' + t.start + '–' + t.end : '—';
}
function isSuper() {
  return ME.role === '總管理者';
}
function isReportOnly() {
  return ME.role === '報表檢視';
}
function isLocal() {
  return ME.role === '地點管理者';
}
function myLocIds() {
  if (isLocal()) {
    return ME.locationIds.slice();
  }
  return S.locations.map(function (l) {
    return l.id;
  });
}
function inScope(locationId) {
  return myLocIds().indexOf(locationId) >= 0;
}
function myLocs() {

function todayState(vid, slot) {
  var lv = S.leaves.filter(function (l) {
    return l.volunteerId === vid && l.status === '已核准' && l.slotIds.indexOf(slot.id) >= 0;
  });
  if (lv.length) {
    return '已請假';
  }
  var a = attOn(slot.date, vid).filter(function (x) {
    return x.locationId === slot.locationId;
  })[0];
  if (!a) {
    return '未簽到';
  }
  if (a.checkIn && a.checkOut) {
    return '已簽退';
  }
  if (a.checkIn) {

  }
  return '未簽到';

function slotRange(a) {
  var m = (a.slotName || '').match(/(\d{2}:\d{2})[^\d]+(\d{2}:\d{2})/);
  return m ? {
    start: m[1],
    end: m[2]
  } : null;
}
function tplByRange(r) {
  if (!r) {
    return null;
  }
  return S.slotTemplates.filter(function (t) {
    return t.start === r.start && t.end === r.end;
  })[0] || null;
}
function recalcAtt(a) {
  var r = slotRange(a);
  if (!r) {
    return;
  }
  var t = tplByRange(r);
  var g = t ? t.graceMinutes : 0;
  var st = mins(r.start),
    en = mins(r.end);
  if (!a.checkIn) {
    a.countedFrom = '';
    a.countedTo = '';
    a.hours = 0;
    return;
  }
  var cin = mins(a.checkIn);
  var from = cin <= st + g ? st : cin;
  a.countedFrom = hm(from);
  if (!a.checkOut) {
    a.countedTo = '';
    a.hours = 0;
  } else {
    var co = mins(a.checkOut);
    var to = co >= en ? en : co;
    a.countedTo = hm(to);
    a.hours = Math.round((to - from) / 60 * 100) / 100;
  }
  if (['正常', '緩衝內到班', '遲到', '早退', '固定早退'].indexOf(a.status) < 0) {
    return;
  }
  if (t && t.earlyLeave) {
    a.status = '固定早退';
    a.hours = t.hours;
  } else if (cin > st + g) {
    a.status = '遲到';
  } else if (a.checkOut && mins(a.checkOut) < en) {
    a.status = '早退';
  } else if (cin > st) {
    a.status = '緩衝內到班';
  } else {
    a.status = '正常';
  }
}

}

  recalcAtt(a);
  var r = slotRange(a);

function qrBlock(seed, dead) {
  var h = 7;
  for (var i = 0; i < seed.length; i++) {
    h = (h * 31 + seed.charCodeAt(i)) % 99991;
  }
  var cells = '';
  for (var r = 0; r < 121; r++) {
    var x = r % 11,
      y = Math.floor(r / 11);
    var corner = x < 3 && y < 3 || x > 7 && y < 3 || x < 3 && y > 7;
    var on;
    if (corner) {
      var cx = x > 7 ? x - 8 : x,
        cy = y > 7 ? y - 8 : y;
      on = cx === 0 || cx === 2 || cy === 0 || cy === 2;
    } else {
      h = (h * 1103515 + 12345) % 2147483647;
      on = h % 100 < 46;
    }
    cells += on ? '<i></i>' : '<i style="background:transparent"></i>';
  }
  return '<div class="qr"' + (dead ? ' data-dead' : '') + '>' + cells + '</div>';
}

  var st = {

      st.leaves++;
    }
  });
  return st;

function hqLocHours(locationId, from, to) {
  var res = {
    shift: 0,
    training: 0
  };
  S.attendance.forEach(function (a) {
    if (a.locationId !== locationId || a.date < from || a.date > to) {
      return;
    }
    if (a.decision === '不發時數' || a.decision === '待決定') {
      return;
    }
    res.shift += a.hours || 0;
  });
  S.activities.forEach(function (ac) {
    if (ac.locationId !== locationId || ac.date < from || ac.date > to) {
      return;
    }
    var done = S.activityCheckins[ac.id];
    if (!done || !done.length) {
      return;
    }
    if (ac.kind === '教育訓練') {
      res.training += ac.hours * done.length;
    } else {
      res.shift += ac.hours * done.length;
    }
  });
  return res;
}

ACTIONS.holCreate = function () {

    mi,
    dd,
    ds,
    week = '';

var ROLE_MATRIX = [['排班與時段維護', '本地點', '全部地點', '—'], ['固定班表批次匯入', '本地點', '全部地點', '—'], ['新進志工審查', '本地點', '全部地點', '—'], ['志工資料維護（組別、聯絡方式）', '本地點', '全部地點', '—'], ['請假與代班審核、手動指定代理人', '本地點', '全部地點', '—'], ['長假第二關簽核', '✘', '✔', '—'], ['出勤紀錄檢視', '本地點', '全部地點', '—'], ['出勤補登（須填原因）', '本地點', '全部地點', '—'], ['修改簽到退時間', '✘（只能提出申請編修）', '✔', '—'], ['違規記點新增與調整', '本地點', '全部地點', '—'], ['停權與除名（須填原因）', '✘', '✔', '—'], ['休館日與假日設定', '本地點', '全部地點預設', '—'], ['活動開設與管理', '本地點', '全部地點', '—'], ['現場簽到工具（QR 與借閱證）', '本地點', '全部地點', '—'], ['公告發布與通知發送', '本地點', '全部地點', '—'], ['報表產出與匯出', '申請授權後查閱本地點', '✔（全部地點）', '✔（檢視與匯出）'], ['館別與系統參數', '✘', '✔', '—'], ['帳號與權限管理', '✘', '✔', '—'], ['看得到的資料範圍', '本服務地點', '全部服務地點', '全部服務地點（唯讀）']];
function matrixCell(x) {
  if (x === '✘') {
    return '<b style="color:var(--red)">✘</b>';
  }
  if (x === '—') {
    return '<span class="note">—</span>';
  }
  if (x.indexOf('✔') === 0) {
    return '<b style="color:var(--green)">' + esc(x) + '</b>';
  }
  return esc(x);
}
function adminScopeText(a) {
  if (a.role === '地點管理者') {
    return a.locationIds.length ? a.locationIds.map(lname).join('、') : '尚未指定';
  }
  if (a.role === '報表檢視') {
    return '全部服務地點（唯讀）';
  }
  return '全部服務地點';
}
PAGES.accounts = function () {
  var rows = S.admins.map(function (a) {
    var btns = '<button class="btn btn--sm" data-act="adEdit" data-id="' + a.id + '">編輯</button>';
    if (a.id === ME.id) {
      btns += ' <span class="note">目前登入中</span>';
    } else if (a.disabled) {
      btns += ' <button class="btn btn--sm btn--ok" data-act="adEnable" data-id="' + a.id + '">啟用</button>';
    } else {
      btns += ' <button class="btn btn--sm btn--danger" data-act="adDisable" data-id="' + a.id + '">停用</button>';
    }
    return ['<b>' + esc(a.name) + '</b>', esc(a.unit), esc(a.email || '—'), pill(a.role, a.role === '總管理者' ? 'ok' : 'tag'), a.role === '地點管理者' && !a.locationIds.length ? pill('尚未指定', 'wait') : esc(adminScopeText(a)), a.disabled ? pill('停用', 'bad') : pill('啟用中', 'ok'), '<div class="btnrow">' + btns + '</div>'];
  });
  var html = card('後台帳號', table([{
    t: '姓名'
  }, {
    t: '單位'
  }, {
    t: 'Email'
  }, {
    t: '角色'
  }, {
    t: '授權服務地點'
  }, {
    t: '狀態'
  }, {
    t: ''
  }], rows, '') + '<p class="hint" style="margin-top:12px">後台帳號不開放給志工，志工一律使用志工端。' + '停用後立即無法登入，該帳號過去留下的操作紀錄全部保留。</p>', '<button class="btn btn--pri" data-act="adNew">新增帳號</button>');
  html += card('角色權限對照', table([{
    t: '功能'
  }, {
    t: '服務地點管理者'
  }, {
    t: '文化局總管理者'
  }, {
    t: '報表檢視'
  }], ROLE_MATRIX.map(function (r) {
    return ['<b>' + esc(r[0]) + '</b>', matrixCell(r[1]), matrixCell(r[2]), matrixCell(r[3])];
  }), '') + '<p class="hint" style="margin-top:12px">兩條紅線：<b>修改簽到退時間</b>與<b>停權、除名</b>只有文化局總管理者做得到，' + '服務地點管理者的畫面上連按鈕都不會出現，只能提出申請。</p>');
  html += card('操作紀錄', table([{
    t: '時間'
  }, {
    t: '操作者'
  }, {
    t: '動作'
  }, {
    t: '內容'
  }], S.actLog.slice(0, 40).map(function (o) {
    return [esc(o.time), esc(o.by), '<b>' + esc(o.action) + '</b>', esc(o.detail)];
  }), '目前沒有操作紀錄') + '<p class="hint" style="margin-top:12px">排班調整、出勤補登與編修、違規開立與撤銷、參數變更等每一個寫入動作，' + '都會記下操作者、時間與異動內容供稽核查詢。</p>');
  return html;
};
function adForm(a) {
  return '<div class="filters">' + '<div class="fld"><label>姓名</label><input type="text" id="adName" value="' + esc(a ? a.name : '') + '"></div>' + '<div class="fld"><label>單位</label><input type="text" id="adUnit" value="' + esc(a ? a.unit : '文化局') + '"></div>' + '<div class="fld fld--wide"><label>Email</label><input type="text" id="adMail" value="' + esc(a && a.email ? a.email : '') + '"></div>' + '</div>' + '<div class="fld" style="margin-top:10px"><label>角色</label><select id="adRole" data-change="adRole">' + ROLES.map(function (r) {
    return '<option' + (a && a.role === r ? ' selected' : '') + '>' + r + '</option>';
  }).join('') + '</select></div>' + '<div id="adLocBox" style="margin-top:12px;display:' + (!a || a.role === '地點管理者' ? '' : 'none') + '">' + '<div class="sect">授權服務地點（可複選）</div><div class="pickbox">' + S.locations.map(function (l) {
    return '<label><input type="checkbox" class="adL" value="' + l.id + '"' + (a && a.locationIds.indexOf(l.id) >= 0 ? ' checked' : '') + '> ' + esc(l.name + '　' + unit(l.unitId).name) + '</label>';
  }).join('') + '</div></div>' + '<p class="hint" style="margin-top:12px">授權服務地點決定這個帳號看得到哪些資料。' + '總管理者與報表檢視為全部地點，不需勾選。<br>' + '登入密碼由既有的後台帳號模組管理，本畫面不設定密碼。</p>';
}
ACTIONS.adRole = function (el) {
  var box = document.getElementById('adLocBox');
  if (box) {
    box.style.display = el.value === '地點管理者' ? '' : 'none';
  }
};
ACTIONS.adNew = function () {
  openDrawer('新增後台帳號', adForm(null), '<button class="btn btn--pri" data-act="adSave">建立帳號</button><button class="btn" data-act="closeDrawer">取消</button>');
};
ACTIONS.adEdit = function (el) {
  var a = HCV.byId(S.admins, el.getAttribute('data-id'));
  openDrawer('編輯帳號：' + a.name, adForm(a), '<button class="btn btn--pri" data-act="adSave" data-id="' + a.id + '">儲存</button>' + '<button class="btn" data-act="closeDrawer">取消</button>');
};
ACTIONS.adSave = function (el) {
  var id = el.getAttribute('data-id');
  var name = val('#adName');
  if (!name) {
    toast('請填姓名');
    return;
  }
  var role = val('#adRole');
  var locs = role === '地點管理者' ? multi('.adL') : [];
  if (role === '地點管理者' && !locs.length) {
    toast('服務地點管理者至少要授權一個地點');
    return;
  }
  if (id === ME.id && role !== '總管理者') {
    toast('不能把自己改成其他角色，請由另一位總管理者調整');
    return;
  }
  var a = id ? HCV.byId(S.admins, id) : {
    id: 'AD' + (S.admins.length + 11)
  };
  a.name = name;
  a.unit = val('#adUnit') || '文化局';
  a.email = val('#adMail');
  a.role = role;
  a.locationIds = locs;
  if (!id) {
    S.admins.push(a);
  }
  log(id ? '編輯後台帳號' : '新增後台帳號', a.name + '（' + a.role + '　' + adminScopeText(a) + '）');
  save();
  closeDrawer();
  render();
  toast(id ? '已儲存帳號設定' : '已新增帳號 ' + a.name);
};
ACTIONS.adDisable = function (el) {
  var a = HCV.byId(S.admins, el.getAttribute('data-id'));
  confirmBox({
    title: '停用帳號：' + a.name,
    okText: '停用',
    reason: '停用原因（必填）',
    body: '<p>停用後立即無法登入後台，' + esc(a.name) + ' 過去的操作紀錄全部保留。</p>',
    onOk: function (r) {
      a.disabled = true;
      log('停用後台帳號', a.name + '（' + r + '）');
      save();
      render();
      toast('已停用 ' + a.name + ' 的帳號');
    }
  });
};
ACTIONS.adEnable = function (el) {
  var a = HCV.byId(S.admins, el.getAttribute('data-id'));
  a.disabled = false;
  log('啟用後台帳號', a.name);
  save();
  render();
  toast('已啟用 ' + a.name + ' 的帳號');
};
boot();
render();
</script>
</body>
</html>
