<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>管理後台原型 - 志工服務管理平臺</title>
<style>

:root{
  --brick:#a33a22;      
  --salmon:#f0838b;     
  --salmon-d:#e4737c;
  --green:#1f6b55;      
  --amber:#b7791f;      
  --red:#b3261e;        
  --side:#4f3d37;       
  --side-2:#5d4a43;
  --bg:#f6f4f1;         
  --line:#e6e1dc;
  --ink:#3a2f2b;
  --muted:#7b6b64;
  --white:#fff;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Segoe UI",system-ui,sans-serif;
  font-size:16px; line-height:1.6; color:var(--ink); background:var(--bg);
  -webkit-font-smoothing:antialiased;
}
a{color:var(--brick);}
button{font-family:inherit;font-size:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink);}
h1,h2,h3,h4{margin:0;font-weight:700;}


.layout{display:flex;min-height:100vh;}
.side{
  width:248px;flex:0 0 248px;background:var(--side);color:#fff;
  position:fixed;left:0;top:0;bottom:0;overflow-y:auto;z-index:60;
}
.main{flex:1;margin-left:248px;min-width:0;display:flex;flex-direction:column;}
.top{
  background:#fff;border-bottom:1px solid var(--line);min-height:66px;
  display:flex;align-items:center;gap:16px;padding:10px 24px;position:sticky;top:0;z-index:30;flex-wrap:wrap;
}
.content{padding:24px;flex:1;}


.side__brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.14);}
.side__org{font-size:13px;color:#e4d6d0;letter-spacing:.04em;}
.side__name{font-size:18px;font-weight:700;margin-top:4px;line-height:1.35;}
.side__name small{display:block;font-size:13px;font-weight:400;color:#e9d9d3;margin-top:2px;letter-spacing:.08em;}
.side__sec{font-size:12.5px;color:#cbb6ae;letter-spacing:.1em;padding:16px 18px 6px;}
.navi{display:block;width:100%;text-align:left;background:none;border:0;
  color:#f3e9e5;padding:10px 16px 10px 18px;display:flex;align-items:center;gap:10px;font-size:15.5px;text-decoration:none;}
.navi:hover{background:var(--side-2);color:#fff;}
.navi[data-on]{background:rgba(240,131,139,.24);color:#fff;font-weight:700;}
.navi .ic{flex:0 0 18px;opacity:.9;}
.navi .cnt{margin-left:auto;background:var(--salmon);color:#5b2b2b;border-radius:999px;font-size:12.5px;
  font-weight:700;padding:1px 8px;line-height:1.6;}
.side__foot{padding:16px 18px 26px;color:#c9b4ac;font-size:12.5px;line-height:1.7;}


.crumb{color:var(--muted);font-size:14px;}
.crumb b{color:var(--ink);font-size:18px;font-weight:700;display:block;line-height:1.35;}
.top__right{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0;}
.top__right select{max-width:min(320px,70vw);}
.who{text-align:right;line-height:1.35;}
.who b{font-size:15.5px;}
.who span{display:block;font-size:12.5px;color:var(--muted);}
.rolepill{display:inline-block;background:#f3ece9;color:#6b4c40;border-radius:999px;padding:2px 10px;font-size:12.5px;}
.burger{display:none;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;}


.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:18px;}
.card__h{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.card__h h2{font-size:17px;color:var(--brick);}
.card__h .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;}
.hint{color:var(--muted);font-size:14px;line-height:1.7;}
.hint--box{background:#fbf7f4;border:1px solid var(--line);border-radius:10px;padding:10px 14px;}

.grid{display:grid;gap:16px;}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:820px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr);}}

.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;text-align:left;width:100%;display:block;}
.stat:hover{border-color:var(--salmon);}
.stat .t{font-size:14px;color:var(--muted);}
.stat .n{font-size:30px;font-weight:700;color:var(--brick);line-height:1.25;margin-top:4px;}
.stat .n small{font-size:16px;color:var(--muted);font-weight:400;}
.stat .s{font-size:13px;color:var(--muted);margin-top:2px;}

.btn{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 14px;font-size:14.5px;color:var(--ink);}
.btn:hover{border-color:#cdc3bc;background:#fbf9f8;}
.btn--pri{background:var(--salmon);border-color:var(--salmon);color:#4a1f22;font-weight:700;}
.btn--pri:hover{background:var(--salmon-d);border-color:var(--salmon-d);}
.btn--danger{color:var(--red);border-color:#e7c9c6;}
.btn--danger:hover{background:#fdf3f2;}
.btn--ok{color:var(--green);border-color:#c6ded6;}
.btn--ok:hover{background:#f1f8f5;}
.btn--sm{padding:4px 10px;font-size:13.5px;border-radius:8px;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;}

.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;line-height:1.7;white-space:nowrap;}
.pill--ok{background:#e8f3ef;color:var(--green);}
.pill--wait{background:#fbf1de;color:#8a5a12;}
.pill--bad{background:#fbeceb;color:var(--red);}
.pill--info{background:#f0eceb;color:#6b5850;}
.pill--tag{background:#fdeef0;color:#8f3b46;}

table.tb{width:100%;border-collapse:collapse;font-size:14.5px;}
table.tb th{background:#faf7f5;color:#6b5850;font-weight:700;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
table.tb td{padding:9px 10px;border-bottom:1px solid #f0ebe7;vertical-align:middle;}
table.tb tr:hover td{background:#fdfbfa;}
table.tb .num{text-align:right;font-variant-numeric:tabular-nums;}
table.tb .sortable{cursor:pointer;}
table.tb .sortable .ar{color:var(--salmon);font-size:12px;}
.tbwrap{overflow-x:auto;}
.empty{padding:26px 10px;text-align:center;color:var(--muted);}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px;}
.fld{display:flex;flex-direction:column;gap:4px;}
.fld>label{font-size:13px;color:var(--muted);}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff;min-width:130px;}
.fld input[type=checkbox]{min-width:0;}
.fld textarea{min-height:84px;resize:vertical;width:100%;}
.fld--wide{flex:1;min-width:220px;}
.fld--wide input,.fld--wide textarea{width:100%;}

.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px;}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;color:var(--muted);font-size:15px;}
.tab[data-on]{color:var(--brick);border-bottom-color:var(--salmon);font-weight:700;}

.mask{position:fixed;inset:0;background:rgba(58,47,43,.38);z-index:70;display:none;}
.mask[data-on]{display:block;}

.drawer{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(640px,calc(100vw - 36px));max-height:88vh;
  background:#fff;z-index:80;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(58,47,43,.2);
  overflow-y:auto;display:none;}
.drawer[data-on]{display:block;}
body.lock{overflow:hidden;}
.drawer__h{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:16px 20px;display:flex;align-items:center;gap:12px;}
.drawer__h h2{font-size:17px;color:var(--brick);}
.drawer__b{padding:18px 20px 28px;}
.drawer__f{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:8px;flex-wrap:wrap;}
.x{margin-left:auto;background:none;border:0;font-size:20px;color:var(--muted);line-height:1;padding:2px 6px;}

.modalwrap{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:18px;}
.modalwrap[data-on]{display:flex;}
.modal{background:#fff;border-radius:14px;width:min(560px,100%);max-height:88vh;overflow:auto;border:1px solid var(--line);}
.modal__h{padding:16px 20px 0;}
.modal__h h2{font-size:17px;color:var(--brick);}
.modal__b{padding:12px 20px 4px;}
.modal__f{padding:14px 20px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#3a2f2b;color:#fff;
  border-radius:999px;padding:10px 20px;font-size:14.5px;z-index:120;opacity:0;pointer-events:none;transition:.2s;}
.toast[data-on]{opacity:1;transform:translate(-50%,0);}

.dl{display:grid;grid-template-columns:104px 1fr;gap:6px 14px;font-size:14.5px;margin:0;}
.dl dt{color:var(--muted);}
.dl dd{margin:0;}
.sect{margin:18px 0 8px;font-size:14px;color:var(--brick);font-weight:700;border-bottom:1px solid var(--line);padding-bottom:5px;}

.bar{height:14px;background:#f0ebe7;border-radius:999px;overflow:hidden;}
.bar>i{display:block;height:100%;background:var(--salmon);}
.bar>i[data-ok]{background:var(--green);}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;}
.cal .hd{text-align:center;font-size:13px;color:var(--muted);padding:4px 0;}
.cal .dy{border:1px solid var(--line);border-radius:10px;min-height:96px;padding:6px;background:#fff;font-size:13px;}
.cal .dy[data-off]{background:#f4f0ed;color:var(--muted);}
.cal .dy[data-blank]{border:0;background:none;}
.cal .dy .d{font-weight:700;color:#6b5850;}
.cal .dy .sl{display:block;width:100%;text-align:left;background:#fdeef0;border:0;border-radius:7px;
  padding:3px 6px;margin-top:4px;font-size:12.5px;color:#7d3540;line-height:1.45;}
.cal .dy .sl:hover{background:#fbdfe3;}
.cal .dy .sl[data-full]{background:#eef2f0;color:#3c5c51;}

.qr{width:188px;height:188px;background:#fff;border:8px solid #fff;outline:1px solid var(--line);
  display:grid;grid-template-columns:repeat(11,1fr);grid-template-rows:repeat(11,1fr);gap:2px;}
.qr i{background:#3a2f2b;border-radius:1px;}
.qr[data-dead]{filter:grayscale(1);opacity:.4;}

.tool{position:fixed;right:18px;bottom:18px;z-index:110;background:#fff;border:1px solid var(--line);
  border-radius:999px;padding:7px 15px;font-size:13.5px;color:var(--muted);box-shadow:0 3px 12px rgba(58,47,43,.14);}
.toolbox{position:fixed;right:18px;bottom:62px;z-index:110;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:12px;width:250px;display:none;box-shadow:0 6px 20px rgba(58,47,43,.18);}
.toolbox[data-on]{display:block;}
.toolbox .btn{width:100%;margin-bottom:8px;text-align:left;}
.toolbox p{margin:4px 0 0;font-size:12.5px;color:var(--muted);line-height:1.6;}

.ic{width:18px;height:18px;display:inline-block;vertical-align:-3px;}
.note{font-size:13.5px;color:var(--muted);}
.warn{background:#fbeceb;border:1px solid #f0d5d2;color:#8d2a24;border-radius:10px;padding:10px 14px;font-size:14px;}
.okbox{background:#eef6f2;border:1px solid #cfe4db;color:#1f6b55;border-radius:10px;padding:10px 14px;font-size:14px;}


.chart .row{display:grid;grid-template-columns:minmax(90px,150px) 1fr 100px;gap:10px;align-items:center;margin-bottom:8px;font-size:14px;}
.chart .row .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);}
.mini{display:block;min-width:76px;}

.pickbox{border:1px solid var(--line);border-radius:10px;padding:10px;max-height:240px;overflow:auto;background:#fff;}
.pickbox label{display:block;padding:3px 2px;font-size:14.5px;}

.vpick{min-width:240px;}
.vpick .vpick__q{width:100%;}
.vpick__list{border:1px solid var(--line);border-radius:10px;margin-top:4px;background:#fff;max-height:240px;overflow:auto;padding:4px;}
.vpick__list[hidden]{display:none;}
.vpick__opt{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 10px;font-size:14.5px;color:var(--ink);}
.vpick__opt:hover{background:#f6efe9;}
.vpick__opt small{color:var(--muted);margin-left:8px;}
.vpick__none{padding:7px 10px;font-size:14px;color:var(--muted);}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 12px;font-size:14px;background:#fff;}
.chip button{background:none;border:0;color:var(--muted);font-size:13px;padding:2px 6px;}

.minical{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;max-width:380px;}
.minical .hd{text-align:center;font-size:12.5px;color:var(--muted);}
.minical .mc{border:1px solid var(--line);border-radius:6px;background:#fff;padding:6px 0;font-size:14px;color:var(--ink);}
.minical .mc[data-on]{background:var(--salmon);border-color:var(--salmon);color:#4a1f22;font-weight:700;}
.minical .mc[data-hol]{color:#a99c95;background:#f4f0ed;}
.more{background:none;border:0;color:var(--brick);font-size:14.5px;padding:6px 0;}
.subtabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;}
.subtabs .tab{border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:13.5px;}
.subtabs .tab[data-on]{border-color:var(--salmon);background:#fdeef0;color:var(--brick);}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:14px;color:var(--muted);}

select.need{border-color:#dba9a3;background:#fdf5f4;}

.req{color:var(--red);margin-right:2px;}
.vh{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
fieldset.pickbox{margin:0;min-width:0;}
fieldset.pickbox legend{font-size:13px;color:var(--muted);padding:0 4px;}

body.bare .side{display:none;}
body.bare .main{margin-left:0;}

.printarea{display:none;}
@media print{
  body.printing>*{display:none !important;}
  body.printing>.printarea{display:block !important;}
  .printarea h1{font-size:18px;margin:0 0 4px;}
  .printarea p{font-size:12px;margin:0 0 10px;}
  .printarea table{width:100%;border-collapse:collapse;font-size:13px;}
  .printarea th,.printarea td{border:1px solid var(--muted);padding:5px 8px;text-align:left;vertical-align:top;}
}

@media(max-width:1024px){
  .side{transform:translateX(-102%);transition:transform .22s;}
  .side[data-on]{transform:none;}
  .main{margin-left:0;}
  .burger{display:inline-flex;}
  .content{padding:16px;}
}
</style>
</head>
<body>
<div class="layout">
  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="top" id="top"></header>
    <main class="content" id="content"></main>
  </div>
</div>
<div class="mask" id="mask"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="modalwrap" id="modalwrap"></div>
<div class="toast" id="toast"></div>
<button class="tool" id="toolbtn" data-act="toolToggle">原型工具</button>
<div class="toolbox" id="toolbox">
  <p style="margin:0 0 4px;font-weight:700;color:var(--ink)">切換登入身分</p>
  <div id="toolWho" style="margin-bottom:10px"></div>
  <button class="btn" data-act="toolPwMail">模擬點開設定密碼信</button>
  <button class="btn" data-act="toolLoginFail">模擬登入失敗一次（密碼錯誤）</button>
  <p style="margin:-4px 0 10px">在登入畫面用：以畫面上的帳號算一次失敗；連續失敗達系統參數的次數就鎖定。</p>
  <div class="fld"><label for="ckTime">模擬現在時間</label><input type="time" id="ckTime" data-change="toolTime"></div>
  <p style="margin:2px 0 10px">現場簽到工具的代刷條碼與代為登記用這個時間；清空＝依所選場次帶入。</p>
  <button class="btn" data-act="toolReset">重設示範資料</button>
  <a class="btn" href="index.html" style="display:block;text-decoration:none;">切換到志工端</a>
  <p>這是操作原型，資料皆為虛構。</p>
</div>
<div class="printarea" id="printArea"></div>

<script src="data.js"></script>

  }
  [{

  }, {

  }, {

  }, {

  }, {

    detail: '來源 IP 192.0.2.12'
  }, {
    id: 'OPL8',
    time: '2026-10-11 21:03',
    by: '蕭宏仁',
    action: '登入失敗',
    detail: '密碼錯誤（來源 IP 192.0.2.13）'
  }].forEach(function (o) {
    if (!S.actLog.some(function (x) {
      return x.id === o.id;
    })) {
      S.actLog.push(o);
    }
  });
  if (!S.notifyTemplates) {
    S.notifyTemplates = [{
      id: 'TP1',

ACTIONS.volSave = function (el) {

  if (!nm) {
    fieldErr('vdName', '請輸入姓名');
    return;
  }
  if (!checkVolNo('vdNo', v.id)) {
    return;
  }
  var picked = multi('.vg');
  if (!picked.length) {
    toast('至少要選一個組別');
    return;
  }
  var mail = val('#vdMail');
  if (mail && mail.indexOf('@') < 0) {
    toast('電子郵件格式不正確');
    return;
  }
  var ph = val('#vdPhone');
  if (!ph) {
    fieldErr('vdPhone', '請輸入聯絡電話');
    return;
  }
  if (!/^[0-9-]+$/.test(ph)) {
    fieldErr('vdPhone', '聯絡電話只能填數字與連字號');
    return;
  }
  var b4 = {

    no: v.no || '',
    groups: HCV.groupNames(S, v),
    phone: v.phone || '',
    email: v.email || ''
  };
  v.name = nm;
  v.groupIds = picked;
  v.phone = val('#vdPhone');
  v.email = mail;
  v.no = val('#vdNo');
  var ch = [];
  function blank(x, empty) {
    return x ? x : empty;
  }
  if (b4.name !== v.name) {
    ch.push('姓名改為 ' + pn(v.name));
  }
  if (b4.no !== v.no) {
    ch.push('志工編號改為 ' + blank(v.no, '（空白）'));
  }
  if (b4.phone !== v.phone) {
    ch.push('聯絡電話改為 ' + blank(pp(v.phone), '（空白）'));
  }
  if (b4.email !== v.email) {
    ch.push('電子郵件改為 ' + blank(pm(v.email), '（空白）'));
  }
  if (b4.groups !== HCV.groupNames(S, v)) {
    ch.push('組別改為 ' + HCV.groupNames(S, v));
  }
  if (ch.length) {
    log('修改志工資料', pvTag(v) + '：' + ch.join('；'));

function hqLocHours(locationId, from, to) {
  var res = {
    shift: 0,
    training: 0
  };
  S.attendance.forEach(function (a) {
    if (a.locationId !== locationId || a.date < from || a.date > to) {
      return;
    }
    if (a.decision === '不發時數' || a.decision === '待決定') {
      return;
    }
    res.shift += a.hours || 0;
  });
  S.activities.forEach(function (ac) {
    if (ac.locationId !== locationId || ac.date < from || ac.date > to) {
      return;
    }
    var done = S.activityCheckins[ac.id];
    if (!done || !done.length) {
      return;
    }
    if (ac.kind === '教育訓練') {
      res.training += ac.hours * done.length;
    } else {
      res.shift += ac.hours * done.length;
    }
  });
  return res;
}

function ipOk(s) {
  var m = /^([^/]+)(?:\/(\d{1,3}))?$/.exec(s);
  if (!m) {
    return false;
  }

    bits = m[2] == null ? null : Number(m[2]);

    return addr.split('.').every(function (x) {
      return Number(x) <= 255;
    }) && (bits == null || bits <= 32);
  }
  if (addr.indexOf(':') < 0 || addr.length > 39 || !/^[0-9a-fA-F:]+$/.test(addr)) {
    return false;
  }
  var halves = addr.split('::');
  if (halves.length > 2) {
    return false;
  }
  var groups = halves.map(function (h) {
    return h ? h.split(':') : [];
  });
  var n = groups[0].length + (groups[1] ? groups[1].length : 0);
  var hexOk = groups.every(function (g) {
    return g.every(function (x) {
      return /^[0-9a-fA-F]{1,4}$/.test(x);
    });
  });
  return hexOk && (halves.length === 2 ? n < 8 : n === 8) && (bits == null || bits <= 128);
}

ACTIONS.holCreate = function () {

    name = val('#hlName'),
    type = val('#hlType'),
    scope = val('#hlScope');

    i,
    n,
    a,
    b2,
    mi,
    dd,
    ds,
    week = '';

    a = val('#hlDate');

      return;
    }

  } else if (mode === '區間') {
    a = val('#hlFrom');
    b2 = val('#hlTo');
    if (!a || !b2 || b2 < a) {
      toast('請選正確的起訖日期');
      return;
    }

    if (n >= 60) {
      toast('一次最多設定 60 天（含起迄日）');
      return;
    }
    for (i = 0; i <= n; i++) {
      dates.push(addDays(a, i));
    }
  } else {
    week = val('#hlWeek');
    mi = monthInfo(F.hMonth || HCV.TODAY.slice(0, 7));

      ds = dstr(mi.y, mi.m, dd);
      if (HCV.weekday(ds) === week) {
        dates.push(ds);

    }

  if (type === '特別開放日') {
    var blockedByHq = dates.filter(function (d) {

        return h.date === d && h.scope === '全部';
      });
    });
    if (blockedByHq.length) {
      toast('這一天是全部地點的休館日，請由文化局調整全館設定');
      return;
    }
    var before = S.holidays.length;
    S.holidays = S.holidays.filter(function (h) {
      return !(dates.indexOf(h.date) >= 0 && h.scope === scope);
    });
    var removed = before - S.holidays.length;
    if (!removed) {
      toast('這些日期原本就沒有設為休館');
      return;
    }
    log('設定特別開放日', scopeText(scope) + '　' + dates.join('、'));

    return;
  }

    return dates.indexOf(s.date) >= 0 && (scope === '全部' ? true : s.locationId === scope);
  });
  var cancel = checked('#hlCancel');
  var days = Number(val('#hlNotify')) || 0;
  dates.forEach(function (d) {

      return hit.indexOf(s) < 0;
    });
  }
  log('設定休館日', scopeText(scope) + '　' + name + '　' + dates.length + ' 天');
  save();
  closeDrawer();
  render();
  if (hit.length && cancel) {
    toast('已設定 ' + dates.length + ' 天休館，取消 ' + hit.length + ' 個場次並通知 ' + mailed + ' 位志工');
  } else if (hit.length) {
    toast('已設定 ' + dates.length + ' 天休館；這幾天還有 ' + hit.length + ' 個場次沒有取消，請自行處理');
  } else {
    toast('已設定 ' + dates.length + ' 天休館' + (days ? '，將於休館前 ' + days + ' 天通知志工' : ''));

  var body = tabs(['後台帳號', '操作紀錄'], 'tab');
  if (F.tab === '操作紀錄') {
    return card('帳號與權限管理', body + actLogList());
  }
  var q = (F.adQ || '').trim().toLowerCase();
  var list = S.admins.filter(function (a) {
    if (q && [a.name, a.email || '', a.unit].join(' ').toLowerCase().indexOf(q) < 0) {
      return false;
    }
    if (F.adRoleF && a.role !== F.adRoleF) {
      return false;
    }
    if (F.adStat === '啟用中' && a.disabled) {
      return false;
    }
    if (F.adStat === '停用' && !a.disabled) {
      return false;
    }
    if (F.adStat === '尚未設定密碼' && a.passwordSet !== false) {
      return false;
    }
    return true;
  });
  var pg = pageOf(list, 'adPage', 10);
  var rows = pg.rows.map(function (a) {
    var btns = '<button class="btn btn--sm" data-act="adEdit" data-id="' + a.id + '">編輯</button>';
    if (a.id === ME.id) {
      btns += ' <span class="note">目前登入中</span>';
    } else if (a.disabled) {
      btns += ' <button class="btn btn--sm btn--ok" data-act="adEnable" data-id="' + a.id + '">啟用</button>';
    } else {
      btns += ' <button class="btn btn--sm btn--danger" data-act="adDisable" data-id="' + a.id + '">停用</button>';
    }
    if (a.passwordSet === false && !a.disabled) {
      btns += ' <button class="btn btn--sm" data-act="adResend" data-id="' + a.id + '">重寄設定密碼信</button>';
    }
    return ['<b>' + esc(a.name) + '</b>', esc(a.unit), esc(a.email || '—'), pill(a.role, a.role === '總管理者' ? 'ok' : 'tag'), a.role === '地點管理者' && !a.locationIds.length ? pill('尚未指定', 'wait') : esc(adminScopeText(a)), (a.disabled ? pill('停用', 'bad') : pill('啟用中', 'ok')) + (a.passwordSet === false ? ' ' + pill('尚未設定密碼', 'wait') : ''), '<div class="btnrow">' + btns + '</div>'];
  });
  body += '<div class="filters">' + '<div class="fld fld--wide"><label>搜尋（姓名、Email、單位）</label><input type="search" id="adQ" data-input="adQ" value="' + esc(F.adQ || '') + '" placeholder="輸入即過濾"></div>' + selectFld('角色', 'adRoleF', [{
    v: '',
    t: '全部角色'
  }].concat(ROLES), F.adRoleF || '') + selectFld('狀態', 'adStat', [{
    v: '',
    t: '全部狀態'
  }, '啟用中', '停用', '尚未設定密碼'], F.adStat || '') + '</div>' + '<div id="adTable">' + table([{
    t: '姓名'
  }, {
    t: '單位'
  }, {
    t: 'Email'
  }, {
    t: '角色'
  }, {
    t: '授權服務地點'
  }, {
    t: '狀態'
  }, {
    t: '操作'
  }], rows, '沒有符合條件的帳號') + pg.bar + '</div>' + '<p class="hint" style="margin-top:12px">後台帳號不開放給志工，志工一律使用志工端。密碼不由管理者設定：新增帳號後系統寄「設定密碼」信到該帳號的 Email，本人點信中連結自己設定；還沒設定的標「尚未設定密碼」，可以重寄。' + '停用後立即無法登入，該帳號過去留下的操作紀錄全部保留。</p>' + '<div class="sect">角色權限對照</div>' + '<button type="button" class="more" data-act="adMatrix">' + (F.adMatrix ? '收合角色權限對照' : '展開角色權限對照') + '</button>' + (F.adMatrix ? table([{
    t: '功能'
  }, {
    t: '服務地點管理者'
  }, {
    t: '文化局總管理者'
  }, {
    t: '報表檢視'
  }], ROLE_MATRIX.map(function (r) {
    return ['<b>' + esc(r[0]) + '</b>', matrixCell(r[1]), matrixCell(r[2]), matrixCell(r[3])];
  }), '') + '<p class="hint" style="margin-top:12px">兩條紅線：<b>修改簽到退時間</b>與<b>停權、除名</b>只有文化局總管理者做得到，' + '服務地點管理者的畫面上連按鈕都不會出現，只能提出申請。這張表固定、不能改，供新增帳號選角色時對照。</p>' : '');
  return card('帳號與權限管理', body, '<button class="btn btn--pri" data-act="adNew">新增帳號</button>');
};
ACTIONS.adMatrix = function () {
  F.adMatrix = !F.adMatrix;
  render();
};
function actLogList() {
  var by = {},
    act = {
      '登入': 1,
      '登出': 1,
      '登入失敗': 1,
      '檢視個資': 1
    };
  S.actLog.forEach(function (o) {
    by[o.by] = 1;
    act[o.action] = 1;
  });
  var list = S.actLog.filter(function (o) {
    var d = String(o.time).slice(0, 10);
    if (F.lgFrom && d < F.lgFrom) {
      return false;
    }
    if (F.lgTo && d > F.lgTo) {
      return false;
    }
    if (F.lgBy && o.by !== F.lgBy) {
      return false;
    }
    if (F.lgAct && o.action !== F.lgAct) {
      return false;
    }
    return true;
  }).sort(function (a, b) {
    return a.time < b.time ? 1 : a.time > b.time ? -1 : 0;
  });
  var pg = pageOf(list, 'lgPage', 20);
  return '<div class="filters">' + dateFld('起日', 'lgFrom', F.lgFrom) + dateFld('迄日', 'lgTo', F.lgTo) + selectFld('操作者', 'lgBy', [{
    v: '',
    t: '全部'
  }].concat(Object.keys(by)), F.lgBy || '') + selectFld('動作類型', 'lgAct', [{
    v: '',
    t: '全部'
  }].concat(Object.keys(act).sort()), F.lgAct || '') + '</div>' + table([{
    t: '時間'
  }, {
    t: '操作者'
  }, {
    t: '動作'
  }, {
    t: '內容'
  }], pg.rows.map(function (o) {
    return [esc(o.time), esc(o.by), '<b>' + esc(o.action) + '</b>', esc(o.detail)];
  }), '沒有符合條件的操作紀錄', '操作紀錄') + pg.bar + '<p class="hint" style="margin-top:12px">排班調整、出勤補登與編修、違規開立與撤銷、參數變更、帳號異動等每一個寫入動作，' + '都會記下操作者、時間與異動內容供稽核查詢。登入、登出與登入失敗也記在這裡；在志工清單按眼睛圖示顯示個資，記為「檢視個資」並寫明看了哪位志工。<br>' + '內容裡的姓名、借閱證號、身分證字號、聯絡電話、電子郵件一律照系統參數「個資遮罩」的碼數遮過才寫入。操作紀錄保留 ' + S.params.logRetentionYears + ' 年，滿期自動刪除。</p>';
}
function adForm(a) {
  return '<div class="filters">' + '<div class="fld"><label>姓名</label><input type="text" id="adName" value="' + esc(a ? a.name : '') + '"></div>' + '<div class="fld"><label for="adUnit">單位</label><input type="text" id="adUnit" maxlength="20" value="' + esc(a ? a.unit : '文化局') + '" aria-describedby="adUnitHint">' + '<span class="note" id="adUnitHint">20 字內，可寫到地點或小組</span></div>' + '<div class="fld fld--wide"><label>Email（必填；設定密碼信與待處理通知寄到這裡，不能與其他帳號重複）</label><input type="email" id="adMail" value="' + esc(a && a.email ? a.email : '') + '"></div>' + '</div>' + '<div class="fld" style="margin-top:10px"><label>角色</label><select id="adRole" data-change="adRole">' + ROLES.map(function (r) {
    return '<option' + (a && a.role === r ? ' selected' : '') + '>' + r + '</option>';
  }).join('') + '</select></div>' + '<div id="adLocBox" style="margin-top:12px;display:' + (!a || a.role === '地點管理者' ? '' : 'none') + '">' + '<div class="sect">授權服務地點（可複選）</div><div class="pickbox">' + S.locations.map(function (l) {
    return '<label><input type="checkbox" class="adL" value="' + l.id + '"' + (a && a.locationIds.indexOf(l.id) >= 0 ? ' checked' : '') + '> ' + esc(l.name + '　' + unit(l.unitId).name) + '</label>';
  }).join('') + '</div></div>' + '<p class="hint" style="margin-top:12px">授權服務地點決定這個帳號看得到哪些資料，也就是「館別與系統參數」裡那個地點的管理者，兩邊改一邊另一邊跟著變；一人可管多個地點。' + '總管理者與報表檢視為全部地點，不需勾選。服務地點還沒建時可以先不勾，之後在「館別與系統參數」編輯地點時勾選管理者即可。<br>' + '儲存後系統寄設定密碼信到這個 Email，本畫面不設定密碼；忘記密碼在後台登入頁輸入 Email 收重設信。</p>';
}
ACTIONS.adRole = function (el) {
  var box = document.getElementById('adLocBox');
  if (box) {
    box.style.display = el.value === '地點管理者' ? '' : 'none';
  }
};
ACTIONS.adNew = function () {
  openDrawer('新增後台帳號', adForm(null), '<button class="btn btn--pri" data-act="adSave">建立帳號</button><button class="btn" data-act="closeDrawer">取消</button>');
};
ACTIONS.adEdit = function (el) {
  var a = HCV.byId(S.admins, el.getAttribute('data-id'));
  openDrawer('編輯帳號：' + a.name, adForm(a), '<button class="btn btn--pri" data-act="adSave" data-id="' + a.id + '">儲存</button>' + '<button class="btn" data-act="closeDrawer">取消</button>');
};
ACTIONS.adSave = function (el) {
  var id = el.getAttribute('data-id');
  var name = val('#adName');
  if (!name) {
    toast('請填姓名');
    return;
  }
  var role = val('#adRole');
  var locs = role === '地點管理者' ? multi('.adL') : [];
  var mail = val('#adMail');
  if (!mail) {
    toast('Email 為必填：設定密碼信與待處理通知都寄到這裡');
    return;
  }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) {
    toast('Email 格式不正確');
    return;
  }
  if (S.admins.some(function (x) {
    return x.id !== id && (x.email || '').toLowerCase() === mail.toLowerCase();
  })) {
    toast('這個 Email 已經有其他帳號在用（忘記密碼要用 Email 找帳號，不能重複）');
    return;
  }
  if (id === ME.id && role !== '總管理者') {
    toast('不能把自己改成其他角色，請由另一位總管理者調整');
    return;
  }
  var a = id ? HCV.byId(S.admins, id) : {
    id: nextId('AD', S.admins),
    passwordSet: false
  };
  a.name = name;
  a.unit = val('#adUnit') || '文化局';
  a.email = mail;
  a.role = role;
  a.locationIds = locs;
  if (!id) {
    S.admins.push(a);
  }
  if (!id) {
    PW_LAST = mail;
  }
  log(id ? '編輯後台帳號' : '新增後台帳號', pn(a.name) + '（' + a.role + '　' + adminScopeText(a) + '）' + (id ? '' : '，已寄設定密碼信'));
  save();
  closeDrawer();
  render();
  toast(id ? '已儲存帳號設定' : '已新增帳號 ' + a.name + '，系統已寄設定密碼信到 ' + mail);
};
ACTIONS.adResend = function (el) {
  var a = HCV.byId(S.admins, el.getAttribute('data-id'));
  PW_LAST = a.email;
  log('重寄設定密碼信', pn(a.name) + '（' + pm(a.email) + '）');
  save();
  render();
  toast('已重寄設定密碼信到 ' + a.email);
};
ACTIONS.adDisable = function (el) {
  var a = HCV.byId(S.admins, el.getAttribute('data-id'));
  confirmBox({
    title: '停用帳號：' + a.name,
    okText: '停用',
    reason: '停用原因（必填）',
    body: '<p>停用後立即無法登入後台，' + esc(a.name) + ' 過去的操作紀錄全部保留。</p>',
    onOk: function (r) {
      a.disabled = true;
      log('停用後台帳號', pn(a.name) + '（' + r + '）');
      save();
      render();
      toast('已停用 ' + a.name + ' 的帳號');
    }
  });
};
ACTIONS.adEnable = function (el) {
  var a = HCV.byId(S.admins, el.getAttribute('data-id'));
  a.disabled = false;
  log('啟用後台帳號', pn(a.name));
  save();
  render();
  toast('已啟用 ' + a.name + ' 的帳號');
};
boot();
render();
</script>
</body>
</html>
