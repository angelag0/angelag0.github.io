<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>志工服務管理平臺雛形</title>
<style>

:root{
  --bg:#faf8f6;
  --ink:#1d1d1b;
  --muted:#6f645c;
  --brick:#a33a22;
  --pink:#f0838b;
  --pink-soft:#fbd9dc;
  --pink-bg:#f9dfe2;
  --zebra:#fdf0f1;
  --dot-pink:#ef858c;
  --dot-yellow:#fdd469;
  --green:#1f6b55;
  --blue-bg:#d5e3f1;
  --blue-ink:#23527c;
  --green-bg:#d2efe5;
  --red-ink:#b03a3a;
  --line:#e4ded8;
  --line-dark:#2d2d2d;
  --card:#ffffff;
  --grey:#ececec;
  --disabled:#c9c9c9;
  --footer:#4f3d37;
  --radius:28px;
  --shadow:0 6px 24px rgba(80,60,50,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:100%}
body{
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:1.125rem;line-height:1.7;color:var(--ink);
  background-color:var(--bg);
  background-image:
    radial-gradient(120% 60% at 12% 0%, rgba(239,133,140,.07), rgba(250,248,246,0) 60%),
    radial-gradient(90% 50% at 92% 18%, rgba(160,130,120,.06), rgba(250,248,246,0) 62%),
    radial-gradient(120% 70% at 50% 100%, rgba(200,170,160,.07), rgba(250,248,246,0) 65%);
  background-attachment:fixed;
  -webkit-text-size-adjust:100%;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
ul{list-style:none}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.hide{display:none !important}


.site-head{background:#fff;border-bottom:1px solid var(--line)}
.head-in{display:flex;align-items:center;gap:18px;padding:16px 0}
.brand{display:flex;align-items:center;gap:18px}
.brand-mark{border:1px solid #cdc2b9;border-radius:10px;padding:7px 10px;font-size:.66rem;line-height:1.3;
  letter-spacing:.14em;color:#6a564c;text-align:center;white-space:nowrap}
.brand-div{width:1px;height:40px;background:#ddd5cd}
.site-name{font-size:1.5rem;font-weight:800;letter-spacing:.08em}
.head-links{margin-left:auto;display:flex;align-items:center;gap:26px;font-size:1rem}
.head-links a{font-weight:600}
.head-links a:hover{color:var(--brick)}
.aa-btn{width:46px;height:46px;border-radius:999px;background:var(--pink);color:#fff;font-weight:800;font-size:1rem;
  display:flex;align-items:center;justify-content:center}
.me-box{display:flex;align-items:center;gap:14px;padding-left:22px;margin-left:4px;border-left:1px solid var(--line);font-size:.95rem}
.me-box b{font-weight:800}
.me-box a{color:var(--brick);font-weight:700}
.burger{display:none;width:48px;height:48px;border-radius:12px;align-items:center;justify-content:center}
.burger span{display:block;width:26px;height:2.5px;background:var(--ink);margin:4px 0;border-radius:2px}


.mainnav{background:#fff;border-bottom:1px solid var(--line)}
.mainnav ul{display:flex;justify-content:space-between;gap:8px}
.mainnav a{display:block;padding:14px 4px;font-weight:700;color:#55504b;border-bottom:3px solid transparent;white-space:nowrap}
.mainnav a:hover{color:var(--brick)}
.mainnav a.on{color:var(--brick);border-bottom-color:var(--brick)}
.drawer{display:none;background:#fff;border-bottom:1px solid var(--line)}
.drawer.open{display:block}
.drawer a{display:block;padding:14px 24px;font-weight:700;border-bottom:1px solid var(--line)}
.drawer a.on{color:var(--brick)}


.crumb{display:flex;align-items:center;gap:10px;padding:26px 0 6px;font-size:.95rem;color:var(--muted)}
.crumb .now{color:var(--brick);font-weight:700}
.page-title{font-size:2rem;font-weight:800;color:var(--brick);margin-top:10px}
.page-sub{color:var(--muted);margin-top:4px}
main{padding-bottom:64px}


.card{position:relative;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:32px}
.card::before,.card::after{content:"";position:absolute;top:22px;width:9px;height:9px;border-radius:999px}
.card::before{left:26px;background:var(--dot-pink)}
.card::after{left:42px;background:var(--dot-yellow)}
.card > .card-h{margin-top:12px}
.card-h{font-size:1.25rem;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-h .more{font-size:.95rem;color:var(--brick);font-weight:700}
.grid{display:grid;gap:24px;margin-top:24px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g21{grid-template-columns:5fr 7fr}
.g12{grid-template-columns:7fr 5fr}


.stat .lbl{font-weight:800;margin-top:12px}
.stat .big{font-family:Georgia,"Noto Serif TC",serif;font-weight:700;color:var(--brick);font-size:3rem;line-height:1.2;margin-top:6px}
.stat .big small{font-family:inherit;font-size:1rem;font-weight:800;color:var(--ink);margin-left:8px}
.stat .big.state{font-size:2rem;color:var(--green);font-family:"Noto Sans TC","PingFang TC",sans-serif}
.stat .foot{color:var(--muted);font-size:.95rem;margin-top:6px}
.stat .foot b{color:var(--green);font-weight:800}


.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:56px;padding:0 34px;border-radius:999px;
  font-weight:800;font-size:1.05rem;transition:filter .15s}
.btn:hover{filter:brightness(.96)}
.btn-primary{background:var(--pink);color:var(--ink)}
.btn-ghost{background:var(--grey);color:var(--ink)}
.btn-dark{background:var(--line-dark);color:#fff;border-radius:16px;height:64px;padding:0 30px}
.btn-dark:hover{filter:brightness(1.25)}
.btn[disabled]{background:var(--disabled);color:#fff;cursor:not-allowed;filter:none}
.btn-sm{height:44px;padding:0 20px;font-size:.95rem;border-radius:999px;background:var(--pink-soft);color:var(--red-ink);font-weight:800;
  display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-sm.grey{background:var(--grey);color:#4a4a4a}
.btn-sm[disabled]{background:#eee;color:#9b9b9b;cursor:not-allowed}
.btn-block{width:100%}
.btn-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:22px}
.linkish{color:var(--brick);font-weight:700;text-decoration:underline;cursor:pointer;background:none}


.tag{display:inline-flex;align-items:center;padding:4px 16px;border-radius:999px;font-size:.88rem;font-weight:800;white-space:nowrap}
.t-notice{background:var(--blue-bg);color:var(--blue-ink)}
.t-act{background:var(--green-bg);color:#17654c}
.t-warn{background:var(--pink-soft);color:var(--red-ink)}
.t-plain{background:#fff;border:1px solid #c9c2bb;color:#4c4a47}
.t-grey{background:#efece9;color:#5a544e}
.t-green{background:var(--green-bg);color:#17654c}
.t-dark{background:#3c3733;color:#fff}


.tbl{width:100%;border-collapse:collapse;margin-top:18px}
.tbl th{text-align:left;font-weight:800;padding:12px 12px;border-bottom:2px solid var(--line-dark);white-space:nowrap}
.tbl td{padding:14px 12px;height:68px;vertical-align:middle;border-bottom:1px solid #f0eae5}
.tbl tbody tr:nth-child(even){background:var(--zebra)}
.tbl .num{font-weight:800}
.tbl .right{text-align:right}
.tbl .note-row td{height:auto;padding-top:0;color:var(--muted);font-size:.95rem;background:transparent}


.alert{background:var(--pink-bg);border-radius:24px;padding:24px 28px;display:flex;gap:16px;align-items:flex-start}
.alert .ic{flex:0 0 auto;width:30px;height:30px;border-radius:999px;background:var(--pink);color:#fff;font-weight:900;
  display:flex;align-items:center;justify-content:center;margin-top:2px}
.alert h4{color:var(--red-ink);font-weight:800;font-size:1.1rem}
.alert p{margin-top:4px}
.hint{color:var(--muted);font-size:.98rem;margin-top:14px}
.hint.strong{color:#5a4a44}
.inline-note{background:#fbf6f2;border:1px dashed #ddd0c6;border-radius:18px;padding:16px 20px;color:#5c5049;font-size:.98rem;margin-top:16px}
.ok-box{background:var(--green-bg);border-radius:20px;padding:18px 22px;color:#14624a;font-weight:700;margin-top:16px}


.field{margin-top:20px}
.field > label{display:block;font-weight:800;margin-bottom:8px}
.req{color:var(--brick);margin-right:4px}
.inp,select.inp,textarea.inp{width:100%;background:#fff;border:1px solid #ded6cf;border-radius:18px;padding:14px 18px;font-size:1.05rem}
.inp:focus{outline:2px solid var(--pink);border-color:transparent}
textarea.inp{min-height:110px;resize:vertical}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.chk{display:inline-flex;align-items:center;gap:8px;margin:0 18px 10px 0;font-size:1rem}
.err{color:#c0392b;font-weight:700;margin-top:10px}


.bar{height:14px;border-radius:999px;background:var(--pink-soft);overflow:hidden;margin-top:14px}
.bar > i{display:block;height:100%;background:var(--brick);border-radius:999px}
.card{min-width:0}

.chart{display:flex;align-items:flex-end;gap:10px;height:190px;margin-top:22px;padding-top:10px;overflow-x:auto;max-width:100%}
.chart .col{flex:1 0 36px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px;height:100%}
.chart .bx{width:100%;max-width:46px;background:var(--pink);border-radius:10px 10px 0 0;min-height:3px}
.chart .bx.on{background:var(--brick)}
.chart .cl{font-size:.82rem;color:var(--muted)}
.chart .cv{font-size:.82rem;font-weight:800}


.steps{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
.step{flex:1;min-width:120px;text-align:center;padding:10px 6px;border-radius:14px;background:#f2eeea;color:#8a827b;font-size:.92rem;font-weight:700}
.step.done{background:var(--green-bg);color:#17654c}
.step.now{background:var(--pink);color:#fff}


.tabs{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.tab{padding:12px 26px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:800;color:#5a544e}
.tab.on{background:var(--brick);border-color:var(--brick);color:#fff}


.hero{background:linear-gradient(170deg,#f8dfe1 0%,#f7e3e0 45%,#faf3ee 100%);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;
  background:radial-gradient(70% 90% at 78% 40%, rgba(255,255,255,.65), rgba(255,255,255,0) 60%)}
.hero-in{position:relative;z-index:1;padding:74px 24px 86px}
.hero h1{font-size:3.6rem;line-height:1.25;letter-spacing:.12em;font-weight:900}
.hero h1 .b{color:var(--brick)}
.hero h1 .k{color:var(--ink);margin-left:2.2rem}
.deco{display:flex;align-items:center;gap:12px;margin:18px 0}
.deco i{width:11px;height:11px;border-radius:999px;display:block}
.deco .l{flex:0 0 190px;height:1px;background:rgba(120,90,80,.35)}
.deco.b{justify-content:flex-start;padding-left:120px}
.login-card .row4{margin-top:18px;color:#4b443f}
.ann-img{height:230px;border-radius:20px;background:linear-gradient(135deg,#f3dfe3,#e9e2f2 55%,#dfeaf1);display:flex;align-items:center;
  justify-content:center;color:#9a8b92;font-weight:800;letter-spacing:.1em}
.ann-title{color:var(--brick);font-weight:800;font-size:1.15rem;margin-top:18px}
.ann-body{margin-top:10px}
.ann-date{color:var(--muted);margin-top:14px;font-size:.95rem}
.arrow{width:48px;height:48px;border-radius:999px;background:#fff;box-shadow:var(--shadow);display:inline-flex;align-items:center;justify-content:center;font-size:1.1rem}
.login-rules{margin-top:18px}
.login-rules li{position:relative;padding-left:18px;margin-bottom:6px;font-size:1rem;color:#4b443f}
.login-rules li::before{content:"・";position:absolute;left:0}


.view-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:20px}
.seg{display:inline-flex;background:#f2eeea;border-radius:999px;padding:4px;gap:4px}
.seg button{padding:10px 26px;border-radius:999px;font-weight:800;color:#5a544e;font-size:1rem}
.seg button.on{background:var(--brick);color:#fff}

.calendar{position:relative;margin-top:20px}
.calendarNav{display:flex;justify-content:center;align-items:center;gap:18px;margin:6px 0 18px}
.calendarNav .current{font-size:1.15rem;font-weight:800;min-width:150px;text-align:center}
.calendarNav button{height:44px;padding:0 20px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:800;color:#5a544e}
.calendarNav button:hover{border-color:var(--brick);color:var(--brick)}
.tableScroll{position:relative;overflow-x:auto}
.tableScroll table{width:100%;min-width:680px;border-collapse:separate;border-spacing:8px}
.tableScroll th{font-weight:800;padding:6px 0;color:#5a544e;text-align:center}
.tableScroll th:first-child{color:var(--brick)}
.tableScroll td{vertical-align:top;min-height:120px;height:120px;border:1px solid var(--line);border-radius:14px;padding:8px;background:#fff}
.tableScroll td.blank{border:0;background:transparent}
.tableScroll td.grey{background:#f4f0e9}
.tableScroll td.today{border:2px solid var(--brick)}
.tableScroll td.off{background:#f4f0ec}
.tableScroll .date{font-size:1.05rem;font-weight:800;color:#5d3c2d;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.tableScroll .date small{font-size:.76rem;color:var(--brick);font-weight:800}
.tableScroll .period > div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:4px 9px;border-radius:30px;
  font-size:.86rem;font-weight:700;margin-top:5px}
.tableScroll .period .available{background:var(--green-bg)}
.tableScroll .period .available a{color:#17654c;display:block;cursor:pointer}
.tableScroll .period .available:hover{background:#17654c}
.tableScroll .period .available:hover a{color:#fff}
.tableScroll .period .mine{background:var(--pink)}
.tableScroll .period .mine a{color:#4a3c38;display:block;cursor:pointer}
.tableScroll .period .booked{color:#a43d3d;background:#f7efec}
.tableScroll .period .disable{color:#8a827b;background:#f2efec}
.tableScroll .period .closed{color:var(--brick);text-align:center;font-weight:800;margin-top:10px;white-space:normal}
.scrollTablePrevBtn,.scrollTableNextBtn{display:none}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;font-size:.92rem;color:#5a544e}
.legend i{display:inline-block;width:16px;height:16px;border-radius:5px;margin-right:6px;vertical-align:-3px;border:1px solid transparent}

.functionPanel{display:flex;justify-content:flex-end;gap:12px;margin-top:18px;flex-wrap:wrap}
.functionPanelBtn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;
  background:#fff;border:1px solid var(--line);font-weight:800;font-size:.95rem;color:#5a544e;cursor:pointer}
.functionPanelBtn:hover{border-color:var(--brick);color:var(--brick)}
.functionPanelBtn::before{content:"";width:18px;height:18px;border:2px solid currentColor;border-radius:4px;flex:0 0 18px}
.functionPanelBtn.back::before{border-radius:999px}
.functionPanelBtn.email::before{border-radius:3px;border-width:2px 2px 8px}

.historySearch .range{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.historySearch .range span{font-weight:800}
.historySearch .note{color:#990000;font-size:.88rem;margin-top:8px}

.pop{position:fixed;inset:0;background:rgba(40,30,26,.55);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px}
.pop-box{background:#fff;border-radius:26px;max-width:520px;width:100%;padding:30px 32px;box-shadow:0 20px 60px rgba(60,40,30,.3)}
.pop-title{font-size:1.3rem;font-weight:800;color:var(--brick)}
.pop-dl{margin-top:18px}
.pop-dl > div{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.pop-dl dt{flex:0 0 106px;font-weight:800;color:#5a544e}
.pop-dl dd{flex:1;font-weight:700}


.act-card{display:flex;flex-direction:column;gap:14px}
.act-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.act-cap{margin-left:auto;background:#efece9;color:#4a443f;border-radius:999px;padding:4px 16px;font-weight:800;font-size:.9rem;white-space:nowrap}
.act-name{font-size:1.2rem;font-weight:800}
.act-meta{color:#4f4741;display:flex;align-items:center;gap:8px}


.phone{max-width:460px;margin:0 auto}
.mini{padding:22px 24px;border-radius:24px}
.mini .lbl{font-size:.95rem;font-weight:800;margin-top:10px}
.mini .big{font-size:2.1rem}
.mini .big.state{font-size:1.5rem}
.scan{position:fixed;inset:0;background:rgba(20,16,14,.92);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;color:#fff;padding:24px}
.frame{width:250px;height:250px;border-radius:24px;position:relative;box-shadow:0 0 0 4000px rgba(0,0,0,.25)}
.frame i{position:absolute;width:44px;height:44px;border:5px solid var(--pink)}
.frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:18px 0 0 0}
.frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 18px 0 0}
.frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 18px}
.frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 18px 0}
.frame .ray{position:absolute;left:8px;right:8px;height:3px;background:var(--pink);border-radius:4px;animation:ray 1.4s ease-in-out infinite}
@keyframes ray{0%{top:12px}50%{top:228px}100%{top:12px}}
.qr-ic{display:inline-block;width:24px;height:24px;border:3px solid currentColor;border-radius:6px;position:relative}
.qr-ic::before,.qr-ic::after{content:"";position:absolute;background:currentColor}
.qr-ic::before{width:7px;height:7px;top:2px;left:2px}
.qr-ic::after{width:7px;height:7px;bottom:2px;right:2px}


.site-foot{background:var(--footer);color:#fff;margin-top:40px}
.foot-in{padding:46px 24px 30px}
.foot-top{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}
.foot-top .col{flex:1;min-width:260px}
.foot-links{margin-top:22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.badges{display:flex;gap:14px;margin-left:auto}
.badge{border:1px solid rgba(255,255,255,.55);border-radius:10px;padding:10px 14px;font-size:.82rem;text-align:center;line-height:1.3}
.foot-line{height:1px;background:rgba(255,255,255,.35);margin:26px 0 18px}
.copy{text-align:center;font-size:.95rem}


.tool-btn{position:fixed;right:20px;bottom:20px;z-index:50;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);
  border-radius:999px;padding:10px 18px;font-weight:800;font-size:.9rem;color:#5a544e}
.tool-panel{position:fixed;right:20px;bottom:74px;z-index:50;width:290px;background:#fff;border-radius:22px;box-shadow:0 10px 40px rgba(70,50,45,.22);padding:20px}
.tool-panel h5{font-weight:800;margin-bottom:10px}
.tool-panel button,.tool-panel a{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:12px;font-size:.95rem;margin-bottom:6px;background:#f6f2ee}
.tool-panel p{font-size:.86rem;color:var(--muted);margin-top:8px}


@media (max-width:768px){
  .wrap{padding:0 16px}
  .head-in{padding:12px 0;gap:12px}
  .site-name{font-size:1.15rem}
  .brand-mark{font-size:.58rem;letter-spacing:.06em;padding:6px 8px}
  .head-links{display:none}
  .burger{display:flex}
  .mainnav{display:none}
  .grid{gap:16px}
  .g4,.g3,.g2,.g21,.g12{grid-template-columns:1fr}
  .g4.m2,.g2.m2{grid-template-columns:1fr 1fr}
  .card{padding:22px;border-radius:24px}
  .page-title{font-size:1.6rem}
  .hero-in{padding:44px 16px 52px}
  .hero h1{font-size:2.2rem}
  .hero h1 .k{margin-left:1.2rem}
  .deco .l{flex-basis:90px}
  .deco.b{padding-left:50px}
  .btn{width:100%}
  .btn-row .btn{width:100%}
  .foot-in{padding:32px 16px 24px}
  .badges{margin-left:0}
  .stat .big{font-size:2.4rem}
  
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl thead{display:none}
  .tbl tr{background:#fff !important;border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-top:14px}
  .tbl td{height:auto;border:0;padding:6px 0;display:flex;gap:12px;align-items:center}
  .tbl td::before{content:attr(data-label);flex:0 0 40%;font-weight:800;color:#5a544e}
  .tbl .note-row td::before{content:""}
}
</style>
</head>
<body>

<header class="site-head">
  <div class="wrap head-in">

  <h5>雛形工具</h5>
  <button data-act="reset">重設示範資料</button>
  <a href="admin.html">切換到管理後台</a>
  <button data-act="who">切換登入身分（目前：—）</button>
  <p>這是操作雛形，資料皆為虛構。</p>
</div>

<script src="data.js"></script>
<script>
(function () {
  'use strict';
  var S = null;
  var UI = {
    logged: false,
    font: 0,
    who: 'V001',
    scenario: 'early'
  };
  var UIKEY = 'hcpl-vol-front-ui';
  var FONTS = ['100%', '112.5%', '125%'];
  var FONT_NAMES = ['標準', '大', '特大'];
  var YEAR_ROC = 115;
  function uiLoad() {
    try {
      var raw = window.localStorage.getItem(UIKEY);
      if (raw) {
        var o = JSON.parse(raw);
        if (o) {
          for (var k in o) {
            UI[k] = o[k];
          }
        }
      }
    } catch (e) {}
  }
  function uiSave() {
    try {
      window.localStorage.setItem(UIKEY, JSON.stringify(UI));
    } catch (e) {}
  }
  function save() {
    HCV.save(S);
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;'
      }[c];
    });
  }
  function byId(list, id) {
    return HCV.byId(list, id);
  }
  function me() {
    return byId(S.volunteers, S.currentVolunteerId);
  }
  function myUnitName() {
    var u = byId(S.units, me().unitId);
    return u ? u.name : '';
  }
  function locName(id) {
    var l = byId(S.locations, id);
    return l ? l.name : '';
  }
  function tpl(id) {
    return byId(S.slotTemplates, id);
  }
  function suspended() {
    return me().status === '停權';
  }
  function toMin(t) {
    if (!t) return 0;
    var p = t.split(':');
    return Number(p[0]) * 60 + Number(p[1]);
  }
  function toHHMM(m) {
    var h = Math.floor(m / 60),
      i = m % 60;
    return (h < 10 ? '0' : '') + h + ':' + (i < 10 ? '0' : '') + i;
  }
  function hourText(h) {
    return HCV.hoursText(h);
  }
  function monthOf(d) {
    return d.substring(0, 7);
  }
  function newId(p) {
    return p + String(Date.now()).slice(-8);
  }
  function sum(arr, f) {
    var n = 0;
    for (var i = 0; i < arr.length; i++) {
      n += f(arr[i]);
    }
    return n;
  }
  function hours() {
    var h = S.hourSummary[S.currentVolunteerId] || {
      year: YEAR_ROC,
      shiftHours: 0,
      activityHours: 0,
      trainingHours: 0
    };
    var total = h.shiftHours + h.activityHours;
    var req = S.params.annualRequiredHours;
    return {
      shift: h.shiftHours,
      act: h.activityHours,
      train: h.trainingHours,
      total: total,
      req: req,
      pct: Math.round(total / req * 100),
      left: Math.max(0, Math.round((req - total) * 10) / 10)
    };
  }
  function myFutureSlots() {
    var id = S.currentVolunteerId;
    return S.slots.filter(function (s) {
      return s.booked.indexOf(id) >= 0 && HCV.diffDays(S.today, s.date) >= 0;
    }).sort(function (a, b) {
      return a.date < b.date ? -1 : 1;
    });
  }
  function todaySlot() {
    var id = S.currentVolunteerId;
    for (var i = 0; i < S.slots.length; i++) {
      var s = S.slots[i];
      if (s.date === S.today && s.booked.indexOf(id) >= 0) {
        return s;
      }
    }
    return null;
  }
  function myAttendance() {
    var id = S.currentVolunteerId;
    return S.attendance.filter(function (a) {
      return a.volunteerId === id;
    }).sort(function (a, b) {
      return a.date < b.date ? 1 : -1;
    });
  }
  function todayAttendance() {
    var id = S.currentVolunteerId;
    for (var i = 0; i < S.attendance.length; i++) {
      var a = S.attendance[i];
      if (a.volunteerId === id && a.date === S.today) {
        return a;
      }
    }
    return null;
  }
  function myLeaders() {
    return me().groupIds.map(function (g) {
      return byId(S.groups, g);
    }).filter(function (x) {
      return !!x;
    });
  }
  function sameUnitMates() {
    var m = me();
    return S.volunteers.filter(function (v) {
      return v.unitId === m.unitId && v.status === '在職' && v.id !== m.id;
    });
  }
  var MENU = [['dashboard', '我的儀表板'], ['schedule', '班表報名'], ['checkin', '現場簽到退'], ['attendance', '我的出勤紀錄'], ['leave', '請假／代班'], ['hours', '服務時數'], ['activities', '活動報名'], ['violations', '我的違規記點']];
  var GUEST_MENU = [['news', '系統公告'], ['apply', '志工申請'], ['sitemap', '網站導覽']];
  function crumb(name) {
    return '<div class="wrap"><div class="crumb"><span aria-hidden="true">⌂</span><span>志工</span><span>/</span>' + '<span class="now">' + esc(name) + '</span></div></div>';
  }
  function head(name, sub) {
    return crumb(name) + '<div class="wrap"><h1 class="page-title">' + esc(name) + '</h1>' + (sub ? '<p class="page-sub">' + sub + '</p>' : '') + '</div>';
  }
  function tag(text, kind) {
    return '<span class="tag ' + (kind || 't-grey') + '">' + esc(text) + '</span>';
  }
  function pageTools() {
    return '<div class="wrap"><div class="functionPanel">' + '<button class="functionPanelBtn back" data-act="go-back">回上一頁</button>' + '<button class="functionPanelBtn print" data-act="do-print">列印</button>' + '<button class="functionPanelBtn email" data-act="do-email">Email</button>' + '</div></div>';
  }
  function statCard(lbl, big, unit, foot, cls) {
    return '<div class="card stat"><div class="lbl">' + esc(lbl) + '</div>' + '<div class="big ' + (cls || '') + '">' + esc(big) + (unit ? '<small>' + esc(unit) + '</small>' : '') + '</div>' + (foot ? '<div class="foot">' + foot + '</div>' : '') + '</div>';
  }
  function statusTag(st) {
    var map = {
      '正常': 't-green',
      '緩衝內到班': 't-notice',
      '遲到': 't-warn',
      '早退': 't-warn',
      '固定早退': 't-plain',
      '缺勤': 't-warn',
      '未報名簽到': 't-warn',
      '補登': 't-grey',
      '服務中': 't-act'
    };
    return tag(st, map[st] || 't-grey');
  }
  function suspendNote(action) {
    return '<div class="alert" style="margin-top:20px"><div class="ic">!</div><div>' + '<h4>目前為停權狀態</h4><p>停權期間仍可查詢個人班表、出勤與時數紀錄，' + esc(action) + '暫時停用。' + '如需恢復，請洽文化局志工業務承辦人。</p></div></div>';
  }
  var PAGES = {};
  var GUEST_OK = {
    home: 1,
    news: 1,
    'news-item': 1,
    apply: 1,
    sitemap: 1
  };
  function parseHash() {
    var h = location.hash.replace(/^#\/?/, '');
    var q = {},
      qs = '';
    var qi = h.indexOf('?');
    if (qi >= 0) {
      qs = h.substring(qi + 1);
      h = h.substring(0, qi);
    }
    if (qs) {
      qs.split('&').forEach(function (kv) {
        var p = kv.split('=');
        q[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || '');
      });
    }
    var parts = h.split('/').filter(function (x) {
      return x !== '';
    });
    var key = parts[0] || 'home';
    if (key === 'news' && parts[1]) {
      q.id = parts[1];
      key = 'news-item';
    }
    return {
      key: key,
      q: q
    };
  }
  function go(hash) {
    location.hash = hash;
  }
  function renderNav(key) {
    var nav = document.getElementById('mainNav');
    var list = document.getElementById('navList');
    var drawer = document.getElementById('drawer');
    var items = UI.logged ? MENU : GUEST_MENU;
    list.innerHTML = items.map(function (m) {
      return '<li><a href="#/' + m[0] + '" class="' + (m[0] === key ? 'on' : '') + '">' + esc(m[1]) + '</a></li>';
    }).join('');
    nav.className = 'mainnav' + (UI.logged ? '' : ' hide');
    var dItems = items.slice();
    if (UI.logged) {
      dItems = dItems.concat([['profile', '個人資料'], ['logout', '登出']]);
    } else {
      dItems = [['home', '回首頁']].concat(dItems);
    }
    drawer.innerHTML = dItems.map(function (m) {
      if (m[0] === 'logout') {
        return '<a href="#/" data-act="logout">登出</a>';
      }
      return '<a href="#/' + m[0] + '" class="' + (m[0] === key ? 'on' : '') + '">' + esc(m[1]) + '</a>';
    }).join('');
    drawer.classList.remove('open');
    var box = document.getElementById('meBox');
    if (UI.logged) {
      box.className = 'me-box';
      box.innerHTML = '<b>' + esc(me().name) + '</b><a href="#/profile">個人資料</a><a href="#/" data-act="logout">登出</a>';
    } else {
      box.className = 'me-box hide';
      box.innerHTML = '';
    }
    var tw = document.querySelector('[data-act="who"]');
    if (tw) {
      tw.textContent = '切換登入身分（目前：' + me().name + '）';
    }
  }
  function render() {
    var r = parseHash();
    var key = r.key;
    if (!PAGES[key]) {
      key = UI.logged ? 'dashboard' : 'home';
    }
    if (!UI.logged && !GUEST_OK[key]) {
      key = 'home';
      r.q.needLogin = '1';
    }
    if (UI.logged && key === 'home') {}
    renderNav(key);
    document.getElementById('view').innerHTML = PAGES[key](r.q);
    window.scrollTo(0, 0);
  }
  var ACTS = {};
  document.addEventListener('click', function (ev) {
    var t = ev.target;
    while (t && t !== document.body) {
      if (t.getAttribute && t.getAttribute('data-act')) {
        var name = t.getAttribute('data-act');
        if (ACTS[name]) {
          ev.preventDefault();
          ACTS[name](t);
          return;
        }
        break;
      }
      t = t.parentNode;
    }
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t && t.getAttribute && t.getAttribute('data-change') && ACTS[t.getAttribute('data-change')]) {
      ACTS[t.getAttribute('data-change')](t);
    }
  });
  ACTS.font = function () {
    UI.font = (UI.font + 1) % FONTS.length;
    uiSave();
    applyFont();
  };
  function applyFont() {
    document.documentElement.style.fontSize = FONTS[UI.font];
    var b = document.querySelector('.aa-btn');
    if (b) {
      b.title = '文字大小：' + FONT_NAMES[UI.font];
    }
  }
  ACTS.drawer = function () {
    document.getElementById('drawer').classList.toggle('open');
  };
  ACTS.tool = function () {
    document.getElementById('toolPanel').classList.toggle('hide');
  };
  ACTS.reset = function () {
    S = HCV.reset();
    UI.logged = false;
    uiSave();
    location.hash = '#/';
    location.reload();
  };
  ACTS.who = function () {
    S.currentVolunteerId = S.currentVolunteerId === 'V001' ? 'V010' : 'V001';
    UI.who = S.currentVolunteerId;
    save();
    uiSave();
    document.getElementById('toolPanel').classList.add('hide');
    render();
  };
  ACTS.logout = function () {
    UI.logged = false;
    uiSave();
    go('#/');
    render();
  };
  ACTS.login = function () {
    UI.logged = true;
    uiSave();
    go('#/dashboard');
  };
  ACTS.nav = function (el) {
    go(el.getAttribute('data-to'));
  };
  ACTS['go-back'] = function () {
    window.history.back();
  };
  ACTS['do-print'] = function () {
    window.print();
  };
  ACTS['do-email'] = function () {
    window.alert('雛形示意：正式系統會把目前查到的紀錄寄到您的信箱（' + (me().email || '尚未填寫電子郵件') + '）。');
  };
  var annIdx = 0;
  PAGES.home = function (q) {
    var list = visAnns();
    if (annIdx >= list.length) {
      annIdx = 0;
    }
    var a = list[annIdx] || null;
    var deco = '<div class="deco"><i style="background:#ef858c"></i><i style="background:#fdd469"></i>' + '<i style="background:#7fc7c0"></i><i style="background:#9ab7e0"></i><span class="l"></span></div>';
    var decoB = '<div class="deco b"><span class="l"></span><i style="background:#ef858c"></i><i style="background:#fdd469"></i>' + '<i style="background:#7fc7c0"></i><i style="background:#9ab7e0"></i></div>';
    var annBox = a ? '<div class="ann-img">新竹縣政府文化局</div>' + '<div class="ann-title"><a href="#/news/' + esc(a.id) + '">' + esc(a.title) + '</a></div>' + '<div class="ann-body">' + esc(a.body) + '</div>' + '<div class="ann-date">' + esc(a.date) + '</div>' : '<div class="ann-body">目前沒有公告。</div>';
    var loginTip = q.needLogin ? '<div class="err">請先登入後再使用該功能。</div>' : '';
    return '' + '<section class="hero"><div class="wrap hero-in">' + deco + '<h1><span class="b">志工服務</span><br><span class="k">管理平臺</span></h1>' + decoB + '</div></section>' + '<div class="wrap"><div class="grid g2" style="margin-top:40px">' + '<div class="card">' + '<div class="card-h">系統公告' + '<span><button class="arrow" data-act="ann-prev" aria-label="上一則">‹</button> ' + '<button class="arrow" data-act="ann-next" aria-label="下一則">›</button></span></div>' + '<div style="margin-top:18px">' + annBox + '</div>' + '<div class="btn-row"><a class="btn btn-ghost" href="#/news">所有公告</a></div>' + '</div>' + '<div class="card login-card">' + '<div class="card-h">立即登入</div>' + '<div style="color:var(--brick);font-weight:800;margin-top:16px;border-left:4px solid var(--brick);padding-left:12px">志工服務管理平臺登入</div>' + '<div class="field"><label><span class="req">*</span>帳號</label>' + '<input class="inp" type="text" placeholder="請輸入借閱證號或身分證字號"></div>' + '<div class="field"><label><span class="req">*</span>密碼</label>' + '<input class="inp" type="password" placeholder="請輸入密碼"></div>' + '<div class="field"><label><span class="req">*</span>驗證碼</label>' + '<div style="display:flex;gap:12px;align-items:center">' + '<input class="inp" type="text" placeholder="請輸入驗證碼" style="flex:1">' + '<span style="flex:0 0 118px;text-align:center;font-family:Georgia,serif;font-size:1.4rem;letter-spacing:.2em;' + 'background:#f1ece7;border-radius:12px;padding:8px 0">5 1 5 1</span></div>' + '<div style="margin-top:8px"><a class="linkish" href="https://webpac.hchcc.gov.tw" target="_blank" rel="noopener" title="前往新竹縣公共圖書館館藏查詢系統辦理（另開新視窗）">忘記密碼</a></div></div>' + '<ul class="login-rules">' + '<li>帳號請輸入借閱證號或身分證字號</li>' + '<li>密碼請輸入館藏查詢系統的個人密碼，本平臺不另設密碼</li>' + '<li>登入後須具志工資格才能使用；查無資格請洽所屬服務地點承辦人</li>' + '<li>尚未申辦本縣公共圖書館個人借閱證者，請點選下方「網路辦證」</li>' + '</ul>' + loginTip + '<div class="btn-row">' + '<button class="btn btn-primary" data-act="login" style="flex:1">會員登入</button>' + '<a class="btn btn-ghost" href="https://webpac.hchcc.gov.tw" target="_blank" rel="noopener" style="flex:1">網路辦證</a>' + '</div>' + '<div class="hint">尚未擔任志工？歡迎<a class="linkish" href="#/apply">線上填寫志工申請</a>。</div>' + '</div>' + '</div></div>';
  };
  function visAnns() {
    return S.announcements.filter(function (a) {
      return !a.offline;
    });
  }
  ACTS['ann-prev'] = function () {
    var n = visAnns().length || 1;
    annIdx = (annIdx - 1 + n) % n;
    render();
  };
  ACTS['ann-next'] = function () {
    var n = visAnns().length || 1;
    annIdx = (annIdx + 1) % n;
    render();
  };
  var newsFilter = '全部';
  PAGES.news = function () {
    var kinds = ['全部', '公告', '活動', '提醒'];
    var rows = visAnns().filter(function (a) {
      return newsFilter === '全部' || a.tag === newsFilter;
    });
    var tabs = kinds.map(function (k) {
      return '<button class="tab ' + (k === newsFilter ? 'on' : '') + '" data-act="news-filter" data-v="' + esc(k) + '">' + esc(k) + '</button>';
    }).join('');
    var body = rows.length ? rows.map(function (a) {
      return '<div style="display:flex;gap:18px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line);flex-wrap:wrap">' + '<span style="color:var(--muted);flex:0 0 120px">' + esc(a.date) + '</span>' + tag(a.tag, a.tag === '公告' ? 't-notice' : a.tag === '活動' ? 't-act' : 't-warn') + '<a href="#/news/' + esc(a.id) + '" style="font-weight:700;flex:1;min-width:240px">' + esc(a.title) + '</a>' + '<span style="color:var(--muted);font-size:.95rem">' + esc(a.scope === '全體' ? '全體志工' : a.scope + ' 適用') + '</span></div>';
    }).join('') : '<div class="hint">目前沒有公告。</div>';
    return head('系統公告', '館方發布的公告、活動與提醒事項') + '<div class="wrap"><div class="tabs">' + tabs + '</div>' + '<div class="card" style="margin-top:20px"><div class="card-h">公告列表</div>' + body + '</div></div>';
  };
  ACTS['news-filter'] = function (el) {
    newsFilter = el.getAttribute('data-v');
    render();
  };
  PAGES['news-item'] = function (q) {
    var a = byId(S.announcements, q.id);
    if (!a) {
      return head('公告', '') + '<div class="wrap"><div class="card">查無此公告。</div></div>';
    }
    return head('公告內容', '') + '<div class="wrap"><div class="card">' + '<div style="display:flex;gap:14px;align-items:center;margin-top:12px">' + tag(a.tag, a.tag === '公告' ? 't-notice' : a.tag === '活動' ? 't-act' : 't-warn') + '<span style="color:var(--muted)">發布日期：' + esc(a.date) + '</span>' + '<span style="color:var(--muted)">發布對象：' + esc(a.scope) + '</span></div>' + '<h2 style="font-size:1.5rem;font-weight:800;margin-top:16px;color:var(--brick)">' + esc(a.title) + '</h2>' + '<p style="margin-top:16px">' + esc(a.body) + '</p>' + '<div class="btn-row"><a class="btn btn-ghost" href="#/news">回公告列表</a></div>' + '</div></div>';
  };
  var applyState = {
    done: false,
    no: '',
    queryMsg: '',
    stage: ''
  };
  PAGES.apply = function () {
    var locs = S.locations.map(function (l) {
      return '<option>' + esc(l.name) + '</option>';
    }).join('');
    var groups = S.groups.map(function (g) {
      return '<label class="chk"><input type="checkbox"> ' + esc(byId(S.units, g.unitId).name + '　' + g.name) + '</label>';
    }).join('');
    var week = ['週一', '週二', '週三', '週四', '週五', '週六', '週日'].map(function (d) {
      return '<label class="chk"><input type="checkbox"> ' + d + '</label>';
    }).join('');

  ACTS['leave-tab'] = function (el) {

  ACTS['leave-long'] = function (el) {

  ACTS['leave-send'] = function () {
    var ta = document.querySelector('[data-change="leave-reason"]');

    var sel = document.querySelector('[data-change="leave-proxy"]');

      return;

      leaveState.err = '請假事由為必填。';
      render();
      return;
    }
    if (!leaveState.proxy) {
      leaveState.err = '代理人為必填，未指定代理人無法送出；找不到人時請聯繫所屬組別組長，或改到「代班」頁公開徵求。';
      render();
      return;
    }
    var slot = byId(S.slots, leaveState.slot);
    var lng = isLongLeave();
    S.leaves.push({
      id: newId('LV'),
      volunteerId: S.currentVolunteerId,
      slotIds: lng || !slot ? [] : [slot.id],
      from: lng ? leaveState.from : slot ? slot.date : S.today,
      to: lng ? leaveState.to : slot ? slot.date : S.today,
      leaveType: (leaveState.type || '事假').replace('（三個月以上）', ''),
      reason: leaveState.reason.trim(),
      proxyId: leaveState.proxy,
      status: '待代理人回覆',

      isLong: lng,
      late: slot ? HCV.diffDays(S.today, slot.date) < S.params.leaveAdvanceDays : false

  function monthlyHours() {
    var h = hours();
    var id = S.currentVolunteerId;
    var curM = Number(monthOf(S.today).split('-')[1]);
    var cur = 0;
    S.attendance.forEach(function (a) {
      if (a.volunteerId === id && monthOf(a.date) === monthOf(S.today)) {
        cur += a.hours || 0;
      }
    });
    cur = Math.round(cur * 10) / 10;
    var rest = Math.max(0, h.total - cur);
    var w = [1, 1, 1, 1.1, 1.1, 1, 0.9, 1, 1, 1, 1, 1];
    var wsum = 0;
    for (var i = 0; i < curM - 1; i++) {
      wsum += w[i];
    }
    var out = [];
    for (var mth = 1; mth <= 12; mth++) {
      if (mth < curM) {
        out.push(Math.round(rest * (w[mth - 1] / (wsum || 1)) * 2) / 2);
      } else if (mth === curM) {
        out.push(cur);
      } else {
        out.push(0);
      }
    }
    return out;
  }

      return '<div class="col"><span class="cv">' + (v ? hourText(v) : '') + '</span>' + '<span class="bx ' + (i + 1 === curM ? 'on' : '') + '" style="height:' + pct + '%"></span>' + '<span class="cl">' + (i + 1) + '月</span></div>';
    }).join('') + '</div>';
    var det = myAttendance().filter(function (a) {
      return a.hours > 0;
    }).map(function (a) {
      return '<tr>' + '<td data-label="日期">' + esc(HCV.dateLabel(a.date)) + '</td>' + '<td data-label="地點與時段">' + esc(locName(a.locationId) + '　' + a.slotName) + '</td>' + '<td data-label="計入起訖">' + esc((a.countedFrom || '—') + '–' + (a.countedTo || '—')) + '</td>' + '<td data-label="時數" class="num">' + hourText(a.hours) + '</td>' + '<td data-label="狀態">' + statusTag(a.status) + '</td></tr>';
    }).join('') || '<tr><td colspan="5">本年度尚無已計入的服務時數。</td></tr>';
    return head('服務時數', '查詢本年度累計時數與達標情形') + pageTools() + '<div class="wrap">' + '<div class="grid g4">' + statCard('本年度累計時數', hourText(h.total), '小時', '門檻 ' + h.req + ' 小時') + statCard('達成率', h.pct + '%', '', YEAR_ROC + ' 年度') + statCard('排班服務', hourText(h.shift), '小時', '班表出勤累計') + statCard('活動服務', hourText(h.act), '小時', '計時數活動累計') + '</div>' + '<div class="grid g12">' + '<div class="card"><div class="card-h">年度進度</div>' + '<div style="font-family:Georgia,\'Noto Serif TC\',serif;font-size:3rem;color:var(--brick);font-weight:700;margin-top:14px">' + hourText(h.total) + '<small style="font-family:inherit;font-size:1rem;color:var(--ink);margin-left:10px">/ ' + h.req + ' 小時（' + h.pct + '%）</small></div>' + '<div class="bar"><i style="width:' + Math.min(100, h.pct) + '%"></i></div>' + '<div class="hint strong">距離達標還需 ' + hourText(h.left) + ' 小時。</div>' + chart + '<div class="hint">各月服務時數（含排班服務與計時數活動）。</div>' + '</div>' + '<div class="card"><div class="card-h">受訓時數（另計）</div>' + '<div class="big" style="font-family:Georgia,\'Noto Serif TC\',serif;font-size:3rem;color:var(--brick);font-weight:700;margin-top:14px">' + hourText(h.train) + '<small style="font-family:inherit;font-size:1rem;color:var(--ink);margin-left:8px">小時</small></div>' + '<div class="hint strong">教育訓練的受訓時數不併入服務時數，另外統計。</div>' + '<div class="inline-note">年度服務時數由文化局統一彙整造冊。</div>' + '</div>' + '</div>' + '<div class="grid"><div class="card"><div class="card-h">年度彙整</div>' + '<table class="tbl"><thead><tr><th>年度</th><th>排班服務</th><th>活動服務</th><th>總時數</th><th>年度門檻</th><th>是否達標</th></tr></thead><tbody>' + '<tr><td data-label="年度">' + YEAR_ROC + ' 年度</td>' + '<td data-label="排班服務" class="num">' + hourText(h.shift) + '</td>' + '<td data-label="活動服務" class="num">' + hourText(h.act) + '</td>' + '<td data-label="總時數" class="num">' + hourText(h.total) + '</td>' + '<td data-label="年度門檻" class="num">' + h.req + '</td>' + '<td data-label="是否達標">' + (h.total >= h.req ? tag('已達標', 't-green') : tag('尚未達標', 't-warn')) + '</td></tr>' + '</tbody></table></div></div>' + '<div class="grid"><div class="card"><div class="card-h">服務明細</div>' + '<table class="tbl"><thead><tr><th>日期</th><th>地點與時段</th><th>計入起訖</th><th>時數</th><th>狀態</th></tr></thead>' + '<tbody>' + det + '</tbody></table>' + '<div class="hint">時數以分鐘累計，畫面顯示以小時呈現，與文化局報表格式一致。</div></div></div>' + '</div>';
  };
  var actFilter = '全部';
  PAGES.activities = function () {
    var m = me();
    var joinedCount = S.activities.filter(function (a) {
      return a.enrolled.indexOf(m.id) >= 0;
    }).length;
    var kinds = ['全部', '教育訓練', '計時數活動', '我報名的'];
    var tabs = kinds.map(function (k) {
      var label = k === '我報名的' ? '我報名的（' + joinedCount + '）' : k;
      return '<button class="tab ' + (k === actFilter ? 'on' : '') + '" data-act="act-filter" data-v="' + esc(k) + '">' + esc(label) + '</button>';
    }).join('');
    var list = S.activities.filter(function (a) {
      if (actFilter === '我報名的') {
        if (a.enrolled.indexOf(m.id) < 0) {
          return false;
        }
      } else if (actFilter !== '全部' && a.kind !== actFilter) {
        return false;
      }
      if (a.targetGroupIds.length) {
        var ok = false;
        a.targetGroupIds.forEach(function (g) {
          if (m.groupIds.indexOf(g) >= 0) {
            ok = true;
          }
        });
        if (!ok) {
          return false;
        }
      }
      return true;
    });
    var cards = list.length ? list.map(function (a) {
      var joined = a.enrolled.indexOf(m.id) >= 0;
      var full = a.enrolled.length >= a.capacity;
      var btn;
      if (joined) {
        btn = '<button class="btn btn-primary btn-block" data-act="act-cancel" data-id="' + esc(a.id) + '">已報名（點擊取消）</button>';
      } else if (full) {
        btn = '<button class="btn btn-block" disabled>名額已滿</button>';
      } else if (suspended()) {
        btn = '<button class="btn btn-block" disabled>停權中無法報名</button>';
      } else {
        btn = '<button class="btn btn-primary btn-block" data-act="act-join" data-id="' + esc(a.id) + '">我要報名</button>';
      }
      var kindTag = tag(a.kind, a.kind === '教育訓練' ? 't-warn' : 't-act');
      var countTag = tag(a.kind === '教育訓練' ? '受訓時數另計' : '計入服務時數', a.kind === '教育訓練' ? 't-grey' : 't-green');
      var target = a.targetGroupIds.length ? '<div class="hint strong">限 ' + esc(a.targetGroupIds.map(function (g) {
        var x = byId(S.groups, g);
        return x ? x.name : g;
      }).join('、')) + ' 報名</div>' : '';
      return '<div class="card act-card">' + '<div class="act-top">' + kindTag + countTag + '<span class="act-cap">' + a.enrolled.length + '/' + a.capacity + ' 名</span></div>' + '<div class="act-name">' + esc(a.title) + '</div>' + '<div class="act-meta">🗓 ' + esc(a.date) + '　' + esc(a.time) + '（' + esc(hourText(a.hours)) + ' 小時）</div>' + '<div class="act-meta">📍 ' + esc(locName(a.locationId)) + '</div>' + target + btn + '</div>';
    }).join('') : '<div class="card"><div class="hint">' + (actFilter === '我報名的' ? '您目前沒有報名任何活動。' : '目前沒有符合條件的活動。') + '</div></div>';
    return head('活動報名', '報名教育訓練與計時數活動') + '<div class="wrap">' + (suspended() ? suspendNote('活動報名') : '') + '<div class="tabs">' + tabs + '</div>' + '<div class="grid g2">' + cards + '</div>' + '<div class="card" style="margin-top:24px"><div class="card-h">關於活動時數</div>' + '<ul class="login-rules" style="margin-top:14px">' + '<li>計時數活動（會議、導覽、支援等）的出勤時數計入服務時數。</li>' + '<li>教育訓練的受訓時數另外統計，不併入服務時數。</li>' + '<li>活動當天以該活動專屬的 QR Code 簽到；報名與取消都會寄送通知信。</li>' + '</ul></div>' + '</div>';
  };

  ACTS['act-join'] = function (el) {

    return head('我的違規記點', '查詢個人記點明細與來源') + pageTools() + '<div class="wrap">' + suspBox + '<div class="grid g2">' + statCard('目前累計點數', String(pts), '點', '已撤銷的記點不列入累計') + '<div class="alert"><div class="ic">!</div><div><h4>提醒</h4><p>' + esc(S.params.pointReminderText.replace('{N}', pts)) + '</p></div></div>' + '</div>' + '<div class="grid"><div class="card"><div class="card-h">記點明細</div>' + '<table class="tbl"><thead><tr><th>發生日期</th><th>違規項目</th><th>點數</th><th>來源</th><th>狀態</th><th>備註</th></tr></thead>' + '<tbody>' + body + '</tbody></table>' + '<div class="hint">對紀錄有疑問請洽服務地點管理者。</div></div></div>' + '</div>';
  };
  var profMsg = '';
  PAGES.profile = function () {

    return head('個人資料', '姓名與證號由圖書館系統帶入；可自行維護聯絡方式') + '<div class="wrap"><div class="grid g2">' + '<div class="card"><div class="card-h">基本資料</div>' + '<div class="field"><label>姓名</label><input class="inp" type="text" value="' + esc(m.name) + '" readonly></div>' + '<div class="field"><label>志工編號</label><input class="inp" type="text" value="' + esc(m.no || '—') + '" readonly></div>' + '<div class="field"><label>所屬大組</label><input class="inp" type="text" value="' + esc(myUnitName()) + '" readonly></div>' + '<div class="field"><label>組別</label><input class="inp" type="text" value="' + esc(HCV.groupNames(S, m)) + '" readonly></div>' + '<div class="field"><label>服務地點</label><input class="inp" type="text" value="' + esc(m.locationIds.map(locName).join('、')) + '" readonly></div>' + '<div class="field"><label>志工資格狀態</label><input class="inp" type="text" value="' + esc(m.status) + '" readonly></div>' + '</div>' + '<div class="card"><div class="card-h">聯絡方式</div>' + (profMsg ? '<div class="ok-box">' + esc(profMsg) + '</div>' : '') + '<div class="field"><label>聯絡電話</label><input class="inp" id="pfPhone" type="text" value="' + esc(m.phone) + '"></div>' + '<div class="field"><label>電子郵件</label><input class="inp" id="pfMail" type="text" value="' + esc(m.email) + '" placeholder="未留 Email 將收不到系統通知"></div>' + '<div class="btn-row"><button class="btn btn-primary" data-act="prof-save">儲存</button></div>' + '<div class="inline-note">系統通知一律以 Email 發送，請確認信箱正確，以免漏接排班、請假與代班的通知。</div>' + '<div class="hint">姓名、身分證字號與借閱證號為圖書館系統的主檔資料，請至館藏查詢系統辦理變更。</div>' + '</div>' + '</div></div>';
  };
  ACTS['prof-save'] = function () {
    var m = me();
    m.phone = document.getElementById('pfPhone').value.trim();
    m.email = document.getElementById('pfMail').value.trim();
    save();
    profMsg = '聯絡方式已更新。';

  };
  uiLoad();
  S = HCV.load();
  if (UI.who && byId(S.volunteers, UI.who)) {
    S.currentVolunteerId = UI.who;
  }
  applyFont();
  window.addEventListener('hashchange', render);
  render();
})();
