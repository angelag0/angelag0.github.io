<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0F5CA8">
<title>旅伴</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>

:root{
  --paper:#FFFFFF; --card:#FFFFFF; --ink:#1F1F1F; --muted:#5E5E5E; --line:#D4D4D4; --soft:#F2F2F2;
  --blue:#0F5CA8; --blue-bg:#E8F0FA; --on-blue:#FFFFFF; --red:#A8201A; --red-bg:#FBECEB; --ok:#1A6E3F;
  --tap:44px; --tap-lg:48px; --gap:12px; --pad:14px; --nav:56px;
}
@media (prefers-color-scheme: dark){
  :root{--paper:#191919; --card:#222222; --ink:#EEEEEE; --muted:#ABABAB; --line:#3D3D3D; --soft:#2A2A2A;
    --blue:#8DB9F0; --blue-bg:#24344A; --on-blue:#14202E; --red:#F0A29B; --red-bg:#3A2422; --ok:#7FC694}
}

:root[data-tone="outdoor"]{--paper:#FFFFFF; --card:#FFFFFF; --ink:#000000; --muted:#333333; --line:#8A8A8A; --soft:#EDEDED; --blue:#0A4A8C; --blue-bg:#DCE9F8; --on-blue:#FFFFFF; --red:#8E1410; --red-bg:#F9E3E1; --ok:#115C32}
:root[data-tone="calm"]{--paper:#F6F5F1; --card:#FBFAF7; --ink:#333333; --muted:#6B6B6B; --line:#D9D6CE; --soft:#ECEAE4; --blue:#2F5F8F; --blue-bg:#E6EDF4; --on-blue:#FFFFFF; --red:#9A3B36; --red-bg:#F5E9E7; --ok:#3D6E52}
:root[data-tone="dark"]{--paper:#191919; --card:#222222; --ink:#EEEEEE; --muted:#ABABAB; --line:#3D3D3D; --soft:#2A2A2A; --blue:#8DB9F0; --blue-bg:#24344A; --on-blue:#14202E; --red:#F0A29B; --red-bg:#3A2422; --ok:#7FC694}

*{box-sizing:border-box}
html{font-size:17px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;line-height:1.5;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:underline;text-underline-offset:2px}   
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.boot{padding:24px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.num{font-variant-numeric:tabular-nums}
.ok{color:var(--ok)}
.bad{color:var(--red)}
.hide{display:none}
.ic{flex:none;vertical-align:-.2em}
.t-xl{font-size:1.9rem;font-weight:700;line-height:1.2}
.t-lg{font-size:1.3rem;font-weight:700;line-height:1.25}


.frame{display:flex;flex-direction:column;min-height:100vh;max-width:640px;margin:0 auto}

.top{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top, 0px)}
.top.editing{background:var(--blue-bg);border-bottom-color:var(--blue)}
.top-row{display:flex;align-items:center;gap:8px;min-height:48px;padding:2px calc(6px + env(safe-area-inset-right, 0px)) 2px calc(var(--pad) + env(safe-area-inset-left, 0px))}   
.top-title{flex:1;min-width:0;font-size:1.05rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-title small{display:block;font-size:.72rem;font-weight:400;color:var(--muted);line-height:1.1}

.pill{flex:none;display:inline-flex;align-items:center;gap:4px;min-height:var(--tap);min-width:var(--tap);padding:0 6px;border:0;border-radius:4px;background:none;color:var(--blue);font-size:.82rem;white-space:nowrap;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--blue-bg);font-weight:700}
.pill.bad,.pill.sos{color:var(--red)}
.pill.sos[aria-pressed="true"]{background:var(--red-bg)}

.status{display:flex;align-items:center;gap:8px;min-height:var(--tap);padding:6px calc(6px + env(safe-area-inset-right, 0px)) 4px calc(var(--pad) + env(safe-area-inset-left, 0px));border-bottom:1px solid var(--line);background:var(--soft);font-size:.85rem;line-height:1.35}   
.status>span{flex:1;min-width:0}
.status.warn{background:var(--red-bg);color:var(--red)}
.status.info{background:var(--blue-bg)}
body.editing{--bar:56px}                                       
.main{flex:1;padding:var(--gap) calc(var(--pad) + env(safe-area-inset-right, 0px)) calc(var(--nav) + var(--bar, 0px) + 60px) calc(var(--pad) + env(safe-area-inset-left, 0px))}
.main [id]{scroll-margin-top:calc(56px + env(safe-area-inset-top, 0px));scroll-margin-bottom:calc(var(--nav) + var(--bar, 0px) + 8px + env(safe-area-inset-bottom, 0px))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:center;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{display:flex;width:100%;max-width:640px;padding:0 env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px)}
.nav-item{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:var(--nav);padding:4px 0;border:0;background:none;color:var(--muted);font-size:.72rem;line-height:1.2;cursor:pointer}
.nav-item[aria-current="page"]{color:var(--blue);font-weight:700}
.nav-item[aria-current="page"] .ic{stroke-width:2.4}
.nav-item .badge{top:4px;right:calc(50% - 22px)}

.savebar{position:fixed;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom));z-index:58;display:flex;align-items:center;gap:8px;max-width:640px;min-height:56px;margin:0 auto;padding:4px calc(var(--pad) + env(safe-area-inset-right, 0px)) 4px calc(var(--pad) + env(safe-area-inset-left, 0px));background:var(--blue-bg);border:0;border-top:1px solid var(--blue);color:var(--ink);font-size:.88rem}
.savebar-n{flex:1;min-width:0;font-weight:700;text-align:left;line-height:1.3}
.savebar .btn{min-height:var(--tap);padding:6px 10px;font-size:.9rem}
.savebar .btn.danger{margin-right:6px}
.savebar.thin{width:100%;min-height:var(--tap);cursor:pointer;color:var(--blue)}
.savebar.thin .savebar-n{font-weight:400;color:var(--ink)}

body.typing .nav,body.typing .savebar{display:none}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}


.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--tap);padding:6px 14px;border:1px solid var(--line);border-radius:4px;background:var(--card);font-size:.95rem;text-decoration:none;color:var(--ink);cursor:pointer;line-height:1.25}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue);font-weight:700}
.btn.big{min-height:var(--tap-lg);font-size:1rem;padding:8px 18px}
.btn.wide{display:flex;width:100%}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.plain{border-color:transparent;background:none;color:var(--blue);padding:6px 8px}
.btn[disabled]{color:var(--muted);background:var(--soft);border-color:var(--line);cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.btns.even>.btn{flex:1}
.btns.end{justify-content:flex-end}

.ibtn{position:relative;flex:none;display:inline-flex;align-items:center;justify-content:center;gap:3px;min-width:var(--tap);min-height:var(--tap);padding:0 6px;border:0;border-radius:4px;background:none;color:var(--ink);cursor:pointer}
.ibtn[disabled]{color:var(--line);cursor:not-allowed}
.ibtn[aria-pressed="true"]{color:var(--blue)}
.ibtn.chev{min-width:var(--tap-lg);min-height:var(--tap-lg);color:var(--muted)}
.ibtn.sos{color:var(--red)}
.ibtn-text{font-size:.78rem;white-space:nowrap}

.badge{position:absolute;top:4px;right:2px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--red);color:#FFFFFF;font-size:.68rem;font-weight:700;line-height:18px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:calc(var(--pad) * -1);margin-right:calc(var(--pad) * -1);padding:0 var(--pad)}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:var(--tap);min-height:var(--tap);padding:4px 12px;border:1px solid var(--line);border-radius:4px;background:var(--card);font-size:.9rem;color:var(--ink);text-decoration:none;cursor:pointer;line-height:1.2;text-align:center}
.chip small{display:block;font-size:.72rem;color:var(--muted)}
.chip[aria-pressed="true"],.chip[aria-current="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.chip[aria-pressed="true"] small,.chip[aria-current="true"] small{color:var(--on-blue)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg-b{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:60px;min-height:var(--tap);padding:4px 12px;border:0;border-left:1px solid var(--line);background:var(--card);font-size:.9rem;cursor:pointer}
.seg-b:first-child{border-left:0}
.seg-b[aria-pressed="true"]{background:var(--blue);color:var(--on-blue);font-weight:700}

.subtabs{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;margin:0 calc(var(--pad) * -1) var(--gap);padding:0 var(--pad);border-bottom:1px solid var(--line)}
.subtabs::-webkit-scrollbar{display:none}
.subtab{flex:1 0 auto;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:64px;min-height:var(--tap-lg);padding:3px 10px;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);font-size:.95rem;line-height:1.2;white-space:nowrap;cursor:pointer}
.subtab small{font-size:.72rem}
.subtab[aria-selected="true"]{color:var(--blue);font-weight:700;border-bottom-color:var(--blue)}
.tag{display:inline-block;margin-left:4px;padding:0 6px;border:1px solid var(--line);border-radius:4px;font-size:.75rem;font-weight:400;color:var(--muted);vertical-align:middle;white-space:nowrap}
.tag.blue{border-color:var(--blue);color:var(--blue)}
.tag.red{border-color:var(--red);color:var(--red)}
.tag.draft{border-style:dashed}
.mark{display:inline-flex;align-items:center;gap:2px;margin-left:6px;font-size:.75rem;color:var(--muted);white-space:nowrap;vertical-align:middle}
.mark.red{color:var(--red)}

.place{display:inline-block;min-width:44px;min-height:44px;padding:11px 0;margin:-11px 0;box-sizing:border-box;color:var(--blue);text-decoration:underline;text-underline-offset:3px;font-weight:700}   
.place.big{font-size:1.9rem;line-height:1.2;padding:3px 0;margin:-3px 0}   
.place-off{font-weight:700}
.place-off.big{font-size:1.9rem;line-height:1.2}


.sec{margin:18px 0 0}
.sec:first-child{margin-top:0}
.sec-h{display:flex;align-items:baseline;gap:8px;margin:0 0 6px;font-size:.95rem;font-weight:700}
.sec-h .muted{font-weight:400;font-size:.82rem}
.sec-h .btn{margin-left:auto}
.box{border:1px solid var(--line);border-radius:6px;background:var(--card);padding:10px 12px}
.box+.box{margin-top:8px}
.box.accent{border-color:var(--blue)}
.box.alert{border-color:var(--red)}
.box.call{margin-top:8px}
.call-n{font-weight:700}
.list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.list>li{border-top:1px solid var(--line)}
.list>li:first-child{border-top:0}
.list.flat{border-left:0;border-right:0;border-radius:0;margin-left:calc(var(--pad) * -1);margin-right:calc(var(--pad) * -1)}
.row{display:flex;align-items:center;gap:10px;width:100%;min-height:var(--tap);padding:8px 12px;border:0;background:none;text-align:left;text-decoration:none;color:var(--ink);cursor:pointer}
.row.static{cursor:default}
.row-t{flex:none;min-width:3.1em;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.row-ic{flex:none;display:inline-flex;color:var(--muted)}
.row-body{flex:1;min-width:0}
.row-title{display:block;font-size:.98rem;overflow-wrap:anywhere}
.row-sub{display:block;font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.row-end{flex:none;font-size:.85rem;color:var(--muted);text-align:right}
.row-chev{flex:none;display:inline-flex;color:var(--muted)}
.row.done .row-title{color:var(--muted);text-decoration:line-through}
.check{flex:none;width:24px;height:24px;border:2px solid var(--muted);border-radius:4px;background:var(--card);position:relative}
.row.done .check{border-color:var(--ok);background:var(--ok)}
.row.done .check::after{content:"";position:absolute;left:6px;top:1px;width:6px;height:12px;border:solid var(--card);border-width:0 3px 3px 0;transform:rotate(45deg)}

.acc.open>.row,.acc.open>.split-h{background:var(--soft)}
.acc-b{padding:10px 12px 12px;border-top:1px solid var(--line);font-size:.92rem}
.acc-b>p+p{margin-top:6px}
.split{display:block}
.split-h{display:flex;align-items:center;gap:8px}   
.split-h>.row{flex:1;min-width:0}
.kv{display:flex;gap:10px;padding:4px 0;font-size:.92rem}
.kv>span:first-child{flex:none;width:5.5em;color:var(--muted)}
.kv>span:last-child{flex:1;min-width:0;overflow-wrap:anywhere}
.empty{padding:14px 12px;border:1px dashed var(--line);border-radius:6px;color:var(--muted);font-size:.92rem}
.note{padding:8px 12px;border:1px solid var(--line);border-radius:4px;background:var(--soft);font-size:.88rem}
.warnline{margin:6px 0;padding:8px 12px;border:1px solid var(--red);border-radius:4px;background:var(--red-bg);color:var(--red);font-size:.9rem}
details.more{margin-top:6px;font-size:.88rem}
details.more>summary{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:var(--tap);color:var(--ink);cursor:pointer;list-style:none}   
details.more>summary::-webkit-details-marker{display:none}
details.more>summary .ic{color:var(--muted)}
details.more[open]>summary .ic{transform:rotate(180deg)}   
.big-code{font-size:2.1rem;font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums;word-break:break-all}


.field{display:block;margin:10px 0}
.field>span{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.field>small{display:block;margin-top:3px;font-size:.78rem}
.input{width:100%;min-height:var(--tap);padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink)}
.input.num{font-size:1.3rem;font-weight:700}
textarea.input{min-height:120px;line-height:1.4}
.choice{display:flex;flex-wrap:wrap;gap:8px}
.choice-i{position:relative;display:inline-flex}
.choice-i input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.choice-i span{display:inline-flex;align-items:center;min-height:var(--tap);padding:4px 14px;border:1px solid var(--line);border-radius:4px;background:var(--card);font-size:.92rem}
.choice-i input:checked+span{background:var(--blue);border-color:var(--blue);color:var(--on-blue);font-weight:700}
.choice-i input:focus-visible+span{outline:2px solid var(--blue);outline-offset:1px}
.input:focus,.btn:focus-visible,.chip:focus-visible,.row:focus-visible,.nav-item:focus-visible,.ibtn:focus-visible,.seg-b:focus-visible,.subtab:focus-visible,.place:focus-visible{outline:2px solid var(--blue);outline-offset:1px}


#mask{display:none;position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.4)}
#sheet{display:none;position:fixed;left:0;right:0;bottom:0;z-index:100;max-height:88vh;max-height:88dvh;overflow:auto;overscroll-behavior:contain;background:var(--card);color:var(--ink);border-top:1px solid var(--line);border-radius:6px 6px 0 0;box-shadow:0 -2px 12px rgba(0,0,0,.18)}
#sheet.full{top:0;max-height:none;height:100vh;height:100dvh;border-radius:0;padding-top:env(safe-area-inset-top, 0px)}   
#sheet.full .sheet-h{top:env(safe-area-inset-top, 0px)}
body.sheet-open #mask,body.sheet-open #sheet{display:block}
body.sheet-open{overflow:hidden}
.sheet{max-width:640px;margin:0 auto;padding:0 calc(var(--pad) + env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom)) calc(var(--pad) + env(safe-area-inset-left, 0px))}
.sheet-h{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;margin:0 calc(var(--pad) * -1);padding:2px 4px 2px var(--pad);background:var(--card);border-bottom:1px solid var(--line)}
.sheet-h h2{flex:1;min-width:0;font-size:1.02rem}
.sheet-body{padding-top:10px}
.sheet-foot{position:sticky;bottom:0;z-index:2;display:flex;gap:8px;margin:14px calc(var(--pad) * -1) -16px;padding:10px var(--pad) calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
.sheet-foot .btn{flex:1}


.pv-pending{margin:0 0 10px;padding:8px 12px 2px;border:1px solid var(--blue);border-radius:4px;background:var(--blue-bg);font-size:.95rem}   
.pv-pending .btns{margin:6px 0}
.pv-src+.pv-src{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}   
.pv-src-h{font-size:1rem;margin-bottom:6px;overflow-wrap:anywhere}
.pv-text{font-size:.98rem}
.pv-group{margin:12px 0 0}
.pv-group h3{font-size:.9rem;margin-bottom:4px}
.pv-line{display:flex;flex-wrap:wrap;gap:2px 8px;padding:4px 0;border-top:1px solid var(--soft);font-size:.92rem}
.pv-line:first-of-type{border-top:0}
.pv-name{flex:1 1 9em;min-width:0;overflow-wrap:anywhere}
.pv-from{color:var(--muted);text-decoration:line-through;white-space:nowrap}
.pv-to{font-weight:700;max-width:100%;overflow-wrap:anywhere;text-align:right}   
.pv-money{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem}


#toast{display:none;position:fixed;left:calc(12px + env(safe-area-inset-left, 0px));right:calc(12px + env(safe-area-inset-right, 0px));bottom:calc(var(--nav) + var(--bar, 0px) + 12px + env(safe-area-inset-bottom, 0px));z-index:120;justify-content:center}
#toast.on{display:flex}
.toast{display:flex;align-items:center;gap:8px;max-width:560px;padding:4px 6px 4px 14px;border-radius:4px;background:var(--ink);color:var(--paper);font-size:.92rem;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.toast>span{padding:8px 0}
.toast .btn{min-height:var(--tap);border:0;background:none;color:var(--paper);text-decoration:underline}


.center{max-width:480px;margin:0 auto;padding:28px var(--pad)}
.center h1{font-size:1.2rem;margin-bottom:10px}
.center p{margin:8px 0}
.errbox{padding:12px;border:1px solid var(--red);border-radius:6px;background:var(--red-bg);color:var(--red);font-size:.9rem;white-space:pre-wrap;word-break:break-word}



.tl-stop{display:flex;align-items:center;gap:8px;width:100%;min-height:var(--tap-lg);padding:4px 0 4px 12px;border:0;background:none;color:var(--ink);text-align:left}
.tl-btn{padding-right:14px;cursor:pointer}
.tl-btn:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.tl-stop-t{flex:none;width:3.1em;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.25}
.tl-stop-t small{display:block;font-size:.72rem}
.tl-stop-b{flex:1;min-width:0;line-height:1.35;overflow-wrap:anywhere}
.tl-stop-b small{display:block;font-size:.8rem;color:var(--muted)}
.tl-stop-b.done .tl-ttl{color:var(--muted);text-decoration:line-through}
.tl-cardh .tl-ttl{font-weight:700}
.tl-card{list-style:none}          
.tl-card.one{padding:0}
.tl>li.now,.tl-stops>li.now{background:var(--blue-bg)}
.tl>li.past .tl-stop-t,.tl>li.past .tl-ttl,.tl-stops>li.past .tl-stop-t,.tl-stops>li.past .place{color:var(--muted)}
.tl-gap .tl-stop{min-height:40px}
.tl-home .tl-stop{min-height:var(--tap-lg)}   

.tl-stop-b .place{position:relative;z-index:1;padding:4px 0 17px;margin:-4px 0 -17px}
.tl-stop-b:not(:has(> small)) .place{padding:11px 0;margin:-11px 0}
.tl-stop-b:not(:has(> small)){padding:7px 0}   
.tl-gap .tl-ttl{color:var(--muted);font-size:.88rem}
.tl-flag{margin:0 12px 8px}

.tr-date:focus-visible,.tr-route:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}

.tr-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 10px}
.tr-route{flex:1 1 auto;min-width:72px;display:flex;align-items:center;gap:4px;min-height:var(--tap);padding:2px 0;border:0;background:none;color:var(--blue);text-align:left;cursor:pointer}
.tr-route-b{min-width:0;font-size:.92rem;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.tr-route-b small{display:block;font-size:.72rem;font-weight:400;color:var(--muted)}
.tr-tools{flex:none;display:flex;align-items:center;gap:8px;margin-left:auto}
.tr-tools .seg-b{min-width:0;padding:4px 8px}
.tr-tools .btn{padding:6px 10px}
.tr-saved{margin:-2px 0 8px}

.tr-all{margin-top:4px}
.tr-places{line-height:1.6}
.tr-gates{margin-top:8px}
.tr-more{margin-top:var(--gap)}
.tr-logr{padding:6px 12px 2px}
.tr-logr .btns{margin:6px 0}

.tr-ed>li{padding:6px 12px}
.tr-fix{display:flex;align-items:baseline;gap:8px;color:var(--muted);font-size:.85rem;line-height:1.35}
.tr-t{flex:none;width:3.1em;font-variant-numeric:tabular-nums}
.tr-fix-b{flex:1;min-width:0;overflow-wrap:anywhere}
.tr-fix-b small{display:block;font-size:.78rem}
.tr-fixed{color:var(--muted)}
.tr-ride{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:.88rem}
.tr-ride .btn{flex:none;padding:6px 10px;font-size:.9rem}
.tr-ride-t{min-width:0}
.tr-start-k{font-weight:700}
.tr-start .tr-l1{flex-wrap:wrap}
.tr-home{color:var(--ink)}
.tr-ed>li.tr-row{padding:8px 12px}
.tr-l1,.tr-l2{display:flex;align-items:center;gap:8px}
.tr-l2{flex-wrap:wrap;margin-top:8px}
.tr-name{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.tr-name small{display:block;font-size:.8rem;font-weight:400;color:var(--muted)}
.tr-mv{flex:none;display:flex;gap:8px}
.tr-l1 .btn,.tr-l2 .btn{padding:6px 8px;font-size:.9rem}
.tr-del{flex:none}
.tr-tb{font-variant-numeric:tabular-nums}
.tr-stay{font-size:.85rem;color:var(--muted)}
.tr-far{margin-left:auto}
.tr-head .tr-name{padding-left:68px}
.tr-flag{margin:4px 0 0}
.tr-ed .warnline{margin:6px 0 2px}
.tr-mod{background:var(--blue-bg)}
.tr-gone .tr-x{color:var(--muted);font-weight:400;text-decoration:line-through}
.tr-warns{padding-top:0}
.tr-endbtns{margin-top:var(--gap)}

.tr-sk{width:auto;min-width:1.6em}
.tr-tform{flex:none;margin:0}
.tr-tin{width:4.2rem;padding:6px 2px;text-align:center;font-size:1.2rem}
.tr-limit{margin:2px 0 8px;color:var(--ink)}
.tr-fx .warnline{margin:6px 0}
