<title>莫夏印度餐廳菜單</title>
<style>
:root{--fg:#1f2328;--muted:#59636e;--line:#d0d7de;--bg:#fff;--bg2:#f6f8fa;--pri:#1a63b5}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;color:var(--fg);background:var(--bg2);line-height:1.5;font-size:17px}
.top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{max-width:720px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.top h1{flex:1;margin:0;font-size:18px;line-height:1.3}
.fb{min-height:40px;padding:6px 12px;border:1px solid var(--line);background:var(--bg);border-radius:6px;text-decoration:none;color:var(--pri);display:inline-flex;align-items:center;white-space:nowrap}
.wrap{max-width:720px;margin:0 auto;padding:10px 16px 32px}
.hint{margin:0 0 10px;color:var(--muted);font-size:15px}
.pg{display:block;width:100%;height:auto;margin:0 0 10px;background:var(--bg);border:1px solid var(--line)}
.foot{margin-top:16px;font-size:15px;color:var(--muted)}
</style>
