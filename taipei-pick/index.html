<style>
:root{--fg:#1f2328;--muted:#59636e;--faint:#aab2bb;--line:#d0d7de;--bg:#fff;--bg2:#f6f8fa;--pri:#1a63b5;--pri-bg:#e7f0fb;--pri-line:#9cbfe8;--warn:#7a4d00;--warn-bg:#fff4d6;--warn-line:#e0b44a;--in-lo:#b3261e;--in-hi:#1d6b35}

.muted{color:var(--muted)}

.grow{flex:1;min-width:0}
.wrap{max-width:720px;margin:0 auto;padding:10px 16px 96px}
.fb{min-height:40px;padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:6px;white-space:nowrap;text-decoration:none;color:var(--fg);display:inline-flex;align-items:center;justify-content:center}

.sx{border:0;background:none;color:var(--faint);font-size:17px;min-width:40px;min-height:40px;padding:0}

.seg button{min-height:36px;padding:4px 12px;border:0;background:#fff;font-size:15px}

.seg button.on{background:var(--pri-bg);color:var(--pri);font-weight:700}

pre.msg{white-space:pre-wrap;word-break:break-all;font:inherit;font-size:14px;background:var(--bg2);padding:10px;border-radius:4px;margin:8px 0;max-height:40vh;overflow:auto}

.enl li{margin:6px 0}
.enh{margin:2px 0 8px}
.inlo,.tile .tp .sp.inlo{color:var(--in-lo)}

.lb .cap .lbp .sp.inhi{color:#7ee2a8;opacity:1}

.pin.m{border-color:var(--pri);color:var(--pri)}
.pin.n{opacity:.4}

.lab{color:var(--muted);width:44px;flex:none}

.srow .strip{margin:0 0 12px}

.vno{color:var(--warn);font-weight:700}

.links{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}

.kv dd{margin:0}
.warnl{color:var(--warn)}

.day h3{font-size:16px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.slot{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--bg2);align-items:flex-start}

.cell.ov{border-color:var(--pri);font-weight:700}
.cell.y.ov{background:var(--pri-bg);color:var(--pri)}
</style>
