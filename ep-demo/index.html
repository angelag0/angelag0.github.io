/* ── 設計 token（角色制命名；--ico-* 四個 data URI 自原檔逐字照抄） ── */
:root{
  /* 亮區文字三階＋元件色（★V1 黑白版白名單） */
  --ink-strong:#000;   /* 標題階：區塊標題、卡片標題、品名、組標題、統計數字、必填* */
  --ink:#111;          /* 元件色（非文字階）：鈕底、描邊、導覽字、藥丸槽、標記底、focus */
  --body:#333;         /* 內文階 */
  --muted:#777;        /* 輔助階：eyebrow、摘要、hint、placeholder、統計標籤、telNote */
  --w:#FFF;
  /* 線兩階 */
  --line:#E5E5E5;      /* 容器線與分隔（導覽下緣、表單組分隔） */
  --line-input:#D4D4D4;/* 輸入類邊線（比容器線深一階）＋白底非作用圓點 */
  /* 帶色與面板 */
  --band-light:#F5F5F5;/* 淺灰帶：白皮三帶＋CTA二 卡底＋頁尾主帶（0802 二輪更正④） */
  --band-promo:#1F1F1F;/* 工具列促銷帶 */
  --surface:#F4F5F7;   /* 下拉項目 hover 底（V1 值） */
  /* 深底文字只有兩階（0802 二輪更正④：頁尾改明亮式後，深底階只剩促銷帶、大圖與產品遮罩用） */
  --on-dark:#FFF;
  --on-dark-sub:rgba(255,255,255,.62);
  --dot-dark-off:rgba(255,255,255,.35);
  /* 浮層（播放鍵、平台標籤、大圖圓點容器、元件標示）＝V1 統一值 */
  --scrim:rgba(0,0,0,.62);
  /* 字級五層（蒸餾 §四） */
  --fs-h1:38px;--fs-h2:30px;--fs-h3:24px;--fs-h4:20px;--fs-body:14px;
  --lh-h1:1.21;--lh-h2:1.27;--lh-h3:1.33;--lh-h4:1.4;--lh-body:1.57;--lh-ctrl:1.2;
  /* 間距四階（蒸餾 §五／§六） */
  --sp-1:8px;--sp-2:16px;--sp-3:24px;--sp-4:48px;
  /* 圓角四階（0803 施工單一：V2 膠囊語彙定版）
     999＝按鈕・輸入框・搜尋・tel 鈕・送出鈕・浮層膠囊・標記（HOT／85折）
     20 ＝卡片類（新聞卡・表單卡・下拉面板・textarea 外框・上傳虛線框・箭頭鈕）
     14 ＝圖片／影片容器（大圖・新聞圖・橫幅・產品圖・CTA 圖・影片框・QR・TT logo・LOGO 框）
     9999＝正藥丸（社群圓鈕・認證徽章・大圖圓點容器）；正圓只留圓點本體 */
  --r-btn:999px;--r-card:20px;--r-img:14px;--r-pill:9999px;
  /* 陰影兩組（蒸餾 §五，值不隨色值回歸變動） */
  --sh:0 6px 16px rgba(0,0,0,.08), 0 3px 6px -4px rgba(0,0,0,.12), 0 9px 28px 8px rgba(0,0,0,.05);
  --sh-h:0 12px 28px rgba(0,0,0,.12), 0 6px 12px -4px rgba(0,0,0,.16), 0 12px 32px 8px rgba(0,0,0,.08);
  /* 容器（0803 晚更正：照現行前台版心＝94–96vw 流動、≥1620 視窗封頂 1500–1540
     〔styleB：.contacts 1500／.newsBlock 1520／.oneXtwo 1540／.aboutUs padding calc(50vw-760px)〕
     → 統一取 96vw＋封頂 1520；初判「內頁 1200 置中」為誤讀，已作廢） */
  --wrap:1520px;
  /* 字體（蒸餾 §四：Open Sans 為首，備援本機中文字型；不外連字型檔） */
  --ff:"Open Sans","Segoe UI","Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;
  /* 遮罩圖示（data URI 逐字照抄原檔；顏色由 currentColor 決定，內含 black 僅為 mask 來源） */
  --ico-chev:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M14.5 5 7.5 12l7 7' fill='none' stroke='black' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  --ico-down:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='m3.5 6 4.5 4.5L12.5 6' fill='none' stroke='black' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  --ico-search:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 18'><circle cx='8' cy='8' r='5.4' fill='none' stroke='black' stroke-width='1.8'/><path d='m12.2 12.2 3.8 3.8' stroke='black' stroke-width='1.8' stroke-linecap='round'/></svg>");
  --ico-check:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='m3 8.5 3.5 3.5L13 5' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>");
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--w);color:var(--body);font-family:var(--ff);
  font-size:var(--fs-body);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}

/* ── 分頁切換器＝demo 外殼（不列入色彩系統，樣式自 index-0728四版.html 照抄；
      z-index 110＋line-height 1＝與 sticky 導覽並存、高度固定 46px）；
      0802 更正④：兩顆分頁改承載「表單雙版本」V1／V2，不再是四款皮 ── */
.skinSwitch{position:sticky;top:0;z-index:110;display:flex;
  background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid #e2e2e2}
.skinSwitch button{font:inherit;font-size:14px;font-weight:600;line-height:1;color:#999;background:none;border:0;cursor:pointer;
  padding:14px 26px;border-bottom:3px solid transparent;transition:.15s}
.skinSwitch button:hover{color:#111}
.skinSwitch button[aria-selected="true"]{color:#111;border-bottom-color:#111}

/* 「現有設計稿參考」分頁＝設計師整張設計稿原圖（0803；demo 外殼，不列入色彩系統）；
   0803 更正輪二：原始尺寸置中（原檔寬 1440px、不放大不縮小＝最銳利，縮放交給瀏覽器 Ctrl+滾輪）；
   視窗窄於原圖時容器水平捲動 */
.draftPage{background:#fff;overflow-x:auto}
.draftPage img{display:block;width:auto;max-width:none;margin:0 auto}

/* ================================================================
   A. 全站共用層（亮區三階＋蒸餾 §四／§五 全站規則）
      0803 單版：原「共用層＋白皮」已合併為本層，切換器與黑皮退場
   ================================================================ */
.vx{background:var(--w);color:var(--body);font-family:var(--ff)}
/* 外框公式：任何視窗寬度下全區塊左右緣逐 px 對齊；
   0803 晚更正（靖慈點1 二次反饋）：改現行前台同款流動版心＝96vw、封頂 --wrap 1520
   （1920 視窗＝內容 1520、每側留白 200＝與現行站一致） */
.vx .wrap{width:96vw;max-width:var(--wrap);margin:0 auto}
/* 區塊上下留白 48＝蒸餾 §五 間距第四階（Xometry 密度，比 V1 原本 88 緊） */
.vx section{padding:var(--sp-4) 0}
/* 區塊標題 H2 30／1.27（§四）＋標題階 #000；軸線沿用 V1 T 字置中 */
.vx h2{font-size:var(--fs-h2);line-height:var(--lh-h2);font-weight:700;color:var(--ink-strong);
  margin:0 0 var(--sp-3);text-align:center}

/* 佔位圖：材質三值＝照片載入前的 fallback（非 UI 色；真實照片由 .phImg 覆蓋） */
.vx .ph{position:relative;overflow:hidden;display:block;
  background:linear-gradient(135deg,#cfcfcf,#efefef 42%,#bdbdbd)}
/* 元件標示＝浮層語彙（V1 統一浮層 rgba(0,0,0,.62) 白字），與平台標籤同一種浮層 */
.vx .ph::after{content:attr(data-label);position:absolute;left:50%;bottom:var(--sp-2);transform:translateX(-50%);
  max-width:calc(100% - var(--sp-4));padding:var(--sp-1) var(--sp-2);border-radius:var(--r-btn);
  background:var(--scrim);color:var(--on-dark);font-size:var(--fs-body);line-height:var(--lh-ctrl);text-align:center}
.vx .ph:not([data-label])::after{display:none}
.vx .adv .ph::after{top:50%;bottom:auto;transform:translate(-50%,-50%)}
.vx .ph > img.phImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}

/* 輪播箭頭（蒸餾 §七.5／§九）：白底方圓鈕 8＋標準陰影、圖示 #111，卡列在外緣 */
.vx .arrowLeft,.vx .arrowRight{position:absolute;top:50%;transform:translateY(-50%);z-index:3;
  width:40px;height:40px;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none;
  background:var(--w);color:var(--ink);border-radius:var(--r-card);box-shadow:var(--sh);transition:.2s ease}
.vx .arrowLeft:hover,.vx .arrowRight:hover{box-shadow:var(--sh-h)}
.vx .arrowLeft::before,.vx .arrowRight::before{content:"";width:16px;height:16px;background:currentColor;
  -webkit-mask:var(--ico-chev) center/contain no-repeat;mask:var(--ico-chev) center/contain no-repeat}
.vx .arrowRight::before{transform:scaleX(-1)}
.vx .arrowLeft{left:calc(var(--sp-4) * -1)} .vx .arrowRight{right:calc(var(--sp-4) * -1)}

/* 圓點指示器：填色雙態、正圓（§五 圓角唯一例外＝圓點本體）；白底＝#111／#D4D4D4 */
.vx .indicator{display:flex;justify-content:center;margin-top:var(--sp-3)}
.vx .indicator ul{display:flex;gap:var(--sp-1);list-style:none;padding:0;margin:0}
.vx .indicator li{width:8px;height:8px;border-radius:50%;background:var(--line-input);display:block}
.vx .indicator li.now{background:var(--ink)}

/* ── 按鈕兩型（色值＝V1 元件色 #111）：radius 膠囊 999、內距 8×24、14／600 ──
   0803：深帶退場後「③暗底次要」無使用處，隨黑皮一併移除；
   hover 一律不做黑白反轉，只加陰影／降透明度（規格 §二 hover 鐵則） */
/* ①主要＝#111 實心白字（.btn 同時涵蓋 CTA 兩顆與表單送出鈕） */
.vx .btn{display:inline-flex;align-items:center;justify-content:center;font:inherit;
  font-size:var(--fs-body);font-weight:600;line-height:var(--lh-ctrl);cursor:pointer;text-decoration:none;
  padding:var(--sp-1) var(--sp-3);border:1px solid var(--ink);border-radius:var(--r-btn);
  background:var(--ink);color:var(--w);transition:.2s ease}
.vx .btn:hover{box-shadow:var(--sh-h);opacity:.9}
/* ②次要＝白底＋#111 1px 描邊＋#111 字（看更多、查看全文、電話鈕、頁中聯訂卡兩鈕、
   頁尾聯訂兩鈕〔0802 二輪更正④：頁尾改明亮式後由白實心鈕改為本語彙〕） */
.vx .newsBlock .more a,.vx .aboutUs .more a,.vx .contactForm .tel,.vx .contacts.alone button,
.vx .contactSet button{
  display:inline-flex;align-items:center;justify-content:center;font:inherit;
  font-size:var(--fs-body);font-weight:600;line-height:var(--lh-ctrl);cursor:pointer;text-decoration:none;
  padding:var(--sp-1) var(--sp-3);border:1px solid var(--ink);border-radius:var(--r-btn);
  background:var(--w);color:var(--ink);transition:.2s ease}
.vx .newsBlock .more a:hover,.vx .aboutUs .more a:hover,.vx .contactForm .tel:hover,
.vx .contacts.alone button:hover,.vx .contactSet button:hover{box-shadow:var(--sh-h)}

/* 標記類（HOT／85折）＝#111 實心白字 14／700、膠囊、卡片右上 */
.vx .newsBlock .labelHot,.vx .pdQueue .discountLabel{position:absolute;top:var(--sp-2);right:var(--sp-2);z-index:3;
  background:var(--ink);color:var(--w);font-size:var(--fs-body);font-weight:700;line-height:var(--lh-ctrl);
  border-radius:var(--r-btn);padding:var(--sp-1) var(--sp-2)}

/* ================================================================
   B. 頁首三段（蒸餾 §七.1 促銷帶／§七.2 sticky 頁首與搜尋）
   ================================================================ */
/* ── 工具列＝促銷帶語彙（蒸餾 §七.1 深帶白字，色值＝#1F1F1F；兩皮相同）；
      深底兩階：連結 rest 輔階 白.62、hover 主階 #FFF＝V1「hover 字色加深」的深底版 ── */
.vx .epHeader{background:var(--band-promo);color:var(--on-dark);font-size:var(--fs-body);line-height:var(--lh-body)}
.vx .epHeader .wrap{display:flex;align-items:center;justify-content:flex-end;min-height:48px}
.vx .epHeader ul{display:flex;align-items:center;gap:var(--sp-2);list-style:none;margin:0;padding:0;flex-wrap:wrap}
.vx .epHeader a{color:var(--on-dark-sub);text-decoration:none;display:inline-flex;align-items:center;transition:.2s ease}
.vx .epHeader a:hover{color:var(--on-dark)}
.vx .epHeader .icoS{width:16px;height:16px;margin-right:var(--sp-1);flex:none}
.vx .caret::after{content:"";width:16px;height:16px;margin-left:var(--sp-1);background:currentColor;flex:none;
  -webkit-mask:var(--ico-down) center/contain no-repeat;mask:var(--ico-down) center/contain no-repeat;transition:.2s ease}
.vx .drop:hover > a.caret::after{transform:rotate(180deg)}

/* ── Logo 主列＋搜尋（蒸餾 §七.2：白底；搜尋框 radius 6、1px #D4D4D4、focus #111、放大鏡 #111） ── */
.vx .topZone{background:var(--w)}
.vx .topZone .wrap{display:flex;align-items:center;gap:var(--sp-3);padding-top:var(--sp-2);padding-bottom:var(--sp-2)}
.vx .webHeader h1{margin:0}
.vx .webHeader h1 a{display:flex;align-items:center;gap:var(--sp-2);text-decoration:none;color:var(--ink-strong)}
.vx .webHeader .logoPh{width:56px;height:56px;border-radius:var(--r-img);flex:none;background:var(--w);overflow:hidden}
.vx .webHeader .logoPh img{width:100%;height:100%;object-fit:contain;display:block}
.vx .webHeader .firmName{font-size:var(--fs-h4);line-height:var(--lh-h4);font-weight:700}
.vx .webHeader .firmName small{display:block;font-size:var(--fs-body);line-height:var(--lh-body);
  font-weight:400;color:var(--muted)}
.vx .topZone .search{margin-left:auto;display:flex;align-items:center;position:relative;width:300px;max-width:40vw}
/* 膠囊搜尋框：左內距加大到 24（施工單一：避免文字貼邊）、右留 48 給放大鏡 */
.vx .topZone .search input[type=text]{width:100%;font:inherit;font-size:var(--fs-body);height:48px;
  border:1px solid var(--line-input);border-radius:var(--r-btn);background:var(--w);color:var(--body);
  padding:0 var(--sp-4) 0 var(--sp-3);outline:none;transition:.2s ease}
.vx .topZone .search input[type=text]:focus{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.vx .topZone .search input[type=text]::placeholder{color:var(--muted)}
/* 搜尋鈕只留放大鏡（鈕透明、點擊區不變＝沿用 V1 現制的 .searchIcon 機制） */
.vx .topZone .search input[type=button]{position:absolute;right:var(--sp-1);top:var(--sp-1);width:32px;height:32px;
  border:0;border-radius:var(--r-btn);background:transparent;cursor:pointer;font-size:0}
.vx .topZone .search .searchIcon{position:absolute;right:var(--sp-2);top:var(--sp-2);width:16px;height:16px;
  pointer-events:none;background:var(--ink);
  -webkit-mask:var(--ico-search) center/contain no-repeat;mask:var(--ico-search) center/contain no-repeat}

/* ── 主導覽＝sticky（蒸餾 §七.2 position:sticky）：白底、整列置中、14／600；
      字 rest #111／hover #000＝V1「hover 字色加深」；下緣 1px #E5E5E5 ── */
/* 0803 單版：切換器移除 → 主導覽回到 top:0 常駐 */
.vx nav.menu{position:sticky;top:0;z-index:100;background:var(--w);border-bottom:1px solid var(--line)}
.vx nav.menu .wrap{display:flex;align-items:center;justify-content:center;min-height:56px}
.vx nav.menu ul{display:flex;list-style:none;margin:0;padding:0}
.vx nav.menu a{text-decoration:none;color:var(--ink);font-size:var(--fs-body);font-weight:600;
  line-height:var(--lh-ctrl);padding:var(--sp-2) var(--sp-3);white-space:nowrap;display:inline-block;transition:.2s ease}
.vx nav.menu a:hover{color:var(--ink-strong)}
.vx nav.menu li.hasChild > a::after{content:"";display:inline-block;width:16px;height:16px;margin-left:var(--sp-1);
  background:currentColor;vertical-align:-3px;
  -webkit-mask:var(--ico-down) center/contain no-repeat;mask:var(--ico-down) center/contain no-repeat;transition:.2s ease}
.vx nav.menu li.hasChild:hover > a::after{transform:rotate(180deg)}

/* ── 下拉選單（蒸餾 §七.2 巨型下拉收斂：白底面板 radius 8＋標準陰影、無全框；
      項目 hover 底＝V1 #F4F5F7、選中 #000 700＋勾） ──
   z-index 110＞sticky 導覽 100：工具列下拉不被導覽帶蓋住 */
.vx .drop{position:relative}
.vx ul.dropMenu{position:absolute;top:calc(100% + 8px);left:0;z-index:110;min-width:184px;display:block;
  list-style:none;margin:0;padding:var(--sp-1);background:var(--w);border-radius:var(--r-card);
  box-shadow:var(--sh);opacity:0;visibility:hidden;transform:translateY(6px);transition:.2s ease}
.vx ul.dropMenu::before{content:"";position:absolute;left:0;right:0;top:-14px;height:14px}
.vx .drop:hover > .dropMenu,.vx .drop:focus-within > .dropMenu{opacity:1;visibility:visible;transform:translateY(0)}
.vx .dropMenu li{display:block}
.vx nav.menu .dropMenu a,.vx .epHeader .dropMenu a{display:flex;align-items:center;justify-content:space-between;
  gap:var(--sp-2);padding:var(--sp-1) var(--sp-2);border-radius:var(--r-btn);
  font-size:var(--fs-body);font-weight:400;line-height:var(--lh-body);color:var(--body);
  white-space:nowrap;text-decoration:none;transition:.2s ease}
.vx nav.menu .dropMenu a:hover,.vx .epHeader .dropMenu a:hover{background:var(--surface);color:var(--ink-strong)}
.vx .dropMenu .on a{color:var(--ink-strong);font-weight:700}
.vx .dropMenu .ck{width:16px;height:16px;flex:none;background:currentColor;
  -webkit-mask:var(--ico-check) center/contain no-repeat;mask:var(--ico-check) center/contain no-repeat}
.vx .epHeader ul.dropMenu{left:auto;right:0}
/* 0803 更正輪：一般下拉＝直式清單（現有規格 subMenu 縱向）——
   specificity 補正：.vx nav.menu ul 的 display:flex（0,2,2）原本壓過 .vx ul.dropMenu（0,2,1），
   導覽下拉被攤成橫式；以下兩條把主導覽內的下拉清單全部立回縱向 */
.vx nav.menu ul.dropMenu{display:block}
.vx nav.menu .megaMenu ul{display:block}

/* ── 產品 megamenu（0803 靖慈裁示：下拉重設計、結構照現行測試機 #prodMegamenu＝
      「檢視全部」列＋分類清單（可帶子分類）；皮＝demo 面板語彙（radius 20＋標準陰影）──
   分類名＝廠商自訂內容（假字）；「檢視全部」「其他」「私人展銷室」「All」＝系統字串照抄 */
.vx nav.menu .megaMenu{position:absolute;top:calc(100% + 8px);left:50%;z-index:110;
  width:min(760px,92vw);padding:var(--sp-3);background:var(--w);border-radius:var(--r-card);
  box-shadow:var(--sh);text-align:left;
  opacity:0;visibility:hidden;transform:translate(-50%,6px);transition:.2s ease}
.vx nav.menu .megaMenu::before{content:"";position:absolute;left:0;right:0;top:-14px;height:14px}
.vx nav.menu .drop:hover > .megaMenu,.vx nav.menu .drop:focus-within > .megaMenu{
  opacity:1;visibility:visible;transform:translate(-50%,0)}
.vx nav.menu .megaMenu .viewAll{border-bottom:1px solid var(--line);
  padding-bottom:var(--sp-2);margin-bottom:var(--sp-2)}
.vx nav.menu .megaMenu ul{list-style:none;margin:0;padding:0}
.vx nav.menu .megaMenu .pdCate{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--sp-2);align-items:start}
.vx nav.menu .megaMenu .pdCate ul{margin-top:var(--sp-1)}
.vx nav.menu .megaMenu a{display:block;padding:var(--sp-1) var(--sp-2);border-radius:var(--r-btn);
  font-size:var(--fs-body);font-weight:400;line-height:var(--lh-body);color:var(--body);
  white-space:nowrap;text-decoration:none;transition:.2s ease}
.vx nav.menu .megaMenu a:hover{background:var(--surface);color:var(--ink-strong)}
.vx nav.menu .megaMenu .viewAll a,.vx nav.menu .megaMenu .cateT{font-weight:700;color:var(--ink-strong)}

/* ================================================================
   C. 大圖輪播（蒸餾 §七.3 Hero：H1 38 置中；漸層③ 大圖遮罩＝V1 rgba(0,0,0,.62)）
   ================================================================ */
.vx .bigBanner .showArea{position:relative}
.vx .bigBanner .slideList{list-style:none;padding:0;margin:0}
.vx .bigBanner .slideList li{display:none;position:relative}
.vx .bigBanner .slideList li:first-child{display:block}
.vx .bigBanner .ph{aspect-ratio:1540/503;border-radius:var(--r-img);box-shadow:var(--sh)}
.vx .bigBanner .fadeoutMask{position:absolute;inset:0;z-index:1;border-radius:var(--r-img);
  background:linear-gradient(to top,rgba(0,0,0,.62),transparent)}
.vx .bigBanner .textCnt{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:0 var(--sp-4)}
.vx .bigBanner .textCnt h4{font-size:var(--fs-h1);line-height:var(--lh-h1);font-weight:700;
  color:var(--on-dark);margin:0 0 var(--sp-2)}
/* 副標＝圖上文字，照 V1 原檔取主階白（不降 .62：疊在照片上需要強度） */
.vx .bigBanner .textCnt p{font-size:var(--fs-h4);line-height:var(--lh-h4);color:var(--on-dark);margin:0}
/* 箭頭在圖內兩緣（現況紅線）；圓點容器＝藥丸 9999 置圖下緣內側 24（浮於照片需容器補償） */
.vx .bigBanner .arrowLeft{left:var(--sp-2)} .vx .bigBanner .arrowRight{right:var(--sp-2)}
.vx .bigBanner .indicator{position:relative;z-index:3;margin-top:-48px;margin-bottom:var(--sp-3)}
.vx .bigBanner .indicator ul{background:var(--scrim);border-radius:var(--r-pill);padding:var(--sp-1) var(--sp-2)}
.vx .bigBanner .indicator li{background:var(--dot-dark-off)}
.vx .bigBanner .indicator li.now{background:var(--on-dark)}

/* ================================================================
   D. 公司新聞（蒸餾 §七.12 新聞輪播白卡；§五 卡片 8＋標準陰影、不畫全框）
   ================================================================ */
.vx .newsBlock{background:var(--w)}
.vx .newsBlock .slideArea{position:relative}
.vx .newsBlock .list{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-3)}
/* 白卡：陰影承載、無邊框（§五 陰影表＋§十.7 卡片語彙統一）；hover 浮起 2px＋陰影加深 */
.vx .newsBlock .list > li{position:relative;background:var(--w);border-radius:var(--r-card);
  box-shadow:var(--sh);transition:.3s ease}
.vx .newsBlock .list > li:hover{transform:translateY(-2px);box-shadow:var(--sh-h)}
.vx .newsBlock .list > li > a{display:block;text-decoration:none;color:inherit}
.vx .newsBlock .newsImg{display:block;position:relative}
.vx .newsBlock .newsImg .ph{aspect-ratio:490/325;border-radius:var(--r-card) var(--r-card) 0 0}/* 圖上緣隨卡 20＝同心，避免楔形 */
.vx .newsBlock h4{font-size:var(--fs-h4);line-height:var(--lh-h4);font-weight:700;color:var(--ink-strong);
  margin:var(--sp-3) var(--sp-3) var(--sp-1)}
.vx .newsBlock p{font-size:var(--fs-body);line-height:var(--lh-body);color:var(--muted);
  margin:0 var(--sp-3) var(--sp-3)}
.vx .newsBlock .more{text-align:center;margin-top:var(--sp-3)}

/* ================================================================
   E. 橫幅廣告（§五 圖片圓角 8＋標準陰影；區塊內禁放文字節點＝標示畫在圖上）
   ================================================================ */
.vx .adv{padding:var(--sp-4) 0}
.vx .adv a{display:block}
.vx .adv .ph{aspect-ratio:1540/300;border-radius:var(--r-img);box-shadow:var(--sh)}

/* ================================================================
   F. 關於我們（0803 靖慈點2＋更正輪：骨架照 3現有前台tw 現行 aboutUs＝
      左 aboutUsVideo 影音輪播〔影片＋圖片、廠商後台上傳〕＋右 article〔h2＋內文＋查看全文〕；
      公司名稱行依 0803 晚靖慈確認移除、假字標明內容自公司介紹帶入；版面＝設計稿左媒體右文；
      媒體卡沿用影片卡語彙〔播放鍵浮層＋平台標籤〕，平台標籤照設計稿置左下）
   ================================================================ */
.vx .aboutUs .wrap{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);
  gap:var(--sp-4);align-items:center}
.vx .aboutUs .aboutUsVideo{position:relative}
.vx .aboutUs .aboutUsVideo .list{list-style:none;margin:0;padding:0}
.vx .aboutUs .aboutUsVideo .list > li{display:none}
.vx .aboutUs .aboutUsVideo .list > li.now{display:block}
.vx .aboutUs .videoBox{position:relative}
.vx .aboutUs .videoBox .ph{aspect-ratio:16/9;border-radius:var(--r-img);box-shadow:var(--sh)}
.vx .aboutUs .playBtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
  width:76px;height:52px;border-radius:var(--r-btn);background:var(--scrim);
  display:flex;align-items:center;justify-content:center;pointer-events:none}
.vx .aboutUs .playBtn::after{content:"";border-left:16px solid #FFF;
  border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:3px}
.vx .aboutUs .platformTag{position:absolute;left:var(--sp-2);bottom:var(--sp-2);z-index:2;
  background:var(--scrim);color:var(--on-dark);font-size:var(--fs-body);line-height:var(--lh-ctrl);
  border-radius:var(--r-btn);padding:var(--sp-1) var(--sp-2)}
.vx .aboutUs .aboutUsVideo .arrowLeft{left:var(--sp-2)}
.vx .aboutUs .aboutUsVideo .arrowRight{right:var(--sp-2)}
.vx .aboutUs .aboutUsVideo .indicator{margin-top:var(--sp-2)}
.vx .aboutUs article{text-align:left}
.vx .aboutUs article h2{text-align:left}
.vx .aboutUs article > div:not(.more){font-size:var(--fs-body);line-height:var(--lh-body);color:var(--body)}
.vx .aboutUs .more{margin-top:var(--sp-3)}

/* ================================================================
   G. 頁中聯繫與訂閱＝白卡兩張（0727 裁示：白卡＋陰影；樣式自 index-0728四版.html
      V1白 照抄，圓角改用本版變數：卡 --r-card 20／鈕 --r-btn 999）
      0802 更正①：決議8＝後台系統行為（版型設定送出不預設自帶聯訂元件），
      不代表 demo 移除此元件 → 本段放回，位置＝關於我們之後、產品展示之前（多媒體輪播 0803 移除）
   ================================================================ */
.vx .contacts.alone .wrap{display:grid;grid-template-columns:repeat(2,minmax(0,420px));
  gap:var(--sp-3);justify-content:center}
.vx .contacts.alone .contactUs,.vx .contacts.alone .emailUpdate{
  background:var(--w);
  border-radius:var(--r-card);padding:var(--sp-3);box-shadow:var(--sh);text-align:left}
/* 卡上文字＝亮區階：em 標題 #000 700／說明 #333 */
.vx .contacts.alone p{margin:0 0 var(--sp-3);font-size:var(--fs-body);line-height:var(--lh-body);color:var(--body)}
.vx .contacts.alone em{display:block;font-style:normal;font-size:var(--fs-h3);line-height:var(--lh-h3);
  font-weight:700;color:var(--ink-strong);margin-bottom:var(--sp-1)}

/* （原 H. 多媒體輪播 iStage：0803 靖慈裁示整段移除；影音展示改由關於我們 aboutUsVideo 承擔） */

/* ================================================================
   H2. 圖文模板（0803 靖慈定調：圖文模板＝後台 HTML 編輯區，YT Short 原生呈現什麼樣
      就什麼樣＝youtube.com/embed 原生 iframe 直嵌、不加圓角陰影等任何修飾（PM 實測樣式）；
      本段 CSS 只做三支並排置中的排版；標註單行「圖文模板 YT short 示意」）
   ================================================================ */
.vx .shortsBlock .shortsList{list-style:none;margin:0;padding:0;display:grid;
  grid-template-columns:repeat(3,minmax(0,260px));gap:var(--sp-3);justify-content:center}
.vx .shortsBlock iframe{display:block;width:100%;aspect-ratio:9/16;border:0}
/* 標題組＝與 CTA 兩式同構（eyebrow 置中）；規則掛在 J 段一併定義 */

/* ================================================================
   I. 產品展示（0803 施工單二.5＝決議5「拿掉 tab、其餘前端不變」）
      tab 藥丸切換器退場 → 單一 h2 標題「產品展示」；
      0802 更正③：分類樹不入 demo（樹狀圖樣式由設計師直接設計＝設計稿範疇）
      → 卡列維持滿寬一列 4 欄，呈現照 index-0728四版.html 的 panel；
      overlay＝漸層③ 產品遮罩 V1 值 .78；卡片＝圖片圓角 14＋標準陰影
   ================================================================ */
.vx .pdQueue{background:var(--w)}
.vx .pdQueue .slideArea{position:relative}
/* 0803 晚更正（靖慈二次反饋「只有產品有調寬」）：產品區 1660 特例容器移除＝
   與全站同版心（現行站產品區與其他區同版心）；4 欄照現有規格 */
.vx .pdQueue .list{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-3)}
.vx .pdQueue .list > li{position:relative;transition:.3s ease}
.vx .pdQueue .list > li > a{display:block;text-decoration:none;color:inherit;position:relative}
.vx .pdQueue .pdImg{position:relative;display:block;border-radius:var(--r-img);overflow:hidden;
  box-shadow:var(--sh);transition:.3s ease}
.vx .pdQueue .list > li:hover{transform:translateY(-2px)}
.vx .pdQueue .list > li:hover .pdImg{box-shadow:var(--sh-h)}
.vx .pdQueue .pdImg .ph{aspect-ratio:1/1;border-radius:0}
.vx .pdQueue .hiddenInfo{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:var(--sp-2);
  background:linear-gradient(to top,rgba(0,0,0,.78),transparent);color:var(--on-dark)}
.vx .pdQueue .hiddenInfo p{margin:0 0 var(--sp-1);font-size:var(--fs-h4);line-height:var(--lh-h4);font-weight:700}
.vx .pdQueue .priceSet{display:flex;flex-wrap:wrap;gap:var(--sp-1);align-items:baseline;
  font-size:var(--fs-body);line-height:var(--lh-body)}
/* 折扣卡：原價刪除線在上（深底輔階 白.62）、折後價在下（白）＝V1 深底兩階 */
.vx .pdQueue .oldPrice{text-decoration:line-through;width:100%;order:-1;color:var(--on-dark-sub)}

/* ================================================================
   J. CTA 一（蒸餾 §七.9 CTA 帶：置中 H2＋副標＋單一按鈕；黑皮 #222／白皮照片帶）
      0802 二輪更正②：圖文模板段（shortsBlock）共用本組標題語彙＝三者同構
   ================================================================ */
.vx .ctaBlock .eyebrow,.vx .shortsBlock .eyebrow,.vx .statBlock .eyebrow{font-size:var(--fs-body);line-height:var(--lh-body);font-weight:600;
  letter-spacing:.08em;color:var(--muted);margin:0 0 var(--sp-2)}
.vx .ctaBlock h2,.vx .shortsBlock h2{margin:0 0 var(--sp-2)}
.vx .ctaBlock .lead,.vx .shortsBlock .lead{color:var(--body);margin:0 0 var(--sp-3)}
.vx .ctaA .inner,.vx .shortsBlock .inner{text-align:center}
.vx .shortsBlock .eyebrow{margin-bottom:var(--sp-3)}/* 單行標示＝本段唯一文字（0802 三輪） */
.vx .statBlock .eyebrow{text-align:center;margin-bottom:var(--sp-3)}/* 數據統計＝新範本標示（0802 四輪） */
.vx .ctaA .lead,.vx .shortsBlock .lead{font-size:var(--fs-h4);line-height:var(--lh-h4);max-width:640px;margin-left:auto;margin-right:auto}

/* ================================================================
   K. CTA 二＝滿版主視覺帶（0803 施工單二.6＝決議6b，參照 1需求訪談圖7 PackMojo）
      淺灰大卡退場：改 full-bleed 漸層帶（#F5F5F5→#FFF，黑白紀律不帶色）、
      無卡框無左右留白框；左文（eyebrow→38 大標→20 說明→黑膠囊鈕）右圖 45%；
      標題改 #000 平色（原漸層①標題字隨大卡一併退場）
   ================================================================ */
.vx .ctaB{background:linear-gradient(90deg,#F5F5F5,#FFF);padding:var(--sp-4) 0}
.vx .ctaB .inner{display:grid;grid-template-columns:minmax(0,1fr) 45%;gap:var(--sp-4);align-items:center}
.vx .ctaB .ctaText{text-align:left}
/* eyebrow＝大寫小標 14／#777／字距 2px（施工單指定值） */
.vx .ctaB .eyebrow{letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
/* 大標＝字級第一層 38／1.21（＝施工單「40px 上下、行高緊」在五層字級內的落點） */
.vx .ctaB h2{font-size:var(--fs-h1);line-height:var(--lh-h1);text-align:left;color:var(--ink-strong);
  margin:0 0 var(--sp-2)}
.vx .ctaB .lead{font-size:var(--fs-h4);line-height:var(--lh-h4);color:var(--body);max-width:520px}
.vx .ctaB .ctaImg .ph{aspect-ratio:4/3;border-radius:var(--r-img);box-shadow:var(--sh)}

/* ================================================================
   L. 數據統計（蒸餾 §七.4 數據帶：四組「大數字 H2 700＋標籤 14」；黑皮 #1F1F1F／白皮 #F5F5F5）
   ================================================================ */
.vx .statBlock .stats{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,1fr);
  gap:var(--sp-3);text-align:center}
.vx .statBlock .num{font-size:var(--fs-h2);line-height:var(--lh-h2);font-weight:700;color:var(--ink-strong)}
.vx .statBlock .lab{font-size:var(--fs-body);line-height:var(--lh-body);color:var(--muted);margin-top:var(--sp-1)}

/* ================================================================
   M. 聯絡我們（蒸餾 §七.13 lead_capture：左側 H2＋說明＋電話／右側白色圓角表單卡）
      兩皮都是左右兩欄 0.85fr/1.15fr、欄距 48；黑皮 #111 底／白皮 #FFF 底
   ================================================================ */
.vx .contactForm .wrap{display:grid;grid-template-columns:.85fr 1.15fr;gap:var(--sp-4);align-items:start}
.vx .contactForm .cfInfo{text-align:left}
.vx .contactForm .cfInfo h2{text-align:left;margin:0 0 var(--sp-2)}
.vx .contactForm .cfInfo p{font-size:var(--fs-body);line-height:var(--lh-body);color:var(--body);margin:0 0 var(--sp-3)}
.vx .contactForm .tel{font-size:var(--fs-h4);line-height:var(--lh-h4);font-weight:700;gap:var(--sp-1);
  margin-bottom:var(--sp-1)}
.vx .contactForm .tel svg{width:20px;height:20px;flex:none}
.vx .contactForm .cfInfo p.telNote{font-size:var(--fs-body);line-height:var(--lh-body);color:var(--muted);margin:0}
/* 表單卡＝白卡 radius 8＋內距 24＋標準陰影（兩皮相同；卡內一律亮區三階） */
.vx .contactForm form{display:flex;flex-direction:column;gap:var(--sp-3);
  background:var(--w);border-radius:var(--r-card);padding:var(--sp-3);box-shadow:var(--sh)}
.vx .contactForm .formSec{display:flex;flex-direction:column;gap:var(--sp-2);
  border-top:1px solid var(--line);padding-top:var(--sp-3)}
.vx .contactForm .formSec:first-child{border-top:0;padding-top:0}
/* 組標題＝可點收合列（0803 施工單二.7＝決議7）：右側 chevron 旋轉指示，展開為朝上 */
.vx .contactForm .secTitle{font-size:var(--fs-h4);line-height:var(--lh-h4);font-weight:700;color:var(--ink-strong);
  margin:0;display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);
  cursor:pointer;user-select:none}
.vx .contactForm .secTitle::after{content:"";width:16px;height:16px;flex:none;background:currentColor;
  -webkit-mask:var(--ico-down) center/contain no-repeat;mask:var(--ico-down) center/contain no-repeat;
  transform:rotate(180deg);transition:.2s ease}
.vx .contactForm .formSec.is-closed .secTitle::after{transform:rotate(0)}
.vx .contactForm .formSec.is-closed > *:not(.secTitle){display:none}
.vx .contactForm .row2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2)}
.vx .contactForm .field{display:flex;flex-direction:column;gap:var(--sp-1)}
.vx .contactForm label{font-size:var(--fs-body);line-height:var(--lh-ctrl);font-weight:600;color:var(--body);text-align:left}
.vx .contactForm label .req{color:var(--ink-strong);font-weight:700}
/* 輸入類＝唯一保留描邊的元件（§五 陰影表註）：膠囊、1px #D4D4D4、focus #111、placeholder #777；
   膠囊化後左右內距加大到 24（施工單一：避免文字貼邊）；textarea 屬卡片類＝圓角 20 */
.vx .contactForm input,.vx .contactForm select,.vx .contactForm textarea{font:inherit;font-size:var(--fs-body);
  color:var(--body);background:var(--w);border:1px solid var(--line-input);border-radius:var(--r-btn);
  height:48px;padding:0 var(--sp-3);outline:none;transition:.2s ease;width:100%}
.vx .contactForm ::placeholder{color:var(--muted)}
.vx .contactForm textarea{height:auto;min-height:104px;padding:var(--sp-2) var(--sp-3);border-radius:var(--r-card)}
.vx .contactForm input:focus,.vx .contactForm select:focus,.vx .contactForm textarea:focus{
  border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.vx .contactForm .telRow{display:grid;grid-template-columns:auto 1fr;gap:var(--sp-1)}
.vx .contactForm .qtyRow{display:grid;grid-template-columns:1fr auto;gap:var(--sp-1)}
.vx .contactForm .telRow3{display:grid;grid-template-columns:auto 1fr 88px;gap:var(--sp-1)}
.vx .contactForm .chipRow,.vx .contactForm .radioRow{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center;
  font-size:var(--fs-body);line-height:var(--lh-ctrl);color:var(--body)}
.vx .contactForm .chipRow label,.vx .contactForm .radioRow label{display:inline-flex;gap:var(--sp-1);
  align-items:center;cursor:pointer;font-weight:400}
.vx .contactForm input[type=radio],.vx .contactForm input[type=checkbox]{accent-color:#111;
  width:16px;height:16px;margin:0;flex:none}
.vx .contactForm .hint{font-size:var(--fs-body);line-height:var(--lh-body);color:var(--muted);margin:0}
.vx .contactForm .msgBox{border:1px solid var(--line-input);border-radius:var(--r-card);background:var(--w);transition:.2s ease}
.vx .contactForm .msgBox textarea{border:0;min-height:96px}
.vx .contactForm .msgBox textarea:focus{border:0;box-shadow:none}
.vx .contactForm .msgBox:focus-within{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.vx .contactForm .msgBox .chipRow{padding:0 var(--sp-2) var(--sp-2)}
/* 附件＝#D4D4D4 虛線框（輸入類邊線階） */
.vx .contactForm .upBox{display:flex;gap:var(--sp-2);align-items:center}
.vx .contactForm .upPlus{width:88px;height:88px;flex:none;border:1px dashed var(--line-input);border-radius:var(--r-card);
  display:flex;align-items:center;justify-content:center;font-size:var(--fs-h3);color:var(--muted)}
.vx .contactForm .nameRow{display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap}
.vx .contactForm .nameRow > input{flex:1;min-width:220px}
.vx .contactForm .recommend{display:flex;gap:var(--sp-1);align-items:flex-start;font-weight:400;
  font-size:var(--fs-body);line-height:var(--lh-body);color:var(--body);cursor:pointer}
/* 送出＝#111 實心、min-width 200、置中（沿用 V1 現行表單置中鈕邏輯） */
.vx .contactForm .submit{border:1px solid var(--ink);min-width:200px;align-self:center}
/* 必填提示＝黑色 12px（施工單二.7 指定值；黑白紀律不用紅） */
.vx .contactForm .errMsg{font-size:12px;line-height:1.5;font-weight:600;color:var(--ink-strong);margin:0}
.vx .contactForm .is-invalid{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}

/* ── 表單雙版本＝全頁 V1／V2 分頁（0803 施工單二.8＝LINE 點4／R44；
      0802 更正④：切換移到頂部 .skinSwitch，元件內不再放雙鈕） ──
   V2 容器（#v2）帶 .ver-b：①左欄電話膠囊鈕、telNote 小字與說明句皆不出現
   （0802 二輪更正③）②表單商務電話三段＋手機號碼欄不出現
   ③兩欄退單欄、卡片拉寬 900 置中 ④h2「聯繫我們」回歸區塊標題置中語彙 */
.vx .contactForm .formCol{display:flex;flex-direction:column;gap:var(--sp-2);min-width:0}
.vx.ver-b .contactForm .tel,
.vx.ver-b .contactForm .cfInfo p,
.vx.ver-b .contactForm .cfInfo p.telNote{display:none}
.vx.ver-b .contactForm .cfInfo h2{text-align:center}
.vx.ver-b .contactForm .telRowPair{display:none}
.vx.ver-b .contactForm .wrap{grid-template-columns:minmax(0,1fr)}
.vx.ver-b .contactForm .cfInfo,.vx.ver-b .contactForm .formCol{max-width:900px;width:100%;margin:0 auto}

/* ================================================================
   N. 頁尾＝明亮式統一帶（0802 三輪：版權列納入統一設計）
      呈現元件一個不增減；整個 .siteFooter 同一段淺灰帶 #F5F5F5，內分三列：
      列一 聯訂兩組＋QR ／ 列二 社群＋認證徽章 ／ 列三 版權列，列間 1px #E5E5E5
   ================================================================ */
.vx .siteFooter{background:var(--band-light)}
.vx .contactSet{color:var(--body)}
.vx .contactSet > .wrap{padding-top:var(--sp-4);padding-bottom:0}
/* 0803 施工單二.10（決議9，參照 1需求訪談圖3）：聯訂兩組改「兩行排」＝
   標題一行（em）／說明一行／按鈕，文字逐字照現有前台（問號改全形＝0802 二輪更正④） */
.vx .contactSet .contactUs,.vx .contactSet .emailUpdate{text-align:left;max-width:280px}
.vx .contactSet .contactUs p,.vx .contactSet .emailUpdate p{display:block;margin:0 0 var(--sp-2);
  font-size:var(--fs-body);line-height:var(--lh-body);color:var(--body)}
.vx .contactSet em{display:block;font-style:normal;font-size:var(--fs-h4);line-height:var(--lh-h4);
  font-weight:700;color:var(--ink-strong)}
/* 列一（行動層）：聯訂兩組（兩行排）grid 並列、QR 靠右 */
.vx .contactSet .others{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;
  gap:var(--sp-4);align-items:start;padding:0 0 var(--sp-3)}
/* 列二（識別＋信任層）：認證徽章靠左、社群 36px 藥丸靠右（0802 四輪對調），一線之隔同列並置 */
.vx .contactSet .ftBar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;
  gap:var(--sp-2) var(--sp-3);border-top:1px solid var(--line);padding:var(--sp-2) 0}
.vx .contactSet .social{display:flex;flex-wrap:wrap;gap:var(--sp-1);list-style:none;margin:0;padding:0;
  align-items:center;order:2}
.vx .contactSet .social li a{width:36px;height:36px;border-radius:var(--r-pill);background:var(--w);color:var(--ink);
  display:flex;align-items:center;justify-content:center;text-decoration:none;transition:.2s ease}
.vx .contactSet .social li a:hover{box-shadow:var(--sh-h)}
.vx .contactSet .social li a svg{width:18px;height:18px;display:block}
.vx .contactSet .qrcode{width:88px;height:88px;flex:none;justify-self:end;background:var(--w);border:1px solid var(--line);
  border-radius:var(--r-img)}
.vx .contactSet .qrcode img{width:100%;height:100%;object-fit:contain;display:block;border-radius:inherit}
/* 認證徽章＝藥丸 9999＋白底 1px #E5E5E5 邊（徽章文字隱藏、只留圖章），列二左側（0802 四輪對調） */
.vx .contactSet .certList{display:flex;flex-wrap:wrap;justify-content:flex-start;gap:var(--sp-1);align-items:center;order:1}
.vx .contactSet .cert{height:40px;border-radius:var(--r-pill);background:var(--w);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;padding:0 var(--sp-2);font-size:0}
.vx .contactSet .cert img{height:26px;width:auto;display:block}
/* 列三（法遵層）＝版權列：納入同一淺灰帶、僅以 1px #E5E5E5 與列二分隔；TT logo 彩色原樣 */
.vx .webFooter{background:transparent;border-top:1px solid var(--line);padding:var(--sp-2) 0}
.vx .webFooter p{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center;justify-content:center;
  margin:0;font-size:var(--fs-body);line-height:var(--lh-body);color:var(--body)}
.vx .webFooter a{color:var(--body);text-decoration:none;display:inline-flex;
  align-items:center;gap:var(--sp-1);transition:.2s ease}
.vx .webFooter a:hover{color:var(--ink-strong)}
.vx .webFooter .ttLogo{width:66px;height:18px;border-radius:var(--r-img);display:inline-block}
.vx .webFooter .ttLogo img{width:100%;height:100%;object-fit:contain;display:block}
/* 頁尾社群鈕＝真實品牌標誌（素材層例外色，值自原檔照抄） */
.vx .contactSet .social li.fb a{background:#1877F2;color:#fff}
.vx .contactSet .social li.youtube a{background:#F00;color:#fff}
.vx .contactSet .social li.in a{background:#0A66C2;color:#fff}
.vx .contactSet .social li.twitter a{background:#fff;color:#0F1419}
.vx .contactSet .social li.instagram a{background:radial-gradient(circle at 30% 110%,#FDF497 0%,#FD5949 45%,#D6249F 60%,#285AEB 90%);color:#fff}

/* ================================================================
   N2. 小鯨魚線上客服浮動鈕（0803 靖慈點4；樣式照現行測試機 #sui-webchat-btn：
      fixed 右下 16px、100×100 圓形、陰影 1px 2px 8px #000、z-index 9999；
      橘底 #EC8D00＋鯨魚圖＝素材層例外色，照現行元件原樣、不入黑白色彩系統）
   ================================================================ */
.vx .webchatBtn{position:fixed;right:16px;bottom:16px;width:100px;height:100px;z-index:9999;
  display:block;border:0;padding:0;cursor:pointer;border-radius:50%;font-size:0;
  background:#EC8D00 url(img/webchat-whale.png) center/cover no-repeat;
  box-shadow:1px 2px 8px 0 #000}

/* ================================================================
   O. 節奏帶（原 V1白皮 .vx2，0803 併入共用層＝單版基調）
      四個節奏帶＝#F5F5F5 淺灰帶／CTA一 照片帶；文字全部沿用亮區三階，
      故本層只需換底色，無須任何文字覆寫（＝白底黑字基調的證明）
      （原 .vx1 黑皮節奏＝深帶四座，隨單版收斂移除）
   ================================================================ */
.vx .aboutUs{background:var(--band-light)}
/* CTA一＝照片帶（img/cta-1-bg.jpg＋白 .72 遮罩，值照原檔）＋亮區三階字、#111 實心鈕 */
.vx .ctaA{background:linear-gradient(rgba(255,255,255,.72),rgba(255,255,255,.72)),
  url(img/cta-1-bg.jpg) center/cover no-repeat}
.vx .statBlock{background:var(--band-light)}
.vx .contactForm{background:var(--w)}

/* ================================================================
   Q. RWD（桌機 1440 為準；≤1024 基本降級：多欄退兩欄／單欄、表單退單欄）
      字級只在允許的五層之間降階（38→30），不引入階外值
   ================================================================ */
@media(max-width:1024px){
  .vx .contactForm .wrap{grid-template-columns:1fr;gap:var(--sp-3)}
  .vx .aboutUs .wrap{grid-template-columns:1fr;gap:var(--sp-3)}
  .vx .ctaB .inner{grid-template-columns:1fr;gap:var(--sp-3)}
  .vx .pdQueue .list,.vx .newsBlock .list{grid-template-columns:repeat(2,1fr)}
  .vx .statBlock .stats{grid-template-columns:repeat(2,1fr)}
  .vx .bigBanner .textCnt h4{font-size:var(--fs-h2);line-height:var(--lh-h2)}
  .vx .bigBanner .textCnt p{font-size:var(--fs-body);line-height:var(--lh-body)}
  .vx .bigBanner .textCnt{padding:0 var(--sp-3)}
  .vx nav.menu .wrap{overflow-x:auto}
  .vx nav.menu a{padding:var(--sp-2)}
}
@media(max-width:720px){
  .vx .pdQueue .list,.vx .newsBlock .list{grid-template-columns:1fr}
  .vx .statBlock .stats{grid-template-columns:1fr}
  .vx .contacts.alone .wrap{grid-template-columns:1fr}
  .vx .contactForm .row2{grid-template-columns:1fr}
  .vx .topZone .wrap{flex-wrap:wrap}
  .vx .topZone .search{width:100%;max-width:none;margin-left:0}
  .vx .shortsBlock .shortsList{grid-template-columns:minmax(0,260px);gap:var(--sp-2)}
  .vx .webchatBtn{width:72px;height:72px}
  .vx .ctaB .inner{gap:var(--sp-3)}
  .vx .contactSet .others{grid-template-columns:1fr;gap:var(--sp-3)}
  .vx .contactSet .qrcode{justify-self:start}
  .vx .contactSet .ftBar{justify-content:center}
  .vx .contactSet .certList{justify-content:center}
}
</style>
</head>
<body>

<!-- 頂部分頁（0803 更正輪定案標籤與順序）：Demo V1（預設）／Demo V2（聯繫我們置中版＝
     無電話表單，#v2 直達）／現有設計稿參考（非最終成品）＝設計師整張設計稿（#draft 直達） -->
<nav class="skinSwitch" role="tablist" aria-label="版本切換">
  <button role="tab" aria-selected="true"  data-skin="v1">Demo V1</button>
  <button role="tab" aria-selected="false" data-skin="v2">Demo V2（聯繫我們置中版）</button>
  <button role="tab" aria-selected="false" data-skin="draft">現有設計稿參考（非最終成品）</button>
</nav>

<div class="v draftPage" id="draft" hidden>
  <img src="img/design-draft.jpg" alt="現有設計稿參考（非最終成品，整頁）">
</div>

/* 兩個分頁容器（#v1／#v2）掛同一份 markup；V2 的差異全由容器 .ver-b class 以 CSS 決定；
   「現有設計稿參考」分頁（#draft）＝靜態整張設計稿圖，不掛 markup */
document.querySelectorAll('.v.vx').forEach(el => el.innerHTML = markup());

/* 電話：桌機（可 hover 的精準指標）＝點按複製號碼＋回饋；行動裝置＝tel: 直撥 */
document.querySelectorAll('.contactForm .tel').forEach(t=>{
  t.addEventListener('click', e=>{
    if (matchMedia('(hover: hover) and (pointer: fine)').matches){
      e.preventDefault();
      const done = () => {
        const note = t.parentElement.querySelector('.telNote');
        if (note && !note.dataset.orig){ note.dataset.orig = note.textContent; }
        if (note){ note.textContent = '已複製號碼 ' + TEL_NUM;
          setTimeout(()=>{ note.textContent = note.dataset.orig; }, 2000); }
      };
      if (navigator.clipboard) navigator.clipboard.writeText(TEL_NUM).then(done).catch(done);
      else done();
    }
  });
});

/* 表單分組收合（施工單二.7＝決議7）：點組標題切換，chevron 由 CSS 旋轉指示；
   預設＝填寫表單展開／聯絡人資訊收合（收合狀態寫在 markup 的 .is-closed） */
const setSec = (secEl, open) => {
  secEl.classList.toggle('is-closed', !open);
  const t = secEl.querySelector('.secTitle');
  if (t) t.setAttribute('aria-expanded', String(open));
};
document.querySelectorAll('.contactForm .formSec').forEach(secEl=>{
  const t = secEl.querySelector('.secTitle');
  if (!t) return;
  const toggle = ()=> setSec(secEl, secEl.classList.contains('is-closed'));
  t.addEventListener('click', toggle);
  t.addEventListener('keydown', e=>{
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); }
  });
});

/* 送出驗證（施工單二.7）：未填 → 自動展開該組、focus 第一個未填欄、欄下方黑色 12px「必填」
   兩個分頁各有一份表單，逐一綁定（各自只檢查自己容器內的欄位） */
document.querySelectorAll('.contactForm form').forEach(cfForm=>{
  cfForm.addEventListener('submit', e=>{
  e.preventDefault();
  cfForm.querySelectorAll('.errMsg').forEach(n => n.remove());
  cfForm.querySelectorAll('.is-invalid').forEach(n => n.classList.remove('is-invalid'));
  let first = null;
  const openSecs = [];
  cfForm.querySelectorAll('[required]').forEach(el=>{
    /* V2 隱藏的欄位不列入檢查（收合組內的欄位仍要檢查） */
    if (!el.offsetParent && !el.closest('.is-closed')) return;
    if (el.value.trim() !== '') return;
    el.classList.add('is-invalid');
    const field = el.closest('.field') || el.parentElement;
    const msg = document.createElement('p');
    msg.className = 'errMsg';
    msg.textContent = '必填';
    field.appendChild(msg);
    if (!first) first = el;
    const sec = el.closest('.formSec');
    if (sec && openSecs.indexOf(sec) === -1) openSecs.push(sec);
  });
  if (!first){ alert('表單檢查通過（demo 不實際送出）'); return; }
  /* 含未填欄位的組一律自動展開，再 focus 第一個未填欄 */
  openSecs.forEach(sec => setSec(sec, true));
  first.focus({preventScroll:true});
  first.scrollIntoView({block:'center', behavior:'smooth'});
  });
});

/* 表單雙版本＝全頁分頁切換（施工單二.8＋0802 更正④，樣式與行為照 index-0728四版.html）：
   V1／V2 於相同捲動位置對調，方便逐區比對；← → 鍵可切換；#v2 可直達 */
const SKINS = [...document.querySelectorAll('.skinSwitch button')];
function show(id){
  const y = window.scrollY;
  SKINS.forEach(b=>{
    const on = b.dataset.skin === id;
    b.setAttribute('aria-selected', on);
    document.getElementById(b.dataset.skin).hidden = !on;
  });
  window.scrollTo(0, y);
}
SKINS.forEach(b => b.addEventListener('click', () => show(b.dataset.skin)));
document.addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const i = SKINS.findIndex(b => b.getAttribute('aria-selected') === 'true');
  show(SKINS[(i + (e.key === 'ArrowRight' ? 1 : SKINS.length - 1)) % SKINS.length].dataset.skin);
});
if (/^#(draft|v1|v2)$/.test(location.hash)) show(location.hash.slice(1));
</script>
</body>
</html>
