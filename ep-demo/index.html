   ── V2 柔性面板（元素自設計師參考右三欄精煉；圓角＝正圓系統） ──
   ・分段＝每區塊一塊圓角面板（nomal.jp／PRO STOCKS 圖證）；面板＝內容單元專用；
     頁首與版權列＝系統框架不面板；一個面板＝一個元件（面板邊界＝元件邊界）
   ・圓角＝正圓系統：容器 28／卡片 20／卡內圖與欄位 14／行動類與標籤膠囊 999／
     箭頭與圓徽章正圓——全站曲率一致偏圓
   ・深色單一 #111＝關於我們、影音、CTA一、數據（內縮容器）＋頁尾（滿版帶＝0725 裁示：
     對應頁首、系統框架首尾皆滿版，內容單元才用面板）；與 V1 共用同一張底色任務對照表；
     容器內主要動作反白實心、次要動作與箭頭白描邊
   ・輪播箭頭位置統一「騎在外框邊線上」（0725 二裁：中心壓面板／媒體邊緣；
     V1 維持現況兩種定位＝兩案並陳）；聯繫與訂閱兩卡 50/50 撐滿面板
   ・tab＝文字底線式（PRO STOCKS Latest 底線圖證）；主導覽 hover 同用底線＝語彙不孤立
   ・陰影＝風格：卡片柔影＋hover 浮起 6px（只給可點卡片）
   ・卡片標記：HOT 與折扣＝右上膠囊黑標同款（0724 十一輪統一；↗ 鈕已撤場、
     可點性＝整卡點擊＋hover 浮起；原「↗ 保留 vs 拿掉」訪談項撤銷）
   ・標記類出處＝現況原始碼：HOT＝labelHot（資料驅動）；折扣＝oldPrice＋discountPrice＋
     discountLabel（台式折數，現況值如「5」；02 舊記「B06 無折扣標」係樣本無資料，待更新）
   ・banner 文字左下（nomal hero 圖證）；HOT 位置照現況紅線外溢卡左界（形狀膠囊＝皮膚）
   ================================================================ */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:#222;
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}

/* 皮膚切換器（demo 外殼，非頁面內容，不受頁面規則約束） */
.skinSwitch{position:sticky;top:0;z-index:80;display:flex;
  background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid #e2e2e2}
.skinSwitch button{font:inherit;font-size:14px;font-weight:600;color:#999;background:none;border:0;cursor:pointer;
  padding:14px 26px;border-bottom:3px solid transparent;transition:.15s}
.skinSwitch button:hover{color:#111}
.skinSwitch button[aria-selected="true"]{color:#111;border-bottom-color:#111}
.skinSwitch .hint{margin-left:auto;align-self:center;padding-right:20px;font-size:12px;color:#bbb}

/* ============ 共用骨架（結構層，不隨換皮變動） ============ */
.v{
  --bg:#fff;--surface:#f5f5f5;--ink-strong:#000;--ink:#111;--body:#333;--muted:#777;
  --line:#e5e5e5;--inv-fg:#fff;
  --fs-h1:48px;--fs-h2:36px;--fs-h3:27px;--fs-h4:20px;--fs-body:15px;
  --r-card:0;--r-panel:0;--r-btn:0;--r-img:0;--r-pill:0;
  --gap:24px;--gap-2col:56px;--sec-pad:64px;--shadow:none;--wrap:1200px;
  --ico-chev:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M14.5 5 7.5 12l7 7' fill='none' stroke='black' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  --ico-down:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='m3.5 6 4.5 4.5L12.5 6' fill='none' stroke='black' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  --ico-search:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 18'><circle cx='8' cy='8' r='5.4' fill='none' stroke='black' stroke-width='1.8'/><path d='m12.2 12.2 3.8 3.8' stroke='black' stroke-width='1.8' stroke-linecap='round'/></svg>");
  --ico-check:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='m3 8.5 3.5 3.5L13 5' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background:var(--bg);color:var(--body)
}
.v[hidden]{display:none}
.v{overflow-x:clip}  /* 騎邊箭頭與負邊距媒體的視窗保護 */
/* 外框公式：所有區塊外框寬＝min(1200, 視窗−60)，任何視窗下全區塊左右緣對齊 */
.v .wrap{width:calc(100% - 60px);max-width:var(--wrap);margin:0 auto;padding:0 30px}
.v section{padding:var(--sec-pad) 0}
.v h2{font-size:var(--fs-h2);line-height:1.2;font-weight:700;color:var(--ink-strong);margin:0 0 28px;letter-spacing:-.02em}

/* 灰階佔位圖（data-label＝元件標示，只給無其他文字的區塊） */
.v .ph{position:relative;overflow:hidden;border-radius:var(--r-img);display:block;
  background:linear-gradient(135deg,#cfcfcf,#efefef 42%,#bdbdbd)}
.v .ph::before{content:"";position:absolute;inset:0;
  background:radial-gradient(120% 90% at 22% 18%,rgba(255,255,255,.85),rgba(255,255,255,0) 55%),
             radial-gradient(90% 80% at 82% 88%,rgba(0,0,0,.18),rgba(0,0,0,0) 60%)}
.v .ph::after{content:attr(data-label);position:absolute;left:0;right:0;bottom:12px;text-align:center;
  font-size:var(--fs-body);letter-spacing:.05em;color:rgba(0,0,0,.45);padding:0 10px}
.v .ph:not([data-label])::after{display:none}
.v .adv .ph::after{inset:0;display:flex;align-items:center;justify-content:center}

/* 輪播箭頭（現況 DOM：span.arrowLeft／span.arrowRight；兩種定位＝現況紅線） */
.v .arrowLeft,.v .arrowRight{position:absolute;top:50%;transform:translateY(-50%);z-index:3;
  width:44px;height:44px;cursor:pointer;color:var(--ink);
  display:flex;align-items:center;justify-content:center;line-height:1.2;user-select:none}
.v .arrowLeft::before,.v .arrowRight::before{content:"";width:18px;height:18px;background:currentColor;
  -webkit-mask:var(--ico-chev) center/contain no-repeat;mask:var(--ico-chev) center/contain no-repeat}
.v .arrowRight::before{transform:scaleX(-1)}
.v .arrowLeft{left:-54px} .v .arrowRight{right:-54px}

/* 圓點指示器（現況 DOM：.indicator > ul > li.now；作用中顆數＝可見卡數；樣式全站統一 8px） */
.v .indicator{display:flex;justify-content:center;margin-top:22px}
.v .indicator ul{display:flex;gap:8px;list-style:none;padding:0;margin:0}
.v .indicator li{width:8px;height:8px;border-radius:999px;background:#D4D4D4;border:0;display:block}
.v .indicator li.now{background:var(--ink)}

/* 按鈕（全站統一：內距 12×28、字級 15／600；1.5px＝描邊按鈕專用粗細；文字不帶箭頭） */
.v .btn{display:inline-block;font:inherit;font-size:var(--fs-body);font-weight:600;cursor:pointer;border-radius:var(--r-btn);
  padding:12px 28px;border:1.5px solid var(--ink);background:var(--ink);color:var(--inv-fg);transition:.18s;line-height:1.2;text-decoration:none}
.v .btn--ghost{background:transparent;color:var(--ink)}

/* 標記類（HOT＝現況原始碼 labelHot、資料驅動；折扣＝現況 DOM oldPrice+discountPrice+
   discountLabel、值＝台式折數）：標記統一置卡片右上（十一輪）＝V1 方圓角 6 黑標／
   V2 膠囊黑標（HOT 與折扣同款；↗ 已撤場）；折扣卡價格上下兩行＝原價刪除線在上（輔階）、
   折後價在下（主階） */
.v .pdQueue .oldPrice{text-decoration:line-through;width:100%;order:-1}
.v .pdQueue .priceSet{flex-wrap:wrap}
.v .pdQueue .discountLabel{position:absolute;top:10px;right:10px;z-index:3;
  background:rgba(17,17,17,.66);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);color:var(--inv-fg);
  font-size:var(--fs-body);font-weight:700;letter-spacing:.03em;padding:4px 12px}

/* ── 頁首｜工具列（處長指示：TT 標誌移除、認證徽章移頁尾；項目與順序照中文語系現況 DOM） ── */
.v .epHeader{border-bottom:1px solid var(--line);font-size:var(--fs-body);background:var(--bg)}
.v .epHeader .wrap{display:flex;align-items:center;justify-content:flex-end;min-height:44px}
.v .epHeader ul{display:flex;align-items:center;gap:16px;list-style:none;margin:0;padding:0;color:var(--muted);flex-wrap:wrap}
.v .epHeader a{color:var(--muted);text-decoration:none;display:inline-flex;align-items:center}
.v .epHeader a:hover{color:var(--ink)}
.v .epHeader .sep{width:1px;height:18px;background:var(--line)}
.v .epHeader .setNbr{background:var(--ink-strong);color:var(--inv-fg);font-size:12px;
  border-radius:999px;padding:1px 7px;margin-left:5px;line-height:1.5}
.v .caret::after{content:"";width:12px;height:12px;margin-left:4px;opacity:.7;background:currentColor;flex:none;
  -webkit-mask:var(--ico-down) center/contain no-repeat;mask:var(--ico-down) center/contain no-repeat;transition:.18s}
.v .drop:hover > a.caret::after{transform:rotate(180deg);opacity:1}
.v .epHeader .icoS{width:15px;height:15px;margin-right:5px;flex:none}

/* ── 頁首｜主列（現況 DOM：topZone > webHeader h1 + search；搜尋鈕在框內右端＝結構；
      框與鈕形狀＝皮層：V1 方圓角 8／6、V2 膠囊＋圓鈕＝各版語彙貫徹） ── */
.v .topZone{background:var(--bg)}
.v .topZone .wrap{display:flex;align-items:center;gap:20px;padding-top:18px;padding-bottom:18px}
.v .webHeader h1{margin:0}
.v .webHeader h1 a{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink-strong)}
.v .webHeader .logoPh{width:56px;height:56px;border-radius:var(--r-img);flex:none;background:#fff;overflow:hidden}
.v .webHeader .logoPh img{width:100%;height:100%;object-fit:contain;display:block}
.v .webHeader .firmName{font-size:var(--fs-h4);font-weight:700;letter-spacing:.03em;line-height:1.3}
.v .webHeader .firmName small{display:block;font-size:var(--fs-body);font-weight:500;color:var(--muted);letter-spacing:.04em}
.v .topZone .search{margin-left:auto;display:flex;align-items:center;position:relative;width:300px;max-width:40vw}
.v .topZone .search input[type=text]{width:100%;font:inherit;font-size:var(--fs-body);border:1px solid var(--line);
  background:var(--bg);color:var(--body);border-radius:999px;height:46px;padding:0 54px 0 18px;outline:none;transition:.15s}
.v .topZone .search input[type=text]:focus{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.v .topZone .search input[type=button]{position:absolute;right:5px;top:5px;width:36px;height:36px;
  border-radius:50%;border:0;background:var(--ink-strong);color:var(--inv-fg);cursor:pointer;font-size:0}
.v .topZone .search .searchIcon{position:absolute;right:14px;top:14px;width:18px;height:18px;pointer-events:none;
  background:var(--inv-fg);-webkit-mask:var(--ico-search) center/contain no-repeat;mask:var(--ico-search) center/contain no-repeat}

/* ── 頁首｜主導覽（現況 DOM：nav.menu > ul > li；6 項、整列靠左＝現況紅線；僅關於我們／產品帶 chevron） ── */
.v nav.menu{background:var(--bg);border-bottom:1px solid var(--line)}
.v nav.menu .wrap{display:flex;align-items:center;gap:2px;min-height:54px}
.v nav.menu ul{display:flex;list-style:none;margin:0;padding:0}
.v nav.menu a{text-decoration:none;color:var(--ink);font-size:var(--fs-body);font-weight:500;
  padding:10px 18px;transition:.15s;white-space:nowrap;display:inline-block}
.v nav.menu li:first-child > a{padding-left:0}
.v nav.menu li.hasChild > a::after{content:"";display:inline-block;width:12px;height:12px;margin-left:5px;opacity:.7;
  background:currentColor;vertical-align:-1px;
  -webkit-mask:var(--ico-down) center/contain no-repeat;mask:var(--ico-down) center/contain no-repeat;transition:.18s}
.v nav.menu li.hasChild:hover > a::after{transform:rotate(180deg);opacity:1}

/* ── 大圖輪播（現況紅線：箭頭在圖內、圓點包深色容器置圖片下緣內側（浮於照片＝容器補償規則）、
      主標副標疊圖上） ── */
.v .bigBanner .showArea{position:relative}
.v .bigBanner .slideList{list-style:none;padding:0;margin:0}
.v .bigBanner .slideList li{display:none;position:relative}
.v .bigBanner .slideList li:first-child{display:block}
.v .bigBanner .ph{aspect-ratio:1540/503}
.v .bigBanner .fadeoutMask{position:absolute;inset:0;z-index:1;border-radius:var(--r-img);
  background:linear-gradient(180deg,rgba(0,0,0,.05) 0%,rgba(0,0,0,.45) 100%)}
.v .bigBanner .textCnt{position:absolute;inset:0;z-index:2;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 90px}
.v .bigBanner .textCnt h4{font-size:var(--fs-h1);line-height:1.2;font-weight:700;color:#fff;margin:0 0 12px;letter-spacing:-.02em}
.v .bigBanner .textCnt p{font-size:var(--fs-h4);color:#fff;margin:0}
.v .bigBanner .arrowLeft{left:14px} .v .bigBanner .arrowRight{right:14px}
.v .bigBanner .indicator{position:relative;margin-top:-46px;z-index:3;margin-bottom:22px}
.v .bigBanner .indicator ul{background:rgba(0,0,0,.62);padding:7px 12px}
.v .bigBanner .indicator li{background:rgba(255,255,255,.35)}
.v .bigBanner .indicator li.now{background:#fff}

/* ── 公司新聞（現況 DOM 紅線：圖→標題→摘要；HOT 僅卡1、圖片下緣左端外溢卡左界；
      圓點 6 顆前 3 作用中；More 置中在圓點之下；卡內文字左＝T 字卡內規則） ── */
.v .newsBlock .slideArea{position:relative}
.v .newsBlock .list{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap)}
.v .newsBlock .list > li{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-card);
  box-shadow:var(--shadow);transition:.2s;position:relative}
/* overflow:visible（九輪修 bug：hidden 會裁掉 HOT 左溢 5px＝現況紅線）；圖自帶上圓角 */
.v .newsBlock .newsImg .ph{border-radius:var(--r-card) var(--r-card) 0 0}
.v .newsBlock .list > li > a{display:block;text-decoration:none;color:inherit}
.v .newsBlock .newsImg{display:block;position:relative}
.v .newsBlock .newsImg .ph{aspect-ratio:490/325}
.v .newsBlock h4{font-size:var(--fs-h4);line-height:1.45;font-weight:700;color:var(--ink);margin:16px 16px 8px}
.v .newsBlock p{font-size:var(--fs-body);line-height:1.7;color:var(--muted);margin:0 16px 20px}
.v .newsBlock .labelHot{position:absolute;top:10px;right:10px;z-index:2;
  background:rgba(17,17,17,.66);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  color:var(--inv-fg);font-size:var(--fs-body);font-weight:700;letter-spacing:.08em;padding:4px 12px}
.v .newsBlock .more{text-align:center;margin-top:28px}
.v .newsBlock .more a{display:inline-block;text-decoration:none;font-size:var(--fs-body);font-weight:600;
  color:var(--ink);background:transparent;border:1.5px solid var(--ink);border-radius:var(--r-btn);padding:12px 28px;transition:.18s}

/* ── 關於我們（現況 DOM：section.aboutUs > article > h2 + div + .more＝骨；
      按鈕排列位置＝皮層：預設堆疊左對齊（V2 軸線）、V1 覆寫整組置中（T 字）） ── */
.v .aboutUs article > div:not(.more){font-size:var(--fs-body);line-height:1.7;color:var(--body);max-width:820px}
.v .aboutUs .more{margin-top:28px}
.v .aboutUs .more a{display:inline-block;text-decoration:none;font-size:var(--fs-body);font-weight:600;
  background:var(--ink);color:var(--inv-fg);border:1.5px solid var(--ink);border-radius:var(--r-btn);padding:12px 28px;white-space:nowrap}

/* ── 聯繫與訂閱（現況 DOM：contacts.alone > contactUs + emailUpdate＝骨；
      0724 五輪：兩欄卡片化＝兩張行動卡（DOM 不動、純 CSS）；標題與說明同一行；
      整組對齊＝皮層：V1 置中／V2 靠左 ── */
.v .contacts.alone .wrap{display:grid;grid-template-columns:repeat(2,minmax(260px,420px));gap:var(--gap);justify-content:center}
.v .contacts.alone .contactUs,.v .contacts.alone .emailUpdate{background:var(--bg);border:1px solid var(--line);
  border-radius:var(--r-card);padding:28px;box-shadow:var(--shadow)}
.v .contacts .contactUs p,.v .contacts .emailUpdate p{margin:0 0 16px;font-size:var(--fs-body);line-height:1.7;color:var(--body)}
.v .contacts em{font-style:normal;font-weight:700;color:var(--ink-strong);margin-right:10px}
.v .contacts button{font:inherit;font-size:var(--fs-body);font-weight:600;cursor:pointer;border-radius:var(--r-btn);
  padding:12px 28px;border:1.5px solid var(--ink);background:var(--ink);color:var(--inv-fg);transition:.18s;line-height:1.2}

/* ── 橫幅廣告（現況紅線：區塊內禁放文字節點 → 元件標示畫在佔位圖上） ── */
.v .adv{padding:var(--sec-pad) 0}
.v .adv a{display:block}
.v .adv .ph{aspect-ratio:1540/300}  /* 0725 裁示：高度壓窄（原現況比 1540/385） */

/* ── 產品展示（N01：標題列加 tab＝報價 3.1.2；tab 位置＝標題列（兩版同結構），樣式＝皮膚層；
      overlay 品名→價格靠左＝現況紅線＋T 字卡內規則） ── */
.v .pdQueue .section-head{display:flex;align-items:center;gap:28px;margin-bottom:28px;flex-wrap:wrap}
.v .pdQueue .section-head h2{margin:0}
.v .pdQueue .tablist{display:flex;list-style:none;padding:0;margin:0;gap:4px}
.v .pdQueue .tablist button{font:inherit;font-size:var(--fs-body);font-weight:500;cursor:pointer;border:0;
  background:none;color:var(--muted);padding:9px 18px;border-radius:var(--r-pill);transition:.15s;white-space:nowrap;line-height:1.2}
.v .pdQueue [role=tabpanel][hidden]{display:none}
.v .pdQueue .slideArea{position:relative}
.v .pdQueue .list{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap)}
.v .pdQueue .list > li{position:relative;transition:.2s}
.v .pdQueue .list > li > a{display:block;text-decoration:none;color:inherit;position:relative}
.v .pdQueue .pdImg{position:relative;display:block;border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;transition:.2s}
.v .pdQueue .pdImg .ph{aspect-ratio:1/1;border-radius:0}
.v .pdQueue .hiddenInfo{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:16px;
  background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.78));color:#fff}
.v .pdQueue .hiddenInfo p{margin:0 0 6px;font-size:var(--fs-h4);font-weight:600;line-height:1.45}
.v .pdQueue .priceSet{display:flex;gap:6px;align-items:baseline;font-size:var(--fs-body)}
.v .pdQueue .priceSet .currency{opacity:.85}

/* ── 多媒體輪播（N02：YT Short；無左右箭頭＝現況紅線；一次僅顯示 1 則；來源膠囊保留） ── */
.v .iStage{padding:var(--sec-pad) 0}
.v .iStage .showArea{position:relative}
.v .iStage .showList{list-style:none;padding:0;margin:0}
.v .iStage .showList li{display:none}
.v .iStage .showList li.now{display:block}
.v .iStage .videoBox{position:relative}
.v .iStage .videoBox .ph{aspect-ratio:16/9}
.v .iStage .playBtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
  width:76px;height:52px;border-radius:var(--r-img);background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;pointer-events:none}
.v .iStage .playBtn::after{content:"";border-left:16px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:3px}
.v .iStage .platformTag{position:absolute;right:14px;bottom:14px;z-index:2;background:rgba(0,0,0,.62);color:#fff;
  font-size:var(--fs-body);border-radius:var(--r-pill);padding:5px 14px;letter-spacing:.03em;line-height:1.2}
/* YT Short（.is-short：9:16 直式置中＝pillarbox；不新增箭頭＝現況紅線） */
.v .iStage .showList li.is-short .videoBox{background:#000;border-radius:var(--r-panel);overflow:hidden;
  display:flex;align-items:center;justify-content:center;min-height:540px}
.v .iStage .showList li.is-short .ph{aspect-ratio:9/16;height:520px;width:auto;border-radius:0}
.v .iStage .showList li.is-short .ph::after{color:rgba(255,255,255,.62)}

/* ── 圖文模板新範本（N03：數據統計＋CTA×2＝新設計元件，走各版軸線；
      間距：eyebrow→標題 16、標題→lead 16、lead→按鈕 28） ── */
.v .statBlock .stats{list-style:none;padding:0;margin:0;
  display:grid;grid-template-columns:repeat(4,1fr);gap:24px;text-align:center}
.v .statBlock .num{font-size:var(--fs-h1);font-weight:400;color:var(--ink-strong);line-height:1.2;letter-spacing:-.02em}
.v .statBlock .lab{font-size:var(--fs-body);line-height:1.7;color:var(--muted);margin-top:8px}
.v .ctaBlock .eyebrow{font-size:var(--fs-body);font-weight:500;letter-spacing:.12em;color:var(--muted);margin:0 0 16px;line-height:1.2}
.v .ctaBlock h2{margin:0 0 16px}
.v .ctaBlock .lead{font-size:var(--fs-h4);line-height:1.7;color:var(--body);margin:0 0 28px;max-width:640px}
.v .ctaA .inner{text-align:center}
.v .ctaA .lead{margin-left:auto;margin-right:auto}
.v .ctaB .inner{display:grid;grid-template-columns:.85fr 1.15fr;gap:var(--gap-2col);align-items:center}
.v .ctaB .ctaImg .ph{aspect-ratio:4/3}

/* ── 聯絡我們表單（N04＝現行公司商機表單全欄位；分組＝填寫表單／聯絡人資訊；
      V1＝上下分組全展開、V2＝分組收合 accordion；電話＝桌機複製／行動直撥 ── */
.v .contactForm .cfInfo{margin-bottom:28px;max-width:640px}
.v .contactForm h2{margin:0 0 16px}
.v .contactForm .cfInfo p{font-size:var(--fs-body);line-height:1.7;color:var(--body);margin:0 0 20px}
.v .contactForm .tel{display:inline-flex;align-items:center;gap:10px;font-size:var(--fs-h4);font-weight:700;
  color:var(--ink-strong);text-decoration:none;letter-spacing:.02em;margin-bottom:10px;
  border:1.5px solid var(--ink);border-radius:var(--r-btn);padding:12px 24px;transition:.18s;line-height:1.2;background:transparent;cursor:pointer}
.v .contactForm .tel svg{width:20px;height:20px;flex:none}
.v .contactForm .tel:hover{background:var(--ink);color:var(--inv-fg)}
.v .contactForm .telNote{font-size:var(--fs-body);line-height:1.7;color:var(--muted);margin:0}
.v .contactForm form{display:flex;flex-direction:column;gap:16px}
.v .contactForm .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.v .contactForm .field{display:flex;flex-direction:column;gap:8px}
.v .contactForm label{font-size:var(--fs-body);font-weight:500;color:var(--ink);text-align:left;line-height:1.2}
.v .contactForm label .req{color:var(--ink-strong);font-weight:700;margin-left:2px}
.v .contactForm input,.v .contactForm select,.v .contactForm textarea{
  font:inherit;font-size:var(--fs-body);color:var(--body);background:#fff;
  border:1px solid #D4D4D4;border-radius:6px;height:46px;padding:0 14px;outline:none;transition:.15s;width:100%}
.v .contactForm ::placeholder{color:var(--muted)}
.v .contactForm textarea{height:auto;min-height:104px;padding:12px 14px;resize:vertical}
.v .contactForm input:focus,.v .contactForm select:focus,.v .contactForm textarea:focus{
  border-color:var(--ink-strong);box-shadow:0 0 0 1px var(--ink-strong)}
.v .contactForm .telRow{display:grid;grid-template-columns:auto 1fr;gap:10px}
.v .contactForm .qtyRow{display:grid;grid-template-columns:1fr auto;gap:10px}
.v .contactForm .telRow3{display:grid;grid-template-columns:auto 1fr 88px;gap:10px}
.v .contactForm .formSec{border-top:1px solid var(--line);padding-top:28px;display:flex;flex-direction:column;gap:16px}
.v .contactForm .secTitle{font-size:var(--fs-h4);line-height:1.45;font-weight:700;color:var(--ink-strong);margin:0}
.v .contactForm .chipRow,.v .contactForm .radioRow{display:flex;flex-wrap:wrap;gap:16px;align-items:center;
  font-size:var(--fs-body);color:var(--body);line-height:1.2}
.v .contactForm .chipRow label,.v .contactForm .radioRow label{display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.v .contactForm input[type=radio],.v .contactForm input[type=checkbox]{accent-color:#111;width:16px;height:16px;margin:0;flex:none}
.v .contactForm .hint{font-size:var(--fs-body);line-height:1.7;color:var(--muted);margin:0}
.v .contactForm .upBox{display:flex;gap:16px;align-items:center}
.v .contactForm .upPlus{width:88px;height:88px;flex:none;border:1px dashed #D4D4D4;border-radius:var(--r-img);
  display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--muted)}
.v .contactForm .recommend{display:flex;gap:8px;align-items:flex-start;font-size:var(--fs-body);color:var(--body);line-height:1.7;cursor:pointer}
.v .contactForm .msgBox{border:1px solid #D4D4D4;border-radius:6px;background:#fff;transition:.15s}
.v .contactForm .msgBox textarea{border:0;min-height:96px}
.v .contactForm .msgBox textarea:focus{border:0;box-shadow:none}
.v .contactForm .msgBox:focus-within{border-color:var(--ink-strong);box-shadow:0 0 0 1px var(--ink-strong)}
.v .contactForm .msgBox .chipRow{padding:2px 14px 12px}
.v .contactForm .nameRow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.v .contactForm .nameRow > input{flex:1;min-width:220px}
.v .contactForm .submit{border:0;min-width:200px;align-self:flex-start}

/* ── 頁尾＝單一黑塊（0724 四輪：含版權列全部收進黑底，不切零碎；本案新設計範圍）；
      內部四層：行動（聯繫＋訂閱，可開關：V1 開／V2 關）→ 信任（認證徽章，數量隨廠商動態）→
      識別（社群＋QR）→ 法遵（版權）；層間 1px rgba(255,255,255,.15) 細線＝現況橘線的黑白對應；
      排版＝左對齊流式（flex wrap，數量少也不空）、QR 單顆錨定右端；
      認證徽章自頁首移入（橘版測試廠商 8 枚＝示意）、TT 標誌縮小於版權列 ── */
.v .contactSet{background:#000;color:rgba(255,255,255,.62)}
.v .contactSet > .wrap{padding-top:44px;padding-bottom:16px}
/* 行動鈕併入識別層（0724 九輪：位置＝社群左側，左→右＝行動→識別→QR 權重遞減；
   頁尾＝入口層非說明層；標題與說明保留於 DOM 僅 CSS 隱藏；
   原 contacts <section> 已移除＝修掉其誤吃全站 section 88 內距的 bug） */
.v .contactSet .contactUs p,.v .contactSet .emailUpdate p{display:none}
.v .contactSet button{font:inherit;font-size:var(--fs-body);font-weight:600;cursor:pointer;
  background:#fff;color:#111;border:0;border-radius:var(--r-btn);padding:12px 28px;line-height:1.2}
.v .contactSet .certList{border-top:1px solid rgba(255,255,255,.15);padding:16px 0;
  display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.v .contactSet .cert{height:40px;min-width:88px;border-radius:6px;background:rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center;font-size:var(--fs-body);color:rgba(255,255,255,.62);padding:0 14px;letter-spacing:.03em}
.v .contactSet .others{padding:0 0 16px;
  display:flex;align-items:center;flex-wrap:wrap;gap:16px}
.v .contactSet .others ul{display:flex;flex-wrap:wrap;gap:12px;list-style:none;margin:0;padding:0}
.v .contactSet .emailUpdate + ul{margin-left:28px}
.v .contactSet .qrcode{margin-left:auto}
.v .contactSet .others li a{width:38px;height:38px;border-radius:50%;background:#fff;color:#111;
  display:flex;align-items:center;justify-content:center;font-size:var(--fs-body);font-weight:700;text-decoration:none}
.v .contactSet .qrcode{width:88px;height:88px;border-radius:var(--r-img);flex:none;
  background:linear-gradient(135deg,#cfcfcf,#efefef 42%,#bdbdbd)}
.v .contactSet .webFooter{border-top:1px solid rgba(255,255,255,.15);background:transparent;padding:16px 0 12px}
.v .contactSet .webFooter p{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:flex-start;
  margin:0;min-height:0;font-size:var(--fs-body);color:rgba(255,255,255,.62);padding:0}
.v .contactSet .webFooter a{color:rgba(255,255,255,.62);text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.v .contactSet .webFooter a:hover{color:#fff}
.v .contactSet .webFooter .ttLogo{width:66px;height:18px;border-radius:3px;display:inline-block;
  background:linear-gradient(135deg,#cfcfcf,#efefef 42%,#bdbdbd)}

/* ================================================================
   V1｜Xometry 黑白轉譯 —— 滿版底色分段；T 字全置中；方圓角系統 6/8/10/12/16
   ================================================================ */
.v1{
  --r-card:12px;--r-panel:16px;--r-btn:8px;--r-img:12px;--r-pill:6px;
  --gap:24px;--sec-pad:88px;--line:#E5E5E5;--surface:#F4F5F7;
  --ink-strong:#000;--ink:#111;--body:#333;--muted:#777;
  --shadow:none;
}
/* T 字軸線：section 層一律置中（標題、副標、整組內容）；卡片內部文字左（base 已左） */
.v1 h2{text-align:center}
/* 大型滿寬媒體圓角 16；內容卡與內容圖 12 */
.v1 .bigBanner .ph,.v1 .bigBanner .fadeoutMask{border-radius:16px}
.v1 .iStage .videoBox .ph{border-radius:16px}
.v1 .adv .ph{border-radius:16px}
/* 大圖圓點容器＝8（浮於照片的容器補償，方圓角系統） */
.v1 .bigBanner .indicator ul{border-radius:8px}
/* 導覽 hover＝字色加深（Xometry 純文字階） */
.v1 nav.menu a:hover{color:var(--ink-strong);font-weight:600}
/* 工具列徽章數字＝6（方圓角系統） */
.v1 .epHeader .setNbr{border-radius:6px}
/* 輪播箭頭＝10 方圓鈕；白底不透明＋1px 框＋陰影（浮於照片＝全站唯一「框＋影並用」例外） */
.v1 .arrowLeft,.v1 .arrowRight{background:#fff;border:1px solid var(--line);border-radius:10px;
  box-shadow:0 4px 16px rgba(0,0,0,.08);font-size:20px;color:#111}
/* 公司新聞：白卡 1px 框無影；hover 上浮＋影、框退場（擇一） */
.v1 .newsBlock .list > li:hover{transform:translateY(-4px);box-shadow:0 4px 16px rgba(0,0,0,.08);border-color:transparent}
.v1 .newsBlock .labelHot{border-radius:6px}
.v1 .newsBlock .more a:hover{background:#111;color:#fff}
/* 標記統一右上、V1＝方圓角 6（HOT 與折扣同款）；原價＝深底輔階（overlay 白字上） */
.v1 .pdQueue .discountLabel{border-radius:6px}
.v1 .pdQueue .oldPrice{color:rgba(255,255,255,.62)}
/* 關於我們＝敘事層 → 滿版出血 #1F1F1F（0 圓角）；整組置中（T 字）；深底唯一按鈕＝反白實心 */
.v1 .aboutUs{background:#1F1F1F}
.v1 .aboutUs h2{color:#fff}
.v1 .aboutUs article{max-width:900px;margin:0 auto;text-align:center}
.v1 .aboutUs article > div:not(.more){color:rgba(255,255,255,.62);margin:0 auto}
.v1 .aboutUs .more a{background:#fff;color:#111;border-color:#fff}
/* 產品展示：標題與 tab 置中堆疊（T 字）；tab＝深色槽 8＋白實心滑塊 6（Xometry 分段控制器，
   形狀依方圓角系統轉譯）；卡片 hover 與新聞卡一致 */
.v1 .pdQueue .section-head{flex-direction:column;align-items:center;gap:24px}
.v1 .pdQueue .tablist{background:#000;border-radius:8px;padding:5px}
.v1 .pdQueue .tablist button{color:rgba(255,255,255,.62)}
.v1 .pdQueue .tablist button[aria-selected="true"]{background:#fff;color:#111}
.v1 .pdQueue .pdImg{border-radius:12px}
.v1 .pdQueue .list > li:hover{transform:translateY(-4px)}
.v1 .pdQueue .list > li:hover .pdImg{box-shadow:0 4px 16px rgba(0,0,0,.08);border-color:transparent}
/* 多媒體輪播＝滿版出血 #000 帶（深色不可收窄成圓角卡）；影片框容器寬圓角 16 置帶內；
   platformTag＝深底白描邊、圓角 6；圓點深底白（裸置：落在色帶上不需容器） */
.v1 .iStage{background:#222}
.v1 .iStage .showList li.is-short .videoBox{background:transparent;min-height:540px;border-radius:0}
.v1 .iStage .platformTag{background:transparent;border:1px solid rgba(255,255,255,.55)}
.v1 .iStage .indicator li{background:rgba(255,255,255,.35)}
.v1 .iStage .indicator li.now{background:#fff}
/* 圖文模板新範本（新元件＝T 字置中）：統計＝滿版淺灰帶；CTA一＝深色滿版；CTA二＝白底分欄欄內置中 */
/* 數據統計＝深底（0725 裁示：品牌實力重音、聚光燈式展示；#1F1F1F＝佐證層與敘事同階；
   新順序保證與其他深帶不相鄰） */
.v1 .statBlock{background:#1F1F1F}
.v1 .statBlock .num{color:#fff}
.v1 .statBlock .lab{color:rgba(255,255,255,.62)}
.v1 .ctaA{background:#222}
.v1 .ctaA .eyebrow{color:rgba(255,255,255,.62)}
.v1 .ctaA h2{color:#fff}
.v1 .ctaA .lead{color:rgba(255,255,255,.62)}
.v1 .ctaA .btn{background:#fff;color:#111;border-color:#fff}
.v1 .ctaB .ctaText{text-align:center}
.v1 .ctaB .lead{margin-left:auto;margin-right:auto}
/* 聯絡我們表單（新元件＝V1 方案「上下分組全展開」）：說明＋電話置中在上（T 字）、
   表單分組在下（max-width 840 置中；欄位標籤靠左＝易用性紅線例外）；送出置中 */
.v1 .contactForm .cfInfo{text-align:center;max-width:none}
.v1 .contactForm form{max-width:840px;margin:0 auto;width:100%}
.v1 .contactForm .submit{align-self:center}
/* 頁尾各層置中（V1 軸線；0724 五輪：「頁尾＝功能列例外」作廢）；QR 隨群組置中不錨右 */
.v1 .contactSet .certList{justify-content:center}
.v1 .contactSet .others{justify-content:center}
.v1 .contactSet .others .qrcode{margin-left:28px}
.v1 .contactSet .webFooter p{justify-content:center}
/* 搜尋框／鈕與社群鈕轉方圓角（0724 五輪：正圓只留圓點本體，正圓＝V2 專屬語彙） */
.v1 .topZone .search input[type=text]{border-radius:8px}
.v1 .topZone .search input[type=button]{border-radius:6px}
.v1 .contactSet .others li a{border-radius:10px}

/* ================================================================
   V2｜柔性面板 —— 面板分段；全左對齊；正圓系統 28/20/14/999
   ================================================================ */
.v2{
  --r-card:20px;--r-panel:28px;--r-btn:999px;--r-img:14px;--r-pill:999px;
  --gap:22px;--sec-pad:28px;--line:#ECECEC;--surface:#F2F2F2;
  --ink-strong:#0A0A0A;--ink:#111;--body:#3A3A3A;--muted:#8A8A8A;
  --shadow:0 6px 24px rgba(0,0,0,.07);
}
/* 同寬規則：面板背景畫在 .wrap（外框公式寬）；滿寬媒體以負邊距補齊到同一外框寬 */
.v2 .bigBanner .showArea{margin:0 -30px}
.v2 .adv a{margin:0 -30px}
.v2 .iStage .showArea{margin:0 -30px}
.v2 .bigBanner .ph,.v2 .bigBanner .fadeoutMask{border-radius:var(--r-panel)}
.v2 .adv .ph{border-radius:var(--r-panel)}
.v2 .iStage .videoBox .ph{border-radius:var(--r-panel)}
.v2 .iStage .showList li.is-short .videoBox{border-radius:var(--r-panel);background:#262626}
/* 面板容器（統一內距 44 四邊等距、圓角 28）：一個面板＝一個元件；
   深 #111＝關於我們與CTA一（0725 十二輪：底色任務對照兩版統一，
   原「深色位置與 V1 對調」合併理由作廢——邏輯一致性優先於位置差異化）；其餘＝淺灰 */
.v2 .newsBlock > .wrap,.v2 .aboutUs > .wrap,.v2 .contacts.alone > .wrap,.v2 .pdQueue > .wrap,
.v2 .statBlock > .wrap,.v2 .ctaA > .wrap,.v2 .ctaB > .wrap,.v2 .contactForm > .wrap{
  border-radius:var(--r-panel);padding:44px}
.v2 .newsBlock > .wrap,.v2 .contacts.alone > .wrap,.v2 .pdQueue > .wrap,
.v2 .ctaB > .wrap,.v2 .contactForm > .wrap{background:var(--surface)}
.v2 .aboutUs > .wrap,.v2 .ctaA > .wrap,.v2 .statBlock > .wrap{background:#262626}
.v2 .statBlock .num{color:#fff}
.v2 .statBlock .lab{color:rgba(255,255,255,.62)}
/* 全左軸線：聯繫與訂閱整組靠左（對齊＝皮層，依 V2 軸線）；兩卡 50/50 撐滿面板（0725 裁示） */
.v2 .contacts.alone .wrap{justify-content:flex-start;grid-template-columns:1fr 1fr}
/* 導覽 hover＝底線（與 tab 同一「目前所在／切換」語彙） */
.v2 nav.menu a{border-bottom:2px solid transparent;padding-bottom:8px}
.v2 nav.menu a:hover{border-bottom-color:#111;color:var(--ink-strong)}
/* 輪播箭頭＝正圓柔和圓鈕；位置統一「騎在外框邊線上」（0725 二裁：中心壓面板／媒體邊緣，
   卡列面板邊＝內縮 44 →-66、大圖媒體邊＝-22，同一條規則；V1 維持現況兩種定位＝兩案並陳） */
.v2 .arrowLeft,.v2 .arrowRight{background:#fff;border:1px solid var(--line);border-radius:50%;
  box-shadow:0 2px 10px rgba(0,0,0,.07);font-size:20px;color:#111}
.v2 .arrowLeft{left:-66px}
.v2 .arrowRight{right:-66px}
.v2 .bigBanner .arrowLeft{left:-22px}
.v2 .bigBanner .arrowRight{right:-22px}
/* 圓點：作用中＝黑色長膠囊（形狀＋長度雙重編碼；填色雙態承 base）；大圖圓點容器＝膠囊 */
.v2 .indicator li.now{width:24px}
.v2 .bigBanner .indicator ul{border-radius:999px}
/* 標記統一右上、V2＝膠囊（HOT 與折扣同款；圓放不下三字母、膠囊與 V2 語彙一致；
   0724 十輪：↗ 撤場；可點性＝整卡點擊＋hover 浮起慣例） */
.v2 .pdQueue .discountLabel{border-radius:999px}
.v2 .pdQueue .oldPrice{color:var(--muted)}
.v2 .pdQueue .discountPrice{color:var(--ink)}
/* 大圖輪播：文字左下（nomal hero 圖證；疊圖上＝現況紅線不變） */
.v2 .bigBanner .textCnt{align-items:flex-start;justify-content:flex-end;text-align:left;padding:0 0 84px 56px}

    <div class="wrap">
      <div class="cfInfo">
        <h2>聯繫我們</h2>

        <a class="tel" href="tel:+886221234567">${CALL_ICON}<span>${TEL_NUM}</span></a>

      </div>
      <form onsubmit="return false">
        <div class="formSec">
          <h3 class="secTitle">填寫表單</h3>
          <div class="field">
            <label>主題<span class="req">*</span></label>
            <input type="text" placeholder="請輸入詢問主題">
          </div>
          <div class="field">
            <label>消息<span class="req">*</span></label>
            <div class="msgBox">
              <textarea placeholder="請描述您的產品需求與規格"></textarea>
              <div class="chipRow">
                <label><input type="radio" name="quick">Request price</label>
                <label><input type="radio" name="quick">Request a sample</label>
                <label><input type="radio" name="quick">Request a product catalog</label>
              </div>
            </div>
          </div>
          <div class="row2">
            <div class="field">
              <label>數量</label>
              <div class="qtyRow">
                <input type="text" inputmode="numeric" placeholder="請輸入數量">
                <select aria-label="選取單位"><option>選取單位</option><option>Piece</option><option>Set</option><option>Kilogram</option></select>
              </div>
            </div>
            <div class="field"><label>預估購買金額</label><input type="text" inputmode="numeric" placeholder="USD"></div>
          </div>
          <div class="field">
            <label>產品關鍵字</label>
            <input type="text" placeholder="請輸入產品關鍵字">
            <p class="hint">這有助於將您的需求，與潛在供應商進行更精準的匹配。</p>

          <div class="field">
            <label>附件</label>
            <div class="upBox">

              <div>
                <p class="hint">選擇檔案或拖曳到此處。最多 3 個檔案（總計 10MB）。</p>
                <p class="hint">上傳的文件副檔名：htm, html, doc, docx, pdf, txt, jpg, gif, png, odt, ods。</p>
              </div>
            </div>
          </div>
        </div>
        <div class="formSec">
          <h3 class="secTitle">聯絡人資訊</h3>
          <div class="field">
            <label>聯絡人姓名<span class="req">*</span></label>
            <div class="nameRow">
              <input type="text" placeholder="請輸入姓名">
              <div class="radioRow">
                <label><input type="radio" name="title">Dr.</label>
                <label><input type="radio" name="title">Miss</label>
                <label><input type="radio" name="title" checked>Mr.</label>
                <label><input type="radio" name="title">Ms.</label>
              </div>
            </div>
          </div>
          <div class="row2">
            <div class="field"><label>公司名稱<span class="req">*</span></label><input type="text" placeholder="請輸入公司名稱"></div>
            <div class="field">
              <label>國家<span class="req">*</span></label>
              <select><option>台灣</option><option>其他國家／地區</option></select>
            </div>
          </div>
          <div class="field">
            <label>公司網站</label>
            <div class="qtyRow">
              <input type="url" placeholder="https://">
              <label class="radioRow"><input type="checkbox">不存在</label>
            </div>
          </div>
          <div class="row2">
            <div class="field">
              <label>商務電話號碼</label>
              <div class="telRow3">
                <select aria-label="國碼"><option>+886</option><option>+1</option><option>+81</option></select>
                <input type="tel" placeholder="2123 4567">
                <input type="text" placeholder="#分機">
              </div>
            </div>
            <div class="field">
              <label>手機號碼</label>
              <div class="telRow">
                <select aria-label="國碼"><option>+886</option><option>+1</option><option>+81</option></select>
                <input type="tel" placeholder="912 345 678">
              </div>
              <p class="hint">請留下您的電話號碼，以加快供應商媒合與後續聯繫。</p>
            </div>
          </div>
        </div>
        <label class="recommend"><input type="checkbox" checked>若供應商未於 2 工作日內聯絡我，請推薦其他符合標準的供應商。</label>
        <button type="submit" class="btn submit">送出</button>
      </form>
    </div>
  </section>

document.querySelectorAll(".v").forEach(el => el.innerHTML = markup());

/* 產品展示 tab 切換（只切換面板，卡片結構不變） */
document.querySelectorAll('.pdQueue').forEach(block=>{
  const tabs = [...block.querySelectorAll('[role=tab]')];
  const panels = [...block.querySelectorAll('[role=tabpanel]')];
  tabs.forEach(t => t.addEventListener('click', () => {
    tabs.forEach(x => x.setAttribute('aria-selected', x === t));
    panels.forEach(p => p.hidden = p.dataset.panel !== t.dataset.tab);
  }));
});

/* 電話：桌機（可 hover 的精準指標）＝點按複製號碼＋回饋；行動裝置＝tel: 直撥 */
document.querySelectorAll('.contactForm .tel').forEach(t=>{
  t.addEventListener('click', e=>{
    if (matchMedia('(hover: hover) and (pointer: fine)').matches){
      e.preventDefault();
      const done = () => {
        const note = t.parentElement.querySelector('.telNote');
        if (note && !note.dataset.orig){ note.dataset.orig = note.textContent; }
        if (note){ note.textContent = '已複製號碼 ' + TEL_NUM;
          setTimeout(()=>{ note.textContent = note.dataset.orig; }, 2000); }
      };
      if (navigator.clipboard) navigator.clipboard.writeText(TEL_NUM).then(done).catch(done);
      else done();
    }
  });
});

/* V2 商機表單分組收合（點組標題 ⌃/⌄；demo 預設展開供審視，上線建議預設收合＝列訪談） */
document.querySelectorAll('#v2 .contactForm .formSec').forEach(secEl=>{
  const t = secEl.querySelector('.secTitle');
  if (t) t.addEventListener('click', ()=> secEl.classList.toggle('is-closed'));
});

/* 皮膚切換：V1／V2 於相同捲動位置對調，方便逐區比對 */
const SKINS = [...document.querySelectorAll('.skinSwitch button')];
function show(id){
  const y = window.scrollY;
  SKINS.forEach(b=>{
    const on = b.dataset.skin === id;
    b.setAttribute('aria-selected', on);
    document.getElementById(b.dataset.skin).hidden = !on;
  });
  window.scrollTo(0, y);
}
SKINS.forEach(b => b.addEventListener('click', () => show(b.dataset.skin)));
document.addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const i = SKINS.findIndex(b => b.getAttribute('aria-selected') === 'true');
  show(SKINS[(i + (e.key === 'ArrowRight' ? 1 : SKINS.length - 1)) % SKINS.length].dataset.skin);
});
if (location.hash === '#v2') show('v2');
</script>
