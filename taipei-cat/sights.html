<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">

<title>台北帶貓：景點</title>
<link rel="stylesheet" href="lib/leaflet.css">
<style>
:root{--ink:#1f2a33;--mute:#6b7680;--line:#dfe4e8;--line2:#f0f2f4;--bg:#f6f7f8;--card:#fff;--ok:#1d7a4a;--no:#b23a3a;--keep:#e8f3ec;--drop:#f5e9e9;--tag:#eef1f4;--hit:#fff3c4;--pri:#2b6cb0}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;display:flex;flex-direction:column}
header{padding:6px 12px 4px;flex:none}
h1{font-size:16px;margin:0;display:inline}
.sub{color:var(--mute);font-size:12px;margin-left:8px}
.panel{padding:6px 12px;background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;flex:none}
.panel label{display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.panel select,.panel input[type=search]{font:inherit;padding:2px 5px;border:1px solid var(--line);border-radius:4px}
.count{color:var(--mute);margin-left:auto}
.fpanel{display:none;flex:none;background:var(--card);border-bottom:1px solid var(--line);padding:6px 12px;max-height:45vh;overflow:auto;font-size:12px}
body.fopen .fpanel{display:block}
.frow{display:flex;align-items:flex-start;gap:8px;padding:3px 0}
.flabel{width:84px;flex:none;padding-top:3px;font-weight:700;color:var(--mute)}
.fopts{flex:1;display:flex;flex-wrap:wrap;gap:4px}
.fopts button{font-size:12px;min-height:22px}
.fopts button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.fopts .n{color:var(--mute);margin-left:3px;font-weight:400}
.fopts button.on .n{color:#dfe8f5}
.main{flex:1;min-height:0;display:flex}
.listpane{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--card)}
.mappane{width:40%;min-width:300px;border-left:1px solid var(--line);display:none;position:relative}
body.mapon .mappane{display:block}
body.mapfull .mappane{position:fixed;inset:0;width:auto;z-index:999;border:0}
#map{position:absolute;inset:0;background:#e9ecef}
.mapbtns{position:absolute;top:10px;right:10px;z-index:900;display:flex;gap:4px}
.mapbtns button{background:#fff}
.scroll{flex:1;min-height:0;overflow:auto;scrollbar-gutter:stable}
.head,.row{display:grid;align-items:center;gap:0 8px;padding:0 10px;grid-template-columns:220px 38px 110px 36px 50px 56px 120px minmax(160px,1fr) 150px}
body.mapon .head,body.mapon .row{grid-template-columns:minmax(160px,1fr) 38px 100px 36px 50px 56px 110px 150px}
body.mapon .c-note{display:none}
.head{height:28px;font-weight:700;color:var(--mute);background:var(--line2);border-bottom:1px solid var(--line);flex:none;position:sticky;top:0;z-index:1;overflow-y:hidden;scrollbar-gutter:stable}
.row{min-height:30px;border-bottom:1px solid var(--line2)}
.row>*,.head>*{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row:hover{background:#f7f8f9}
.row.keep{background:var(--keep)} .row.drop{background:var(--drop);color:var(--mute)}
.name{font-weight:700;color:var(--ink);text-decoration:none}
.name:hover{color:var(--pri);text-decoration:underline}
.tags{display:flex;gap:4px}
.tags>*{flex:none}
.tag{background:var(--tag);border-radius:4px;padding:0 6px;font-size:12px;line-height:20px}
.tag.ok{background:#e3f1e8;color:var(--ok)} .tag.no{background:#f7e4e4;color:var(--no)} .tag.hit{background:var(--hit)}
.acts{display:flex;gap:3px;justify-content:flex-end;overflow:visible}
button,a.btn{font:inherit;font-size:12px;min-height:22px;padding:0 6px;border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
a.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.foot{flex:none;background:var(--card);border-top:1px solid var(--line);padding:6px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:16px 8px;z-index:1000}
.dim.open{display:flex}
.dlg{background:#fff;border-radius:4px;max-width:760px;width:100%;padding:14px 16px;font-size:13px}
.dlg h2{font-size:18px;margin:0 0 8px}
.dlg dl{display:grid;grid-template-columns:88px 1fr;gap:5px 10px;margin:8px 0}
.dlg dt{color:var(--mute)} .dlg dd{margin:0}
.dlg .tags{flex-wrap:wrap}
.clue{margin:2px 0;padding:3px 8px;background:#fbfbf4;border-radius:4px}
.clue b{background:var(--hit)}
.clue .src{color:var(--mute);font-size:12px;margin-right:6px}
.q{margin:3px 0;padding:3px 8px;background:#f4f6f8;border-radius:4px}
.small{color:var(--mute);font-size:12px}
.dacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;position:sticky;bottom:0;background:#fff;padding-top:8px}
.dacts button,.dacts a.btn{min-height:30px;padding:0 12px}
.leaflet-popup-content{font-size:13px}
@media (max-width:900px){
  body{font-size:16px}
  .sub{display:block;margin:2px 0 0}
  .head{display:none}
  .row{grid-template-columns:1fr;grid-template-rows:repeat(4,auto);align-content:start;row-gap:4px;padding:10px 12px;min-height:0}
  .row>*{white-space:normal}
  .row .c-dist,.row .c-type,.row .c-rating,.row .c-reviews,.row .c-km,.row .c-sat{display:none}
  .row .c-info{display:block;color:var(--mute);font-size:14px}
  .c-note{display:flex;flex-wrap:wrap;gap:4px;max-height:52px;overflow:hidden}
  .acts{justify-content:flex-start;flex-wrap:wrap}
  .acts>*{flex:1 1 0;min-height:40px}
  button,a.btn{font-size:15px}
  body.mapon .listpane{display:none}
  body.mapon .mappane{display:block;width:100%;min-width:0;border:0}
  .dlg dl{grid-template-columns:1fr}
}
@media (min-width:901px){.row .c-info{display:none}}
</style>
</head>

。夜幕降臨後，公園氛圍更顯舒適，常見許多家庭或朋","評論搜「寵物」：人海～意外地發現繡球花比杜鵑花多很多～邊享受音樂地薰陶，還能看到可愛的寵物鴨 現場不止是花，還有可愛的伊布跟皮卡丘，大人小孩都很愛 洗手間 建議先看地","評論搜「寵物」：齊的步道，適合散步、慢跑，也能看到許多家庭帶著小朋友來玩耍，還有人帶著寵物散步，氛圍十分悠閒自在。園內的生態資源也很豐富，池塘裡有水鳥悠遊，四季都有不","評論搜「毛孩」：首都之肺，步道蟲鳴鳥叫，樹蔭草皮，適合各種時段運動休閒或小孩放風，毛孩貓咪奔放的廣大區域，停車方便，附近餐飲眾多選擇，如果有各式活動餐車、公園旁咖","評論搜「毛孩」：鼻而來花開的香味瀰漫於公園的空氣中，且公園佔地非常寬廣，適合散步運動遛毛孩及溜小孩，也有親子遊樂溜冰場地等等也是拍美照打卡的熱門景點。 … 0:22 ","評論搜「毛孩」：花都搭配可愛的透明傘造景，而且真的是寵物友善園區，我帶我們家癱瘓狐狸犬毛孩跟13歲瑪爾，即使推推車都很舒服，而且捷運4號出口也有電梯，真的很漂亮又舒適"],"停車":["評論搜「停車」：花、水生植物區等不同景觀，提供完善的休閒、運動與生態教育功能，並有地下停車場，交通便利，是市民親近自然、享受芬多精的綠洲。 主要特色與分區 森林與植栽","評論搜「停車」：叫，樹蔭草皮，適合各種時段運動休閒或小孩放風，毛孩貓咪奔放的廣大區域，停車方便，附近餐飲眾多選擇，如果有各式活動餐車、公園旁咖啡下午茶座位…..更是完","評論搜「停車」：大安森林公園站」出口即達，亦可搭乘多路公車至新生南路、信義路口下車。 停車資訊：公園周邊設有地下停車場，如「大安森林公園地下停車場」，亦可利用附近路邊"]},"scanned":true,"scanN":{"寵物":44,"停車":30,"有得坐":100},"dog":["狗狗友善"],"about":["提供無障礙入口","提供無障礙座位","提供無障礙停車場","適合野餐","有野餐桌","有遊樂場溜滑梯","有遊樂場鞦韆","有遊樂場","適合兒童","有適合兒童的遠足活動","收費室內停車場","狗狗友善"],"summary":"遊客表示這座公園擁有廣闊的綠地、多樣的植物群和豐富的野生動物，包含各種鳥類和松鼠，非常適合悠閒散步和觀察大自然。他們也特別提到捷運交通便利、洗手間乾淨，以及兒童遊戲區和野餐區等適合家庭的設施。 部分評論提到，這裡的環境有時候會比較擁擠。  ","reviews5":[{"age":"3 週前","stars":5,"text":"大安森林公園面積約26公頃，是台北盆地中心最大的綠地，有「台北之肺」之稱。它和植物園、台大校園及新生南路的行道樹連成都市綠廊，讓原本多在近郊山區活動的鳥類也能進城生活。園內常見五色鳥、白頭翁、綠繡眼、黑冠麻鷺與紅冠水雞；春夏可以看到五色鳥啄木築巢，夜間竹林偶有領角鴞現身。生態池周邊種了水柳、榕樹、茄冬和蝴蝶食草，小白鷺、黃頭鷺和夜鷺都在此築巢育雛，入夜後還能看到螢火蟲。\n\n園內最具代表性的鳥是鳳頭蒼鷹。牠是少數能適應都市環境並定居下來的日行性猛禽。大安森林公園之友基金會與台灣猛禽研究會合作，每年4至5月育雛季都會架設攝影機直播。過去幾年的直播主角是人氣母鳥「黃恩萼」，牠因車禍離世後由「小南」接棒，但小南的兩隻雛鳥都因感染毛滴蟲死亡，讓許多觀眾心碎。後來颱風吹倒園內多棵樹木，母鳥「小花媽」改到金華國中育雛，兩顆蛋順利孵化。在園內黑板樹巢中出生的母鳥「藍H1」，2023年完成繫放，之後移動約20公里到淡江大學，創下雙北地區鳳頭蒼鷹已知最遠的移動紀錄，並在當地成功育雛。\n\n但雖然猛禽研究會和大安森林公園之友基金會多次宣導餵食動物可能造成毛滴蟲、禽流感等感染擴大等危害，但園內餵松鼠和鴿子的狀況仍屢見不鮮，市民素養仍有提升空間，拜託不要手賤好嗎"},{"age":"3 個月前","stars":4,"text":"談到我曾拜訪的世界各國的知名景點與花園，記憶中比較深刻的是美國紐約市曼哈頓的中央公園；巴黎的凡爾賽宮花園和盧森堡公園；法國南部歷史名城Carpentras 市郊的Chateau de la Roseraie 公園；常有異議民眾站在翠綠草坪邊的肥皂箱上發表個人言論的倫敦海德公園(Hyde Park)；東京的皇室後花園；中國北京市的圓眀園；克羅埃西亞的十六湖國家公園。臺灣首善之都臺北市最廣闊的綠地-大安森林公園-與之相較，真是小巫見大巫，稱其爲森林公園，有點名不副實。然而，對於臺北市民而言，臺灣地貌多山，可居住、耕種的沖積平原和丘陵寥寥無幾，狹隘的都市裡有像大安森林公園的規劃，已屬難能可貴，要求無法像先進國家的國際大都會那麼高，我好比狂銷全球六億本的傑出日漫《航海王（One Piece)》中因食用橡膠惡魔果實而全身能縮能伸的海賊王魯夫（Luffy)，頗能適應臺北市有限的環境條件，享受亞洲「ㄧ沙ㄧ世界」的都市生活美學。\n\n今天是2026年8月13日星期四，天氣不算炎熱，灰鬱的天空有一點點山雨欲來之勢，我趕忙在午餐後立刻從師大路家裡面出發，像逛北京市胡同一般，走美國重要詩人Robert Frost 詩作中「人跡罕至的路」（the road not taken)，從新生南路與和平東路相交的入口處進入午后靜謐沉睡的大安森林公園。我逛了公園裡重要的幾個景點：露天音樂臺、生態池塘、兒童遊樂場、籃球"},{"age":"1 個月前","stars":5,"text":"大安森林公園真的是台北市中心最棒的綠地休憩場所。園區非常寬敞，樹木茂密、草地開闊，走進來就能感受到空氣清新，完全是都市裡的「小森林」。交通超方便，捷運有專屬車站，出站就能直接進公園。\n\n園內設有慢跑道、步道、生態池，還能看到鷺鳥、五色鳥等野生動物，對喜歡自然的人來說很加分。春天杜鵑花季、夏天螢火蟲季都很有特色，晚上散步也很安全。兒童遊戲場設施多樣，親子家庭來這裡野餐、放風小孩都很合適。\n\n唯一的小缺點是週末人潮比較多，建議早晨或平日來會更舒服。整體來說，大安森林公園是台北市民與遊客必訪的都市綠洲，免費又好逛，值得一再造訪。\n\n---"},{"age":"3 週前","stars":5,"text":"維護得很好的公園，步道走起來很舒服。很久沒看到這麼多白鷺鷥了，畫面令人驚嘆，肅然起敬！\n\n遇到三位清潔人員專注地打掃，感謝英雄們\n\n洗手間的自動水龍頭還附有烘手機，真的是偉大的發明啊！"},{"age":"1 個月前","stars":5,"text":"2026/10/2\n去附近搭巴士，見有時間先來這個公園看看。\n\n有好多樹木，好多綠色，加上天氣好好,  行下影下相咁, 輕鬆  一下。\n仲見有松鼠, 好大隻呀!"}],"ratingB":"4.6","reviewB":"1,000則以上","score":3,"text":"大安森林公園\n公園\n大安區\n106臺北市大安區龍門里新生南路二段1號"},{"rule":{"name":"中正紀念堂園區（光華池、自由廣場）","pet":"可以","rule":"民眾可攜帶加適當防護措施之寵物或其他動物入園，並負有隨手清理所攜帶動物之排泄物，以維護園區安全及環境清潔。（2008年常見問答；紀念堂建築內部規定查不到）","source":"https://www.cksmh.gov.tw/News_Toggle.aspx?n=6042&sms=14473","level":"官方白紙黑字","seat":"查不到","parking":"查不到（參觀資訊頁無停車資訊）","note":"開放9:00至18:00；人流查不到","checked":"2026-11-27"},"id":"ChIJoXv-L56pQjQRJ0xYVbIxJrY","name":"自由廣場牌樓","district":"中正區","type":"歷史地標","primaryType":"historical_landmark","rating":4.6,"reviews":5256,"lat":25.036625899999997,"lng":121.51756660000001,"km":3.8,"url":"https://maps.google.com/?cid=13125232806023679015&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","web":"http://www.cksmh.gov.tw/index.php?code=list&flag=detail&ids=272&article_id=2043","tel":"02 2343 1100","addr":"100臺北市中正區東門里中山南路21號","hours":["星期一: 24 小時營業","星期二: 24 小時營業","星期三: 24 小時營業","星期四: 24 小時營業","星期五: 24 小時營業","星期六: 24 小時營業","星期日: 24 小時營業"],"satText":"星期六: 24 小時營業","clues":{"好拍":["式宮殿風格，層次分明、雕刻精緻，氣勢十足。 廣場視野遼闊，很適合散步、拍照，感受莊嚴又開闊的氛圍 ｜ 從牌樓看國旗飄揚~~歡慶中華民國雙十節","，這個地標擁有令人驚嘆的宏偉建築和精緻的細節，是個美麗又令人印象深刻的拍照景點。他們特別提到寬敞且維護良好的廣場，非常適合放鬆身心並享受寧靜"],"寵 示這座公園提供多種季節性花卉展覽，包含令人驚豔的鬱金香、玫瑰和菊花展，並以維護良好的多樣化植物園區為特色。他們特別提到搭乘大眾運輸工具前往非常方便，且公園的戶外區域免費入場。園區內乾淨的洗手間和寧靜的氛圍亦受到好評，非常適合悠閒散步。  ","reviews5":[{"age":"1 個月前","stars":5,"text":"士林官邸是士林長年重要的大型公園，也是台北非常適合賞花、散步與攝影的城市花園。園區一年四季都有不同的季節花卉與主題花展，包括著名的菊展、鬱金香展，以及繡球花等隨季節綻放的花卉；春天則推薦玫瑰園，盛花時節色彩繽紛，非常適合賞花與攝影。\n\n士林官邸與故宮博物院也是士林最常見到世界各地旅客的代表性國際觀光景點之一。它不只是觀光名勝，更是一座陪伴我們多年、可以散步、賞花與拍照的美麗城市花園。\n\n花展期間人潮較多，若非附近居民，建議搭乘捷運或公車等大眾運輸。"},{"age":"1 個月前","stars":4,"text":"「士林官邸公園」是台北士林區很棒的綠色園藝公園\n常常因為季節不同而規劃展出不同主題的花卉藝術展覽\n現在正在展出園藝特展\n免費入園\n有很多修剪漂亮高貴的盆栽可以欣賞\n整個園區乾淨舒適\n氛圍輕鬆自在\n拍照、散步、賞花、喝咖啡都很適合\n逛完可步行到士林夜市用餐"},{"age":"6 個月前","stars":5,"text":"**士林官邸公園**位於台北市士林區，曾是已故總統蔣中正與夫人宋美齡的官邸。這裡結合了傳統中式庭園的典雅與西式幾何花園的華麗，如今已轉型為台北市最具代表性的生態與花卉公園。\n以下是士林官邸公園的特色介紹：\n### 1. 核心看點：歷史建築與花卉藝術\n* **士林官邸正館**：這座墨綠色的兩層式建築是官邸的核心，內部保留了當年的起居生活空間與外交接待廳（參觀正館需另行購票）。\n* **玫瑰園**：這是宋美齡女士最喜愛的地方。園內種植了超過 120 種、數千株的玫瑰花。春季盛開時，各種色彩與品種的玫瑰散發陣陣幽香，是園內最浪漫的區域。\n* **中式與西式庭園**：園內同時擁有曲折小徑、拱橋、涼亭的「中式庭園」，以及修剪整齊、對稱分布的「西式庭園」，展現出東西方造園藝術的融合。\n* **新蘭亭與園藝展覽館**：這裡經常舉辦各種花卉特展，例如秋季最著名的「大菊展」與春季的「蘭花展」。\n### 2. 不同季節的風貌（三大花展）\n* **春季 (2月 - 4月)**：**鬱金香展**。從荷蘭與日本引進的各色鬱金香在草坪上綻放，讓園區充滿歐式田園風情。\n* **秋季 (11月 - 12月)**：**菊展**。這是士林官邸最盛大的活動，展出各種造型奇特的懸崖菊、大菊與大立菊，數量驚人。\n* **冬季**：梅花綻放。在官邸正館附近的梅林，白色的梅花在冷風中盛開，營造出清幽的氣氛。\n### 3. 位置"},{"age":"3 個月前","stars":3,"text":"公園有三個出入口，福林路入口、460巷入口、378巷入口。\n如果要看蔣宋美齡的座車，則是靠近福林路入口。\n如果要去士林官邸正館，460巷入口略遠一些，其他兩個出入口的距離都差不多。全票100，不能刷卡跟行動支付，但能夠使用悠遊卡。\n公園內有四個地方有廁所，靠近蔣宋美齡的座車、園藝教室、八角亭、穹頂花海這四個地點。\n如果需要飲水機則是蔣宋美齡的座車、八角亭、穹頂花海這三個地點的附近，在蔣宋美齡的座車附近還有咖啡廳可以內用，也有冰淇淋可購買。"},{"age":"1 個月前","stars":5,"text":"適合平時來散步走走的地方，花草樹木都整理的很好，園區內也都有廁所和垃圾桶。\n\n偶爾會有各種的花卉展，人潮就會暴增喔！"}],"ratingB":"4.7","reviewB":"1,000則以上","score":9,"text":"士林官邸公園\n公園\n士林區\n111臺北市士林區福林里中山北路五段460巷4號"},{"rule":{"name":"大安森林公園（含生態池）","pet":"可以","rule":"通則適用：公園管理自治條例第11條第1項第9款禁止「攜帶不具攻擊性動物進入公園，而未採取適當防護措施」；未查到本園專屬例外。生態池為鳥類棲地，另有餵食野生動物禁令。","source":"https://laws.gov.taipei/law/LawSearch/LawArticleContent/FL004002","level":"官方白紙黑字","seat":"查不到","parking":"查不到","note":"查不到有依據的拍攝與人流資料","checked":"2026-11-27"},"id":"ChIJ_UynUICpQj 在不知不覺中～^_^～孩子們就長大成人了；新手爸比媽咪們要好好的享受帶小寶貝們⋯⋯的每一個秒、分、時、日、年⋯不要錯過陪伴的幸福美好一天天用愛、耐心～^_^～與溫和的言語～^_^～培養優質的人生觀～^_^～待人有禮進入幼兒園～自然會有好的人際關係幼兒學習能力強會模仿大人的行為語言～^_^～自然快樂成長\n綠帶植栽真好看，拍一張台北101，景觀好，從奉天宮走往捷運後山埤，經過這裡，潔淨雪白花朵吸引我停留\n這裡算是點熟⋯廣慈/奉天宮站，淡水線剛通行，以前要來奉天宮、虎山，都是搭乘板藍線捷運往南港展覽館～到後山埤站2號出口，走過來的\n分享於你妳走路腿痠了⋯⋯這裡很多椅子可以坐著休息，也是很棒的散步好綠意喔晚上，也很美，觀賞台北101"},{"age":"7 個月前","stars":5,"text":"台北市廣慈博愛園區：信義區最受矚目的公園\n\n廣慈博愛園區北側綠帶，是台北市信義區近年最受矚目的都市綠洲。\n\n這條長約數百公尺的景觀綠帶，成功將原有的社會福利基地轉型為具備生態滯洪與全齡休閒功能的開放空間。\n\n核心特色與亮點：\n\n• 森林系景觀： 綠帶保留了大量原有老樹，並新植豐富的植栽，形成具有層次感的「都市森林」。\n\n• 共融式遊戲場： 設有具備地景特色的大型溜滑梯與攀爬網，是親子活動的首選。\n\n• 生態永續設計： 採用雨水回收系統與透水鋪面，落實韌性城市的韌性精神。\n\n這片綠地不僅串連了南側的大坡山自然資源，更為高密度的信義區提供了寶貴的呼吸空間，成為兼具美觀與機能的現代化城市鄰里公園。"},{"age":"7 個月前","stars":4,"text":"廣慈博愛園區北側綠帶位於台北信義區，是一處結合城市機能與自然綠意的療癒空間。走進綠帶，映入眼簾的是寬敞的步道與層次豐富的植栽設計，讓人彷彿暫時遠離都市的喧囂。午後時分，陽光透過樹梢灑落在草地上，形成斑駁光影，無論是散步、慢跑或靜靜坐著放空，都格外愜意。園區規劃完善，動線流暢，非常適合親子同遊或與朋友相約野餐。特別是在繁忙的信義區中，能擁有這樣一片靜謐的綠地，更顯珍貴。空閒時來這裡走走晃晃，不只能單純的休憩，還能給自己放空的片刻，讓身心都得到舒緩與釋放。"},{"age":"11 個月前","stars":5,"text":"路過被吸引過來走走\n整理得很乾淨舒適的地方\n還有公共藝術品穿梭在園區內\n\n體健區、兒童遊戲場還有綠蔭廊道\n園區內休憩座椅充足，保留大量老樹\n廣場視野開闊，遠眺101建築群"},{"age":"2 年前","stars":5,"text":"在台北市還能有佔地這麼大的社宅，真是不容易，公園遊樂設施也不錯，可惜品項少了點，也沒有遮陽，但整體來說是個很棒的地方。規劃得很棒。"}],"ratingB":"4.6","reviewB":"100-199則","score":4,"text":"廣慈博愛園區北側綠帶\n公園\n信義區\n110臺北市信義區大道路94巷"},{"rule":{"name":"水源町公園（中正區汀州路三段）","pet":"可以","rule":"通則適用（第11條第1項第9款，須適當防護措施）；未逐園查證專屬例外。","source":"https://laws.gov.taipei/law/LawSearch/LawArticleContent/FL004002","level":"官方白紙黑字","seat":"查不到","parking":"查不到","note":"查不到有依據的資料","checked":"2026-11-27"},"id":"ChIJe7RP0hepQjQRFkuBe_KS9wo","name":"水源町公園","district":"中正區","type":"城市公園","primaryType":"city_park","rating":4.6,"reviews":118,"lat":25.011830699999997,"lng":121.5345976,"km":4.3,"url":"https://maps.google.com/?cid=790261829778623254&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","web":"https://www.travel.taipei/zh-tw/news/details/30018","tel":"","addr":"100臺北市中正區水源里汀州路三段104巷40弄6號","hours":["星期一: 24 小時營業","星期二: 24 小時營業","星期三: 24 小時營業","星期四: 24 小時營業","星期 其中一位會一直講話，其中有人會一直打嗝，是說覺察能量不是應該要靜靜的感受？"},{"age":"10 個月前","stars":5,"text":"南港公園裡的三個能量廣場\n分別為「氣」、「石」、「木」\n位於公園北中南三處\n\n從公園中段水岸舞台\n旁邊有步道可以往小山坡上走\n可以找到「石」能量廣場\n\n由五色天然塊石組成\n玄武岩、砂岩、紅花崗岩、蛇紋岩及大理石\n雙手貼著塊石來感受磁場的傳遞\n希望可以儲存滿滿能量\n\n推薦把三個能量廣場都走一遍\n邊享受綠意盎然的大自然\n走一走釋放壓力流個汗\n心情自然跟著好"},{"age":"1 個月前","stars":5,"text":"跟著導航走，看到涼亭後，往涼亭的方向前進，抵達可以直視涼亭的交叉口後，背對涼亭的那條石子樓梯路往上走就可以抵達。\n\n或者從YouBike微笑單車 2.0: 南港公園(東新街170巷)過去也很好過去，跟著導航出發，很快會看到能量場-木，隨著樓梯向下直走，也能抵達能量場-石，中間會遇到幾個涼亭。\n\n比較要注意的是，路途上只有小夜燈，較晚前往時，要留意自身與腳下安全。\n\n能量場-石 先調頻到穩定，再到 能量場-氣 排氣，能省去音頻引導冥想的歷程，磁場也滿穩的，還能快速疏通體內不需要的能量，結束起身就能明顯感受到身體、肩膀舒暢且輕鬆！\n\n分享附近居民提供地吸取能量的小撇步，有需要可以取用：\n摸中間的石頭，能量感受會最明顯，雙手碰石頭，身體與肩膀放鬆，雙腳與肩同寬，膝蓋微彎，類似搖呼拉圈，上半身保持直立，身體下半部呈小幅度繞圈搖動。\n呼吸時運用呼吸法，呼吸時，需伴隨憋氣一段時間，持續以上步驟一段時間，若感受到身體發熱，為吸收能量的正常情況。\n\n此動作可持續三分鐘或一段時間後，再來測試自己的能量狀態，用吊墜物測試，手握著一端，發號指令時，沒握著的另一端東西是否能照著自己的指引，搖動與停止，若可行，代表身體有在吸收能量。"},{"age":"9 個月前","stars":5,"text":"能量廣場「石」我看旁邊的人用雙手靠著石頭去觸碰感受，我也跟隨著嘗試，能量有如冷暖飲水自己才會知道怎麼回事的。是什麼感覺等親自體驗過就會知道！我是沒有特別的感覺"},{"age":"3 個月前","stars":5,"text":"旁邊有人倒垃圾與污染液體，請相關主管機關查下，有惡臭"}],"ratingB":"4.7","reviewB":"60-99則","score":2,"text":"能量廣場—石（能量場最強）\n公園\n南港區\n115臺北市南港區成福里"},{"rule":{"name":"士林官邸公園（含西式庭園；正館室內另計）","pet":"可以","rule":"公園戶外適用通則（第11條第1項第9款，須採適當防護措施）；正館室內（文化局維管、售票）的寵物規定查不到，不可假設可入。另有遊記稱可帶、須繫繩落地，非官方。","source":"https://laws.gov.taipei/law/LawSearch/LawArticleContent/FL004002","level":"官方白紙黑字","seat":"查不到","parking":"查不到","note":"免費開放，8:00至18:00；人流查不到","checked":"2026-11-27"},"id":"ChIJt3-qakyvQjQRl4c2RxiKaZM","name":"西式庭園","district":"士林區","type":"花園","primaryType":"garden","rating":4.6,"reviews":71,"lat":25.092103299999998,"lng":121.53079980000001,"km":5.5,"url":"https://maps.google.com/?cid=10622173033008629655&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","web":"","tel":"02 2881 2912","addr":"111臺北市士林區福林里","hours":["星期一: 24 小時營業","星期二: 24 小時營業","星期三: 24 小時營業","星期四: 24 小時營業","星期五: 24 小時營業","星期六: 24 小時營業","星期日: 24 小時營業"],"satText":"星期六: 24 小時營業","clues":{"好拍":["館 現在叫陽明書屋... 2026/4/6再次造訪 走到比較裡面 有很漂亮的花園 也種植許多色澤鮮豔的蝴蝶蘭....分享的照片 是 傳導者\n廣場內有一株受保護的烏來冬青\n來這裡坐著靜靜感受大自然\n希望可以儲存滿滿能量\n\n推薦把三個能量廣場都走一遍\n享受著被綠意盎然包圍\n走一走釋放壓力流個汗\n心情自然跟著好"},{"age":"11 個月前","stars":5,"text":"從網上看到南港公園是能量最高最強的地方，於是趁天氣好，就去行了一轉。\n\n公園很大很寧靜，有3個不同的能量廣場。石頭，木及氣。每個能量廣場都有人靜靜的休息。\n\n個人來說，氣廣場中感受最深，縱使不身處金字塔中也感覺到很多感受。\n\n有興趣的人士可以去看看，公園附近有2個捷運車站，行過去也大約只是10到15分鐘的路程。"},{"age":"9 個月前","stars":5,"text":"好奇能量場的感受，所以前來南港公園走走體驗體驗，我只是坐下來在三顆烏桕前靜下心觀看四周，讓呼吸放慢去充電，慢慢嘗試感受當下的時刻。"}],"ratingB":"4.6","reviewB":"60-99則","score":2,"text":"能量廣場—木\n公園\n南港區\n115臺北市南港區成福里福德街401號"},{"rule":{"name":"花博公園圓山園區與美術園區（王大閎建築劇場）","pet":"可以","rule":"戶外適用公園通則（須適當防護措施）；管理要點全文與館內規定未讀到，美術園區室內場館不可假設可入。有遊記稱鄰近新生園區寵物友善，非官方。","source":"https://laws.gov.taipei/law/LawSearch/LawArticleContent/FL004002","level":"官方白紙黑字","seat":"查不到","parking":"查不到","note":"戶外24小時開放（管理要點摘錄）；人流查不到","checked":"2026-11-27"},"id":"ChIJ4Sl2ywupQjQRE4jXRhb4TNE","name":"摩天輪-北市兒童育樂中心舊址","district":"中山區","type":"城市公園","primaryType":"city_park","rating":4.7,"reviews":63,"lat":25.0753272,"lng":121.52311809999999,"km":4.4,"url":"https://maps.google.com/?cid=15081702026718447635&g_mp=CiVnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLkdldFBsYWNlEAIYBCAA","web":"","tel":"","addr":"10491臺北市中山區圓山里玉門街33號","hours":["星期一: 24 小時營業","星期二: 24 小時營業","星期三: 24 小時營業","星期四: 24 小時營業","星期五: 24 小時營業","星期六: 24 小時營業","星期日: 24 小時營業"],"satText":"星期六: 24 小時營業","clues":{"好拍":["落 以化身為裝置藝術 見證過往兒童樂園時期的歡樂時光 \"很棒的環騎台北打卡景點 "],"寵物":["評論搜「寵物」：草坪：公園內有大片廣闊的草坪區，環境整理乾淨，適合親子遊憩、野餐、或讓寵物奔跑，是都市中難得的綠意空間。 免費參觀：目前圓山自然景觀公園採取免費開放，"],"停車":["評論搜「停車」：如果想安靜散步，可以走承德路三段301巷，平面機車停車格旁的階梯上去，先經過腳踏車步道，行走10分鐘就會看到摩天輪，再下去一點就是","評論搜「停車」：彷彿進入被遺忘的昨日歡樂世界！ 從敦煌路進入，水門外有停車場。 幸運的話，門口的免費停車位非常方便。 園內草原遼闊，微風從河堤旁灌入很"],"有得坐":["評論搜「草皮」：有開放的地方？！但也因為可能如此、所以沒有什麼人會來。因此、感覺這裡的草皮和植物．樹木特別的漂亮美麗。這也應該是一件好事⋯⋯ …  9 "]},"scanned":true,"scanN":{"寵物":1,"停車":2,"有得坐":1},"dog":["狗狗友善"],"about":["提供無障礙入口","適合野餐","有遊樂場","適合兒童","有適合兒童的遠足活動","狗狗友善"],"summary":"\"寓教於樂：園區被分為三大主題： 遊樂世界：提供傳統機械遊樂設施。\" \"隱身在寧靜的公園角落 以化身為裝置藝術 見證過往兒童樂園時期的歡樂時光 \"很棒的環騎台北打卡景點 ","reviews5":[],"ratingB":"4.7","reviewB":"60-99則","score":5,"text":     const v=d.get(r);if(!sel.some(x=>v.includes(x)))return false;
  }
  if($('fHideDrop').checked&&state[r.id]==='drop')return false;
  if($('fOnlyKeep').checked&&state[r.id]!=='keep')return false;
  const q=$('fQ').value.trim().toLowerCase();if(q&&!r.text.includes(q))return false;
  return true;
}
function renderPanel(){
  $('fpanel').innerHTML=Object.entries(ROWS_F).map(([k,d])=>{
    const cnt={};for(const r of ROWS){if(!passes(r,k))continue;for(const v of d.get(r))cnt[v]=(cnt[v]||0)+1;}
    const sel=F[k]||[];
    const opts=d.opts.filter(o=>cnt[o]||sel.includes(o));
    if(!opts.length)return '';
    return '<div class="frow"><div class="flabel">'+d.label+'</div><div class="fopts">'
      +'<button data-f="'+k+'" data-v="" class="'+(sel.length?'':'on')+'">全部</button>'
      +opts.map(o=>'<button data-f="'+k+'" data-v="'+esc(o)+'" class="'+(sel.includes(o)?'on':'')+'">'+esc(o)+(d.suffix||'')+'<span class="n">'+(cnt[o]||0)+'</span></button>').join('')
      +'</div></div>';
  }).join('');
}
function filtered(){
  const sort=$('fSort').value;
  let out=ROWS.filter(r=>passes(r));
  out.sort((a,b)=>sort==='score'?(b.score-a.score)||(b.reviews-a.reviews):sort==='km'?a.km-b.km:sort==='rating'?(b.rating-a.rating)||(b.reviews-a.reviews):b.reviews-a.reviews);
  return out;
}
let lastRows=[];
function drawMarkers(rows){
  if(!layer)return;layer.clearLayers();markers={};
  for(const r of rows){
    const st=state[r.id]||'';
    const m=L.circleMarker([r.lat,r.lng],{radius:7,color:st==='drop'?'#b23a3a':st==='keep'?'#1d7a4a':'#2b6cb0',fillOpacity:.85,weight:1}).addTo(layer);
    m.bindPopup('<b>'+esc(r.name)+'</b><br>'+esc(r.district)+'・'+r.km+' 公里・'+r.rating+' 星 '+r.reviews.toLocaleString()+' 則<br><a href="#" data-detail="'+r.id+'">詳細</a>　<a href="'+esc(r.url)+'" target="_blank" rel="noopener">咕狗地圖</a>');
    markers[r.id]=m;
  }
}
function render(){
  renderPanel();
  const rows=filtered();lastRows=rows;
  $('count').textContent='符合 '+rows.length+' 個';
  $('list').innerHTML=rows.map(r=>{
    const st=state[r.id]||'';
    const info=[r.district.replace(/區$/,''),r.type,'離家 '+r.km+' 公里',r.rating.toFixed(1)+'★ '+r.reviews.toLocaleString()+'則',r.satText].filter(Boolean).join('・');
    return '<div class="row '+st+'" id="c-'+r.id+'">'
      +'<a class="name" href="'+esc(r.url)+'" target="_blank" rel="noopener" title="'+esc(r.name)+'（在咕狗地圖打開）">'+esc(r.name)+'</a>'
      +'<span class="c-dist">'+esc(r.district.replace(/區$/,''))+'</span>'
      +'<span class="c-info">'+esc(info)+'</span>'
      +'<span class="c-type" title="'+esc(r.type)+'">'+esc(r.type)+'</span>'
      +'<span class="c-rating">'+r.rating.toFixed(1)+'</span><span class="c-reviews">'+r.reviews.toLocaleString()+'</span>'
      +'<span class="c-km">'+r.km+' 公里</span>'
      +'<span class="c-sat" title="'+esc(r.satText)+'">'+esc(r.satText.replace(/^(星期六|週六)[:：]?\s*/,'')||'沒登記')+'</span>'
      +'<span class="tags c-note">'+noteTags(r).join('')+'</span>'
      +'<span class="acts"><button data-id="'+r.id+'" data-v="keep" class="'+(st==='keep'?'on':'')+'">'+(st==='keep'?'已留':'留')+'</button><button data-id="'+r.id+'" data-v="drop" class="'+(st==='drop'?'on':'')+'">不要</button><button data-detail="'+r.id+'">詳細</button><button data-map="'+r.id+'">地圖</button></span>'
      +'</div>';
  }).join('');
  drawMarkers(rows);
  const keep=ROWS.filter(r=>state[r.id]==='keep').length,drop=ROWS.filter(r=>state[r.id]==='drop').length;
  $('tally').textContent='留 '+keep+' 個，不要 '+drop+' 個';
}
function detail(r){
  const clues=Object.entries(r.clues).map(([k,ss])=>'<div><b>'+k+'</b>'+ss.map(s=>'<div class="clue">…'+hl(s)+'…</div>').join('')+'</div>').join('')||'5 則評論裡都沒提到';
  $('dlg').innerHTML='<h2>'+esc(r.name)+'</h2><div class="tags">'+noteTags(r).join('')+'</div>'
    +'<dl>'
    +(r.rule?'<dt>寵物規定</dt><dd><b>'+esc(r.rule.pet||'查不到')+'</b>（可信度：'+esc(r.rule.level)+'；查證 '+esc(r.rule.checked||'2026-11-27')+'）'+(r.rule.rule?'<div class="q">'+esc(r.rule.rule)+'</div>':'')+(r.rule.source&&/^http/.test(r.rule.source)?'<a href="'+esc(r.rule.source)+'" target="_blank" rel="noopener">出處</a>':'<span class="small">'+esc(r.rule.source||'')+'</span>')+(r.rule.hours?'<div>週六：'+esc(r.rule.hours)+'</div>':'')+(r.rule.seat?'<div>座位：'+esc(r.rule.seat)+'</div>':'')+(r.rule.parking?'<div>停車：'+esc(r.rule.parking)+'</div>':'')+(r.rule.note?'<div class="small">'+esc(r.rule.note)+'</div>':'')+'</dd>':'')
    +'<dt>線索</dt><dd>'+clues+'</dd>'
    +(r.summary?'<dt>咕狗摘要</dt><dd class="q">'+hl(r.summary)+'</dd>':'')
    +'<dt>評分</dt><dd>'+r.rating.toFixed(1)+' 分（'+r.reviews.toLocaleString()+' 則評論）</dd>'
    +'<dt>咕狗類型</dt><dd>'+esc(r.type||'沒有資料')+'</dd>'
    +(r.about.length?'<dt>咕狗簡介</dt><dd>'+esc(r.about.join('、'))+'</dd>':'')
    +'<dt>離家</dt><dd>'+r.km+' 公里<span class="small">（直線距離）</span></dd>'
    +'<dt>地址</dt><dd>'+esc(r.district)+'　'+esc(r.addr)+'</dd>'
    +(r.tel?'<dt>電話</dt><dd><a href="tel:'+esc(r.tel.replace(/\s/g,''))+'">撥號 '+esc(r.tel)+'</a></dd>':'')
    +'<dt>開放時間</dt><dd>'+(r.hours.length?r.hours.map(h=>'<div>'+esc(h)+'</div>').join('')+'<div class="small">咕狗登記的，可能過時</div>':'咕狗沒有登記（公園多半全天開放）')+'</dd>'
    +(r.web?'<dt>網站</dt><dd><a href="'+esc(r.web)+'" target="_blank" rel="noopener">打開網站</a></dd>':'')
    +'<dt>5 則評論</dt><dd>'+r.reviews5.map(v=>'<div class="q"><span class="small">'+esc(v.age)+(v.stars?'・'+esc(v.stars)+' 星':'')+'</span><br>'+hl(v.text)+'</div>').join('')+'</dd>'
    +'</dl>'
    +'<div class="dacts"><a class="btn pri" href="'+esc(r.url)+'" target="_blank" rel="noopener">在咕狗地圖打開</a><button data-id="'+r.id+'" data-v="keep" class="'+(state[r.id]==='keep'?'on':'')+'">留</button><button data-id="'+r.id+'" data-v="drop" class="'+(state[r.id]==='drop'?'on':'')+'">不要</button><button data-map="'+r.id+'">地圖</button><span style="flex:1"></span><button id="dclose">關閉</button></div>';
  $('dim').classList.add('open');
}
document.addEventListener('click',e=>{
  const a=e.target.closest('a[data-detail]');if(a){e.preventDefault();detail(byId[a.dataset.detail]);return;}
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.f!=null){const k=b.dataset.f,v=b.dataset.v;if(!v)F[k]=[];else{const sel=F[k]||[];F[k]=sel.includes(v)?sel.filter(x=>x!==v):[...sel,v];}saveF();render();return;}
  if(b.id==='fToggle'){document.body.classList.toggle('fopen');b.textContent=document.body.classList.contains('fopen')?'篩選 ▴':'篩選 ▾';return;}
  if(b.id==='fClear'){F={};saveF();$('fQ').value='';$('fHideDrop').checked=false;$('fOnlyKeep').checked=false;render();return;}
  if(b.dataset.id){const id=b.dataset.id,v=b.dataset.v;state[id]=state[id]===v?'':v;save();render();if($('dim').classList.contains('open'))detail(byId[id]);return;}
  if(b.dataset.detail){detail(byId[b.dataset.detail]);return;}
  if(b.dataset.map){$('dim').classList.remove('open');setMap(true);const r=byId[b.dataset.map];setTimeout(()=>{map.setView([r.lat,r.lng],16);if(markers[r.id])markers[r.id].openPopup();},120);return;}
  if(b.id==='dclose'){$('dim').classList.remove('open');}
  if(b.id==='mapToggle'){setMap(!document.body.classList.contains('mapon'));}
  if(b.id==='mapClose'){setMap(false);}
  if(b.id==='mapFull'){document.body.classList.toggle('mapfull');b.textContent=document.body.classList.contains('mapfull')?'縮回':'滿版';setTimeout(()=>map&&map.invalidateSize(),50);}
});
window.addEventListener('resize',()=>map&&map.invalidateSize());
$('dim').addEventListener('click',e=>{if(e.target===e.currentTarget)$('dim').classList.remove('open');});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('dim').classList.remove('open');if(document.body.classList.contains('mapfull'))$('mapFull').click();}});
for(const id of ['fSort','fHideDrop','fOnlyKeep','fQ'])$(id).addEventListener('change',render);
$('fQ').addEventListener('input',render);
const copyList=v=>{
  const list=ROWS.filter(r=>state[r.id]===v).map(r=>r.name+' '+r.url);
  const text='【'+(v==='keep'?'留':'不要')+'】'+list.length+' 個\n'+list.join('\n');
  navigator.clipboard.writeText(text).then(()=>alert('複製了 '+list.length+' 個'));
};
$('copyKeep').onclick=()=>copyList('keep');
$('copyDrop').onclick=()=>copyList('drop');
render();
let mapPref='';try{mapPref=localStorage.getItem(KEY+'-map')||''}catch(e){}
if(mapPref&&window.innerWidth>900)setMap(true);
</script>
</body>
