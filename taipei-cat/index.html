function drawRoutes(){
  const ks=selParks();if(!routeLayer||routeKey===ks.join())return;routeKey=ks.join();routeLayer.clearLayers();
  const all=[];
  for(const k of ks){
    const rs=ROUTES[k]||[];
    for(const r of rs.slice().sort((a,b)=>a.main-b.main))L.polyline(r.pts,{color:r.main?'#2b6cb0':'#8aa9cc',weight:r.main?5:3,opacity:r.main?.8:.6,dashArray:r.main?null:'6 6'}).addTo(routeLayer).bindTooltip(PN[k]+'：'+(r.main?'咕狗建議的路線：':'另一條：')+r.desc);
    const p=PARKS[k];
    L.circleMarker([p.lat,p.lng],{radius:10,color:'#1d7a4a',fillColor:'#1d7a4a',fillOpacity:1}).addTo(routeLayer).bindTooltip(p.name+'（停車場）',{permanent:true,direction:'top'});
    all.push(...rs.flatMap(r=>r.pts),[p.lat,p.lng]);
  }
  if(all.length)map.fitBounds(L.latLngBounds(all),{padding:[20,20]});
}

  pet:{label:'寵物',opts:['評論提到','摘要或 5 則提到','簡介：狗可入內','簡介：狗限戶外','簡介：狗狗友善','評論沒提到','評論未搜'],get:r=>[...(r.scanHits?['評論提到']:[]),...(r.clues.length&&!r.scanHits?['摘要或 5 則提到']:[]),...r.dog.map(t=>'簡介：'+t.replace('允許帶狗進入戶外區域','狗限戶外').replace('允許狗狗入內','狗可入內')),...(r.scanned&&!r.scanHits?['評論沒提到']:[]),...(!r.scanned?['評論未搜']:[])]},
  rating:{label:'咕狗評分',opts:['5.0','4.9','4.8','4.7','4.6'],get:r=>[r.ratingB],suffix:' 分'},
  review:{label:'評論數',opts:['1,000則以上','500-999則','200-499則','100-199則','60-99則','50-59則','40-49則','30-39則','20-29則','10-19則'],get:r=>[r.reviewB]},
  price:{label:'價位（每人）',opts:['$1–200','$200–400','$400–600','$600–800','$800–1,000','$1,000 以上','便宜（$）','中等（$$）','偏貴（$$$）','很貴（$$$$）','沒資料'],get:r=>[r.priceB]},
  svc:{label:'內用外帶外送',opts:['可內用','可外帶','不外帶','可外送','不外送','三樣都沒有','還沒查'],get:r=>r.svcKeys},
  inv:{label:'統一發票',opts:['會開統一發票','免用統一發票','不確定','查不到'],get:r=>[r.invKey]},
  lowmin:{label:'低消',opts:['一杯飲品','任一品項','一份餐','金額','只有包廂','明講沒有','有但看不出是什麼','沒提到'],get:r=>[r.lowminKey]},
  hz:{label:'有雷',opts:['可抽菸','有菸味','不衛生','都沒提到'],get:r=>r.hzKeys},
  svcfee:{label:'服務費',opts:['有收','明講不收','說法不一','沒提到'],get:r=>[r.svcfeeKey]},
  group:{label:'咕狗簡介',opts:['適合團體聚會','有停車資訊','安靜','環境舒適'],get:r=>[...r.nice.filter(t=>t!=='休閒'),...(r.park.length?['有停車資訊']:[])]},
};
const FKEY=KEY+'-filters';
let F={};try{F=JSON.parse(localStorage.getItem(FKEY)||'{}')}catch(e){F={}}
const saveF=()=>{try{localStorage.setItem(FKEY,JSON.stringify(F))}catch(e){}};
const PRICE_SORT={PRICE_LEVEL_INEXPENSIVE:100,PRICE_LEVEL_MODERATE:300,PRICE_LEVEL_EXPENSIVE:700,PRICE_LEVEL_VERY_EXPENSIVE:1200};
function passes(r,except){
  for(const [k,d] of Object.entries(ROWS_F)){
    if(k===except)continue;
    const sel=F[k]||[];if(!sel.length)continue;
    const v=d.get(r);if(!sel.some(x=>v.includes(x)))return false;
  }
  if(!selParks().some(k=>r.ways[k]))return false;
  if($('fHideDrop').checked&&state[r.id]==='drop')return false;
  if($('fOnlyKeep').checked&&state[r.id]!=='keep')return false;
  const q=$('fQ').value.trim().toLowerCase();if(q&&!r.text.includes(q))return false;
  return true;
}
function renderPanel(){
  $('fpanel').innerHTML=Object.entries(ROWS_F).map(([k,d])=>{
    const cnt={};for(const r of ROWS){if(!passes(r,k))continue;for(const v of d.get(r))cnt[v]=(cnt[v]||0)+1;}
    const sel=F[k]||[];
    const opts=d.opts.filter(o=>cnt[o]||sel.includes(o));
    if(!opts.length)return '';
    return '<div class="frow"><div class="flabel">'+d.label+'</div><div class="fopts">'
      +'<button data-f="'+k+'" data-v="" class="'+(sel.length?'':'on')+'">全部</button>'
      +opts.map(o=>'<button data-f="'+k+'" data-v="'+esc(o)+'" class="'+(sel.includes(o)?'on':'')+'">'+esc(o)+(d.suffix||'')+'<span class="n">'+(cnt[o]||0)+'</span></button>').join('')
      +'</div></div>';
  }).join('');
}
function filtered(){
  const sort=$('fSort').value;
  let out=ROWS.filter(r=>passes(r));
  const pn=r=>r.priceNum!=null?r.priceNum:(PRICE_SORT[r.priceLevel]||99999);
  const ln=r=>{const m=(r.lowmin||'').match(/\$([\d,]+)/);return r.lowminKey==='明講沒有'?0:r.lowminKey==='沒提到'?1:m?+m[1].replace(/,/g,''):5;};
  // 照路上先後＝離停車場由遠到近（店開到停車場的車程公里）；多繞少＝先 5 分內、再 5 到 10 分，同一格照路上先後
  // 照路上先後看選的第一個公園（沒選＝士林官邸）；那個公園不順路的店排最後
  const k0=selParks()[0];
  const tp=r=>r.ways[k0]?r.ways[k0].toPark:-1,db=r=>Math.min(...selParks().filter(k=>r.ways[k]).map(k=>r.ways[k].b==='5 分內'?0:1));
  out.sort((a,b)=>sort==='score'?(b.score-a.score)||(db(a)-db(b)):sort==='route'?tp(b)-tp(a):sort==='detour'?(db(a)-db(b))||(tp(b)-tp(a)):sort==='km'?(a.km||0)-(b.km||0):sort==='rating'?(b.rating-a.rating)||(b.reviews-a.reviews):sort==='reviews'?b.reviews-a.reviews:sort==='price'?pn(a)-pn(b):ln(a)-ln(b));
  return out;
}
let lastRows=[];
function drawMarkers(rows){
  if(!layer)return;drawRoutes();layer.clearLayers();markers={};
  for(const r of rows){
    const st=state[r.id]||'';
    const m=L.circleMarker([r.lat,r.lng],{radius:7,color:st==='drop'?'#b23a3a':st==='keep'?'#1d7a4a':'#2b6cb0',fillOpacity:.85,weight:1}).addTo(layer);
    m.bindPopup('<b>'+esc(r.name)+'</b><br>'+esc(wayText(r))+'・'+r.rating+' 星'+(r.km!=null?'・離家 '+r.km+' 公里':'')+'<br>'+esc(r.satText)+'<br><a href="#" data-detail="'+r.id+'">詳細</a>　<a href="'+esc(r.url)+'" target="_blank" rel="noopener">咕狗地圖</a>');
    markers[r.id]=m;
  }
}
function render(){
  renderPanel();
  const rows=filtered();lastRows=rows;
  $('count').textContent='符合 '+rows.length+' 家';
  $('list').innerHTML=rows.map(r=>{
    const st=state[r.id]||'';
    const price=r.price?r.price.replace(/ 以上$/,'+'):'';
    const info=[r.district.replace(/區$/,''),r.km!=null&&'離家 '+r.km+' 公里',r.rating.toFixed(1)+'★ '+r.reviews.toLocaleString()+'則',price||'價位?',r.lowmin&&'低消 '+r.lowmin,r.svcfee&&r.svcfee!=='免服務費'?r.svcfee:'',r.satText].filter(Boolean).join('・');
    return '<div class="row '+st+'" id="c-'+r.id+'">'
      +'<a class="name" href="'+esc(r.url)+'" target="_blank" rel="noopener" title="'+esc(r.name)+'（在咕狗地圖打開）">'+esc(r.name)+'</a>'
      +'<span class="c-dist" title="'+esc(r.district)+(r.km!=null?'・離家 '+r.km+' 公里':'')+'">'+esc(r.district.replace(/區$/,''))+'</span>'
      +'<span class="c-info">'+esc(info)+'</span>'
      +'<span class="c-sells" title="'+esc(wayText(r))+'　賣什麼：'+esc(r.sells)+'">'+esc(wayText(r))+'｜'+esc(r.sells||'沒寫')+'</span>'
      +'<span class="c-rating">'+r.rating.toFixed(1)+'</span><span class="c-reviews">'+r.reviews.toLocaleString()+'</span>'
      +'<span class="c-price" title="每人">'+esc(price||'沒資料')+'</span>'
      +'<span class="c-lowmin" title="'+esc(r.lowminNote)+'">'+esc(r.lowmin)+'</span>'
      +'<span class="c-svcfee" title="'+esc(r.svcfeeNote)+'">'+esc(r.svcfee.replace('服務費有收','有收').replace('免服務費','免').replace('服務費不一','不一'))+'</span>'
      +'<span class="c-sat" title="'+esc(r.satText)+'">'+esc(r.satText.replace(/^週六\s*/,''))+'</span>'
      +'<span class="tags c-tags">'+noteTags(r).join('')+'</span>'
      +'<span class="acts"><button data-id="'+r.id+'" data-v="keep" class="'+(st==='keep'?'on':'')+'">'+(st==='keep'?'已留':'留')+'</button><button data-id="'+r.id+'" data-v="drop" class="'+(st==='drop'?'on':'')+'">不要</button><button data-detail="'+r.id+'">詳細</button><button data-map="'+r.id+'">地圖</button></span>'
      +'</div>';
  }).join('');
  drawMarkers(rows);
  const keep=ROWS.filter(r=>state[r.id]==='keep').length,drop=ROWS.filter(r=>state[r.id]==='drop').length;
  $('tally').textContent='留 '+keep+' 家，不要 '+drop+' 家';
}
function detail(r){
  const q=(arr,f)=>arr.map(x=>'<div class="q">'+esc(f?f(x):'')+esc(x.src||'')+(x.age?'・'+esc(x.age):'')+'：'+esc(x.text)+'</div>').join('');
  const svc=r.svc?[['內用',r.svc.dineIn],['外帶',r.svc.takeout],['外送',r.svc.delivery]].map(([k,v])=>v===false?'不'+k:v===true?k:k+'沒登記').join('、')+'（咕狗登記的，去之前再跟店家確認）':'這家只查了評分那一級的資料';
  $('dlg').innerHTML='<h2>'+esc(r.name)+'</h2><div class="tags">'+noteTags(r).join('')+'</div>'
    +'<dl>'
    +'<dt>寵物線索</dt><dd>'+(r.clues.length?r.clues.map(c=>'<div class="clue"><span class="src">'+esc(c.src)+'</span>…'+hl(c.text)+'…</div>').join(''):'手上的評論與摘要都沒提到<span class="small">（'+(r.scanned?'咕狗全部評論也搜過了':'咕狗全部評論還沒搜')+'）</span>')+'</dd>'
    +(r.summary?'<dt>咕狗摘要</dt><dd class="q">'+hl(r.summary)+'</dd>':'')
    +(r.lots?'<dt>停車</dt><dd>'+(r.lots.length?r.lots.map(l=>'<div><a href="https://www.google.com/maps/dir/?api=1&destination='+l.lat+','+l.lng+'" target="_blank" rel="noopener">'+esc(l.name)+'</a>　離店 '+l.d+' 公尺・'+(l.car?l.car+' 格・':'')+esc(l.fee)+'</div>').join(''):'100 公尺內沒有停車場，最近的離店 '+r.lotNear+' 公尺')+'<span class="small">（停管處的停車場資料、直線距離，不含路邊停車格；點名字開導航）</span></dd>':'')
    +(r.sv?'<dt>門口路邊</dt><dd>'+esc(r.sv)+'</dd>':'')
    +(r.road?'<dt>路邊停車</dt><dd>'+(r.road.n?r.road.groups.map(g=>'<div>'+esc(g.road)+'　'+esc(g.kind)+' '+g.n+' 格・最近的離店 '+g.d+' 公尺'+(g.rate?'・每小時 '+esc(g.rate)+' 元':'')+(g.time?'・'+esc(g.time):'')+'</div>').join(''):'100 公尺內沒有路邊汽車格')+(r.road.nShare?'<div>另有汽機車共用格 '+r.road.nShare+' 格（有的時段只給機車）</div>':'')+'<span class="small">（停管處路邊停車格位圖，10 月 2 日版、直線距離；費率沒寫不代表免費。沒畫格子、只畫白色邊線的路邊不在資料裡）</span></dd>':'')
    +'<dt>順路</dt><dd>'+Object.entries(r.ways).map(([k,w])=>'往'+esc(PARKS[k].name)+'：多繞 '+esc(w.b)+'，店開到停車場 '+w.toPark+' 公里').join('<br>')+'<span class="small">（咕狗不算塞車的車程，沒算找車位的時間）</span></dd>'
    +'<dt>評分</dt><dd>'+r.rating.toFixed(1)+' 分（'+r.reviews.toLocaleString()+' 則評論）</dd>'
    +'<dt>價位</dt><dd>'+(r.price?'每人 '+esc(r.price):'咕狗沒有資料')+'</dd>'
    +'<dt>內用外帶外送</dt><dd>'+esc(svc)+'</dd>'
    +'<dt>低消</dt><dd>'+(r.lowminNote?esc(r.lowminNote)+'<span class="small">（看評論與菜單照片判的，規定可能改過，去之前再問店家）</span>':'沒人提到<span class="small">（評論搜過「低消」、菜單照片也讀過，都沒寫；沒寫不等於一定沒有）</span>')+q(r.lowminQ)+'</dd>'
    +'<dt>有雷</dt><dd>'+(r.hz.length?esc(r.hz.join('、')):'都沒提到<span class="small">（只看了手上有的評論，不是全部）</span>')+q(r.hzQ,x=>(({in:'店內可抽菸',smell:'有菸味',dirty:'不衛生'})[x.kind]||'')+'｜')+'</dd>'
    +'<dt>服務費</dt><dd>'+(r.svcfeeNote?esc(r.svcfeeNote):'沒人提到<span class="small">（菜單照片的字、評論原句都沒寫；沒寫不等於不收）</span>')+q(r.svcfeeQ)+'</dd>'
    +(r.cuisine?'<dt>料理</dt><dd>'+esc(r.cuisine)+'<span class="small">（看菜單與評論判的）</span></dd>':'')
    +'<dt>賣什麼</dt><dd>'+esc(r.sells||'沒寫')+'</dd>'
    +'<dt>咕狗簡介</dt><dd>'+esc([...r.dog,...r.nice,...r.park].join('、')||'沒有寵物、環境、停車的標示')+'</dd>'
    +'<dt>咕狗類型</dt><dd>'+esc(r.type||'沒有資料')+'</dd>'
    +(r.km!=null?'<dt>離家</dt><dd>'+r.km+' 公里<span class="small">（直線距離）</span></dd>':'')
    +'<dt>地址</dt><dd>'+esc(r.district)+'　'+esc(r.addr)+'</dd>'
    +'<dt>電話</dt><dd>'+(r.tel?'<a href="tel:'+esc(r.tel.replace(/\s/g,''))+'">撥號 '+esc(r.tel)+'</a>':'咕狗沒有登記')+'</dd>'
    +'<dt>營業時間</dt><dd>'+(r.hours.length?r.hours.map(h=>'<div>'+esc(h)+'</div>').join('')+(r.off.length&&r.off.length<7?'<div>每週固定公休：週'+r.off.join('、')+'</div>':'')+'<div class="small">咕狗登記的，可能過時</div>':'咕狗沒有登記')+'</dd>'
    +(r.web?'<dt>網站</dt><dd><a href="'+esc(r.web)+'" target="_blank" rel="noopener">打開店家網站</a></dd>':'')
    +'</dl>'
    +'<div class="dacts"><a class="btn pri" href="'+esc(r.url)+'" target="_blank" rel="noopener">在咕狗地圖打開</a><button data-id="'+r.id+'" data-v="keep" class="'+(state[r.id]==='keep'?'on':'')+'">留</button><button data-id="'+r.id+'" data-v="drop" class="'+(state[r.id]==='drop'?'on':'')+'">不要</button><button data-map="'+r.id+'">地圖</button><span style="flex:1"></span><button id="dclose">關閉</button></div>';
  $('dim').classList.add('open');
}
document.addEventListener('click',e=>{
  const a=e.target.closest('a[data-detail]');if(a){e.preventDefault();detail(byId[a.dataset.detail]);return;}
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.f!=null){const k=b.dataset.f,v=b.dataset.v;if(!v)F[k]=[];else{const sel=F[k]||[];F[k]=sel.includes(v)?sel.filter(x=>x!==v):[...sel,v];}saveF();render();return;}
  if(b.id==='fToggle'){document.body.classList.toggle('fopen');b.textContent=document.body.classList.contains('fopen')?'篩選 ▴':'篩選 ▾';return;}
  if(b.id==='fClear'){F={};saveF();$('fQ').value='';$('fHideDrop').checked=false;$('fOnlyKeep').checked=false;render();return;}
  if(b.dataset.id){const id=b.dataset.id,v=b.dataset.v;state[id]=state[id]===v?'':v;save();render();if($('dim').classList.contains('open'))detail(byId[id]);return;}
  if(b.dataset.detail){detail(byId[b.dataset.detail]);return;}
  if(b.dataset.map){$('dim').classList.remove('open');setMap(true);const r=byId[b.dataset.map];setTimeout(()=>{map.setView([r.lat,r.lng],16);if(markers[r.id])markers[r.id].openPopup();},120);return;}
  if(b.id==='dclose'){$('dim').classList.remove('open');}
  if(b.id==='mapToggle'){setMap(!document.body.classList.contains('mapon'));}
  if(b.id==='mapClose'){setMap(false);}
  if(b.id==='mapFull'){document.body.classList.toggle('mapfull');b.textContent=document.body.classList.contains('mapfull')?'縮回':'滿版';setTimeout(()=>map&&map.invalidateSize(),50);}
});
window.addEventListener('resize',()=>map&&map.invalidateSize());
$('dim').addEventListener('click',e=>{if(e.target===e.currentTarget)$('dim').classList.remove('open');});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('dim').classList.remove('open');if(document.body.classList.contains('mapfull'))$('mapFull').click();}});
for(const id of ['fSort','fHideDrop','fOnlyKeep','fQ'])$(id).addEventListener('change',render);
$('fQ').addEventListener('input',render);
const copyList=v=>{
  const list=ROWS.filter(r=>state[r.id]===v).map(r=>r.name+' '+r.url);
  const text='【'+(v==='keep'?'留':'不要')+'】'+list.length+' 家\n'+list.join('\n');
  navigator.clipboard.writeText(text).then(()=>alert('複製了 '+list.length+' 家'));
};
$('copyKeep').onclick=()=>copyList('keep');
$('copyDrop').onclick=()=>copyList('drop');
render();
let mapPref='';try{mapPref=localStorage.getItem(KEY+'-map')||''}catch(e){}
if(mapPref&&window.innerWidth>900)setMap(true);
</script>
